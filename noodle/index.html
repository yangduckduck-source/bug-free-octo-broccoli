<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>양국수 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
  /* 한 화면: 비 오는 밤 포장마차. 위는 주황 천막과 백열등, 가운데 손님, 아래는 밀가루 뿌린 도마와 두 손.
     게임 화면은 캔버스 하나, 버튼만 문서 위에 띄운다. 밤 장면 하나로만 그린다 (밝은 테마 없음). */
  :root {
    color-scheme: dark;
    --night: #0b1022;
    --wood: #b98a55;
    --lamp: #ffc46b;
    --ink: #f6efe0;
    --pen: "Nanum Pen Script", "Apple SD Gothic Neo", "Malgun Gothic", cursive;
    --sign: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  html, body { height: 100%; margin: 0; background: var(--night); overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #snd {
    position: fixed; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    font: 22px var(--pen); color: var(--ink); background: rgba(20, 14, 10, .55); border: 1.5px solid rgba(255, 220, 160, .45);
    border-radius: 999px; padding: 6px 16px 4px; cursor: pointer;
  }
  #snd:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c" aria-label="양국수 뽑기 게임 화면. 누르고 있으면 반죽이 늘어나고, 놓으면 반으로 접힌다."></canvas>
<button id="snd" type="button">소리 켬</button>
<script>
(() => {
  "use strict";
  // ================= 화면 =================
  const W = 480, H = 720;            // 논리 좌표 (세로 화면)
  const COUNTER = 318;               // 계산대 윗면 높이
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let S = 1, OX = 0, OY = 0, DPR = 1, EX0 = 0, EX1 = W, EY0 = 0, EY1 = H, bgCache = null;
  function fit() {
    const vv = window.visualViewport, w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    S = Math.min(w / W, h / H); OX = (w - W * S) / 2; OY = (h - H * S) / 2;
    EX0 = -OX / S; EX1 = W + OX / S; EY0 = -OY / S; EY1 = H + OY / S;
    bgCache = null;
  }
  addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);
  fit();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeIO = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const won = n => "₩" + Math.round(n).toLocaleString("ko-KR");
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // ================= 소리 =================
  let actx = null, master = null, noiseBuf = null, sndOn = true, guardAT = -1, guardWall = 0, rainNode = null;
  function audio() {
    if (actx) return actx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      actx = new AC(); master = actx.createGain(); master.gain.value = sndOn ? 0.9 : 0; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
    return actx;
  }
  // 소리 지킴이: 휴대폰이 소리를 재우거나 얼려 두면 손이 닿을 때마다 깨운다
  function wakeAudio() {
    try { if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback"; } catch (e) {}
    if (!actx) return;
    try {
      const t = performance.now();
      if (actx.state === "running" && guardAT >= 0 && t - guardWall > 1500 && actx.currentTime === guardAT) {
        try { actx.close(); } catch (e) {}
        actx = null; rainNode = null; audio(); if (!actx) return; if (state === "play") startRain();
      }
      if (actx.state !== "running") actx.resume();
      const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
      src.buffer = b; src.connect(actx.destination); src.start(0);
      guardAT = actx.currentTime; guardWall = t;
    } catch (e) {}
  }
  ["pointerdown", "pointerup", "touchend", "click", "keydown"].forEach(ev => addEventListener(ev, wakeAudio, { capture: true, passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wakeAudio(); });
  addEventListener("pageshow", wakeAudio);

  function tone(f, dur, type = "sine", vol = 0.1, to = 0, delay = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, type = "lowpass", freq = 800, q = 0.7, delay = 0, to = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master); src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  }
  const sfx = {
    // 반죽을 도마에 탕! 내리치는 소리: 낮은 쿵 + 밀가루 퍽
    slam(k = 1) { tone(130, 0.24, "sine", 0.7 * k, 42); noise(0.16, 0.45 * k, "lowpass", 900); noise(0.08, 0.18 * k, "bandpass", 2400, 1.2); },
    // 반으로 접을 때 휙
    whoosh() { noise(0.26, 0.12, "bandpass", 500, 2, 0, 2200); },
    // 끊어질 때 툭
    snap() { noise(0.05, 0.5, "highpass", 2500); tone(420, 0.2, "triangle", 0.25, 70); noise(0.3, 0.15, "lowpass", 500, 0.7, 0.05); },
    // 냄비에 첨벙
    splash() { noise(0.35, 0.28, "bandpass", 1400, 0.8, 0, 500); noise(0.5, 0.08, "highpass", 4000, 0.7, 0.08); },
    coin() { tone(1960, 0.14, "sine", 0.13); tone(2620, 0.22, "sine", 0.11, 0, 0.07); tone(3930, 0.18, "sine", 0.04, 0, 0.07); },
    slurp() { for (let i = 0; i < 3; i++) noise(0.18, 0.14, "bandpass", 700 + i * 150, 3, i * 0.2, 2600); },
    huff() { noise(0.4, 0.16, "bandpass", 380, 1.5, 0, 180); tone(160, 0.3, "triangle", 0.06, 110); },
    bell() { tone(1318, 0.5, "sine", 0.08); tone(1760, 0.6, "sine", 0.05, 0, 0.12); },
    blub() { const f = rand(160, 300); tone(f, 0.07, "sine", 0.035, f * 1.6); },
    tick() { tone(1600, 0.03, "square", 0.02); },
    close() { tone(784, 0.25, "triangle", 0.12); tone(659, 0.25, "triangle", 0.12, 0, 0.22); tone(523, 0.6, "triangle", 0.12, 0, 0.44); },
  };
  // 늘리는 동안 반죽이 버티는 소리: 끊어질 때가 가까울수록 높고 거칠게 끼익
  let creak = null;
  function creakStart() {
    const a = audio(); if (!a || creak) return;
    const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain(), n = a.createBufferSource(), nf = a.createBiquadFilter(), ng = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 70; f.type = "bandpass"; f.frequency.value = 600; f.Q.value = 6; g.gain.value = 0.0001;
    n.buffer = noiseBuf; n.loop = true; nf.type = "bandpass"; nf.frequency.value = 1800; nf.Q.value = 4; ng.gain.value = 0.0001;
    o.connect(f).connect(g).connect(master); n.connect(nf).connect(ng).connect(master);
    o.start(); n.start();
    creak = { o, f, g, n, nf, ng };
  }
  function creakSet(s, r, wob) {
    if (!creak || !actx) return;
    const t = actx.currentTime, k = Math.pow(clamp(r, 0, 1), 3);
    creak.o.frequency.setTargetAtTime(60 + s * 120 + k * 160 + wob * 30, t, 0.03);
    creak.f.frequency.setTargetAtTime(500 + k * 1400, t, 0.05);
    creak.g.gain.setTargetAtTime(0.012 + k * 0.09, t, 0.03);
    creak.nf.frequency.setTargetAtTime(1400 + k * 2400, t, 0.05);
    creak.ng.gain.setTargetAtTime(k * 0.05, t, 0.03);
  }
  function creakStop() {
    if (!creak || !actx) { creak = null; return; }
    const c = creak, t = actx.currentTime; creak = null;
    c.g.gain.setTargetAtTime(0.0001, t, 0.02); c.ng.gain.setTargetAtTime(0.0001, t, 0.02);
    c.o.stop(t + 0.15); c.n.stop(t + 0.15);
  }
  // 천막 밖 빗소리
  function startRain() {
    const a = audio(); if (!a || rainNode) return;
    const n = a.createBufferSource(), f = a.createBiquadFilter(), f2 = a.createBiquadFilter(), g = a.createGain();
    n.buffer = noiseBuf; n.loop = true; f.type = "bandpass"; f.frequency.value = 3200; f.Q.value = 0.5; f2.type = "lowpass"; f2.frequency.value = 7000;
    g.gain.value = 0.035; n.connect(f).connect(f2).connect(g).connect(master); n.start(); rainNode = n;
  }
  const vib = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

  const sndBtn = document.getElementById("snd");
  sndBtn.addEventListener("pointerdown", e => e.stopPropagation());
  sndBtn.addEventListener("click", e => {
    e.stopPropagation(); sndOn = !sndOn; sndBtn.textContent = sndOn ? "소리 켬" : "소리 끔"; sndBtn.blur();
    if (audio()) master.gain.value = sndOn ? 0.9 : 0;
  });

  // ================= 주문표 =================
  // 접는 횟수 T → 가닥 2^T. 가늘수록 비싸다
  const MENU = {
    2: ["굵은 면", 5000], 3: ["우동", 6000], 4: ["중면", 7000], 5: ["소면", 8000],
    6: ["세면", 9000], 7: ["실국수", 11000], 8: ["용수염면", 14000],
  };
  const TYPES = [
    { skin: "#f0c9a5", hair: "#1b1b22", style: "side", top: "#2e3a55", shirt: "#e9edf3", tie: "#b0303a", hello: "하나 말아 주세요!" },
    { skin: "#f4d1b0", hair: "#2a1c14", style: "bob", top: "#22402f", shirt: "#f5f5f5", tie: "#7a2230", hello: "이모, 저 이거요!" },
    { skin: "#e8bf9b", hair: "#d2cdc6", style: "perm", top: "#8a4f7d", shirt: "#c78db6", hello: "따끈하게 하나." },
    { skin: "#d9a57c", hair: "#232323", style: "cap", cap: "#2d5b8a", top: "#5b5f34", shirt: "#7d8247", hello: "사장님, 여기요!" },
    { skin: "#f2cdb0", hair: "#5a2d1c", style: "long", top: "#b8432e", shirt: "#f0e2cf", hello: "배고파요, 빨리요!" },
  ];

  // ================= 상태 =================
  const DAY = 90;                     // 영업 시간(초) — 저녁 6시부터 새벽 2시까지로 보여 준다
  let state = "title", T0 = 0, now = 0, last = performance.now();
  let money = 0, bowls = 0, chewy = 0, torn = 0, best = +(store.get("noodle.best") || 0), overAt = 0, newBest = false;
  let cust = null, nextCustAt = 0, dough = null, pops = [], parts = [], steam = [], drops = [], bowl = null, jolt = null, closing = false;
  let down = false, fresh = false, stretchHeld = false;

  const dayP = () => clamp((now - T0) / DAY, 0, 1);
  function newDough() { return { f: 0, s: 0, lim: rand(0.8, 0.95), phase: "ready", pt: now, q: [], wob: 0 }; }
  function newCustomer() {
    const p = dayP(), tmin = 2 + Math.floor(p * 3), tmax = Math.min(8, 4 + Math.floor(p * 4.6));
    let Tt = Math.floor(rand(tmin, tmax + 1)); Tt = clamp(Tt, 2, 8);
    const ty = TYPES[Math.floor(Math.random() * TYPES.length)];
    const maxP = 15 + Tt * 2.4;
    cust = { ty, T: Tt, maxP, pat: maxP, arriveAt: now, mood: "wait", moodUntil: 0, leaveAt: 0, x: 600, sayUntil: now + 2.2, blinkAt: now + rand(1, 3) };
    sfx.bell();
  }
  function setMood(m, dur) { if (cust) { cust.mood = m; cust.moodUntil = now + dur; } }
  function pop(text, x, y, color, size = 40, life = 1.1, font = "pen") { pops.push({ text, x, y, color, size, t0: now, life, font }); }

  function start() {
    state = "play"; T0 = now; money = 0; bowls = 0; chewy = 0; torn = 0; newBest = false; closing = false;
    cust = null; nextCustAt = now + 0.6; dough = newDough(); pops = []; bowl = null;
    startRain();
  }
  function finish() {
    state = "over"; overAt = now; creakStop(); down = false;
    if (money > best) { best = money; newBest = true; store.set("noodle.best", String(best)); }
    sfx.close();
  }

  // ================= 입력 =================
  function press() {
    audio(); wakeAudio();
    if (state === "title") { start(); return; }
    if (state === "over") { if (now - overAt > 1.2) start(); return; }
    down = true; fresh = true;
  }
  function release() { down = false; }
  addEventListener("pointerdown", e => { if (e.button > 0) return; press(); });
  addEventListener("pointerup", release); addEventListener("pointercancel", release);
  addEventListener("blur", release);
  addEventListener("keydown", e => {
    if (e.code !== "Space" && e.code !== "Enter") return;
    e.preventDefault(); if (e.repeat) return; press();
  });
  addEventListener("keyup", e => { if (e.code === "Space" || e.code === "Enter") release(); });
  addEventListener("contextmenu", e => e.preventDefault());

  // ================= 반죽 =================
  const REST_L = { x: 168, y: 548 }, REST_R = { x: 312, y: 548 };
  const FOLD = 0.36, SLAM = 0.42, SNAP = 0.75, SERVE = 1.5;
  function stretchSpeed(d) { return (0.4 + 0.075 * d.f + 0.16 * dayP()) * (0.65 + d.s); }

  function updateDough(dt) {
    const d = dough; if (!d) return;
    const ready = state === "play" && cust && cust.x < 260 && !cust.leaveAt;
    switch (d.phase) {
      case "ready":
        if (fresh && down && ready) { d.phase = "stretch"; d.pt = now; d.s = 0.02; stretchHeld = true; creakStart(); }
        break;
      case "stretch": {
        if (!down) {
          creakStop();
          if (d.s < 0.24) { d.phase = "relax"; d.pt = now; d.s0 = d.s; break; }
          // 접기: 끊어지기 직전까지 늘렸을수록 면이 고르다
          const r = d.s / d.lim, q = r >= 0.9 ? 1 : r >= 0.74 ? 0.7 : 0.35;
          d.q.push(q); d.lastR = r;
          if (q === 1) { chewy++; pop("쫄깃!", 240, 470, "#ffd36b", 50); }
          else if (q === 0.7) pop("좋아", 240, 470, "#f6efe0", 38);
          else pop("덜 늘였다", 240, 470, "#c9b8a0", 32);
          d.phase = "fold"; d.pt = now; d.sAtFold = d.s; sfx.whoosh();
          break;
        }
        d.s += stretchSpeed(d) * dt;
        const r = d.s / d.lim;
        d.wob = Math.pow(clamp((r - 0.74) / 0.26, 0, 1), 1.4);
        creakSet(d.s, r, d.wob);
        if (d.wob > 0.3 && Math.random() < d.wob * 0.5) flour(240 + rand(-30, 30), handsY(d) + 6, 1, 0.6);
        if (d.wob > 0.55 && Math.random() < 0.08) vib(6);
        if (d.s >= d.lim) snap();
        break;
      }
      case "relax":
        d.s = d.s0 * (1 - easeOut(clamp((now - d.pt) / 0.18, 0, 1)));
        if (now - d.pt >= 0.18) { d.phase = "ready"; d.s = 0; }
        break;
      case "fold":
        if (now - d.pt >= FOLD) { d.f++; d.phase = "slam"; d.pt = now; d.slammed = false; }
        break;
      case "slam":
        if (!d.slammed && now - d.pt >= 0.11) {
          d.slammed = true; sfx.slam(0.8 + d.f * 0.04); vib(22);
          jolt = { at: now, amp: 5 + d.f * 0.4 };
          flour(240, 600, 26, 1.6);
        }
        if (now - d.pt >= SLAM) {
          if (cust && d.f >= cust.T) { d.phase = "serve"; d.pt = now; d.served = false; }
          else { d.phase = "ready"; d.s = 0; }
        }
        break;
      case "snap":
        if (now - d.pt >= SNAP) { dough = newDough(); dough.phase = "fresh"; dough.pt = now; }
        break;
      case "fresh":   // 새 반죽을 집어 드는 중
        if (now - d.pt >= 0.35) { d.phase = "ready"; }
        break;
      case "serve":
        if (!d.served && now - d.pt >= 0.58) { d.served = true; sfx.splash(); steamBurst(); serveBowl(d); }
        if (now - d.pt >= SERVE) { dough = newDough(); dough.phase = "fresh"; dough.pt = now; }
        break;
    }
    fresh = false;
  }
  function snap() {
    const d = dough; creakStop();
    d.phase = "snap"; d.pt = now; torn++;
    sfx.snap(); vib([40, 30, 20]); jolt = { at: now, amp: 8 };
    flour(240, handsY(d), 34, 2.2);
    pop("툭!", 240, 450, "#ff7a5c", 64, 0.9, "sign");
    if (cust) { cust.pat -= cust.maxP * 0.22; setMood("shock", 1.0); }
  }
  function serveBowl(d) {
    const c = cust; if (!c) return;
    const avg = d.q.reduce((a, b) => a + b, 0) / d.q.length;
    const [, base] = MENU[c.T];
    const quick = c.pat / c.maxP;
    const price = Math.round((base * (0.6 + 0.4 * avg)) / 100) * 100;
    const tip = (d.q.filter(q => q === 1).length * 300) + (quick > 0.5 ? 1000 : 0);
    bowl = { at: now, T: c.T, price, tip, paid: false };
    c.served = true; setMood("eat", 1.3);
  }
  function handsY(d) { return REST_L.y - d.s * 22; }

  // ================= 손님 =================
  function updateCustomer(dt) {
    if (state !== "play") return;
    if (!cust) {
      if (!closing && now >= nextCustAt) newCustomer();
      return;
    }
    const c = cust;
    if (c.leaveAt) {
      c.x -= dt * 620;
      if (c.x < -160) { cust = null; nextCustAt = now + 0.5; }
      return;
    }
    if (c.x > 240) c.x = Math.max(240, c.x - dt * 700);
    if (!c.served) {
      c.pat -= dt;
      if (c.pat <= 0) {
        // 기다리다 지쳐 일어선다
        setMood("angry", 2); c.leaveAt = now + 0.7; pop("에잇, 됐어요!", 300, 170, "#ff8a6a", 38, 1.4);
        sfx.huff(); creakStop();
        if (dough && dough.phase !== "serve") { dough = newDough(); dough.phase = "fresh"; dough.pt = now; }
      }
    }
    if (bowl && !bowl.paid && now - bowl.at > 1.0) {
      bowl.paid = true; money += bowl.price + bowl.tip; bowls++;
      sfx.slurp(); setTimeout(() => sfx.coin(), 380);
      pop("후루룩", 330, 214, "#f6efe0", 40, 1.2);
      pop("+" + won(bowl.price + bowl.tip), 240, 150, "#ffd36b", 44, 1.5, "sign");
      if (bowl.tip >= 1300) pop("팁 " + won(bowl.tip), 240, 106, "#9be38c", 30, 1.5);
      setMood("happy", 1.4);
    }
    if (bowl && bowl.paid && now - bowl.at > 2.2) { bowl = null; c.leaveAt = now; }
    if (c.mood !== "wait" && now > c.moodUntil && !c.leaveAt) c.mood = "wait";
  }

  // ================= 입자 =================
  function flour(x, y, n, sp) {
    for (let i = 0; i < n; i++) {
      const a = rand(Math.PI * 1.05, Math.PI * 1.95), v = rand(0.4, 1) * sp * 60;

  // ---------- 반죽과 두 손 ----------
  function ropeGeom() {
    const d = dough; if (!d) return null;
    const e = now - d.pt;
    let L = { ...REST_L }, R = { ...REST_R }, sag = 66, s = d.s, strands = 1 << d.f, vis = true, loop = 0;
    const spread = s => 140 + s * 300;
    const atS = s => { const sp = spread(s); return [{ x: 240 - sp / 2, y: REST_L.y - s * 22 }, { x: 240 + sp / 2, y: REST_R.y - s * 22 }]; };
    switch (d.phase) {
      case "ready": case "relax": case "stretch": [L, R] = atS(s); sag = 66 * Math.pow(1 - clamp(s, 0, 1), 2) + 6; break;
      case "fold": {
        // 오른손이 활처럼 넘어와 왼손에 끝을 건넨다: 반죽이 고리로 늘어진다
        const u = easeIO(clamp(e / FOLD, 0, 1)), [L0, R0] = atS(d.sAtFold);
        L = { x: lerp(L0.x, 200, u), y: lerp(L0.y, 520, u) };
        R = { x: lerp(R0.x, 236, u), y: lerp(R0.y, 520, u) - Math.sin(u * Math.PI) * 150 };
        sag = lerp(8, 120, u); loop = u; break;
      }
      case "slam": {

        const u1 = clamp(e / 0.11, 0, 1), u2 = easeOut(clamp((e - 0.13) / (SLAM - 0.13), 0, 1));
        const yy = lerp(520, 572, u1 * u1) - (e > 0.11 ? 26 * u2 : 0);
        L = { x: lerp(200, REST_L.x, u2), y: lerp(yy, REST_L.y, u2) }; R = { x: lerp(236, REST_R.x, u2), y: lerp(yy, REST_R.y, u2) };

      case "snap": return { snap: true, e, strands, s: d.sAtSnap || d.s };
      case "fresh": { const u = easeOut(clamp(e / 0.35, 0, 1)); L = { x: REST_L.x - 20 * (1 - u), y: REST_L.y + 140 * (1 - u) }; R = { x: REST_R.x + 20 * (1 - u), y: REST_R.y + 140 * (1 - u) }; break; }
      case "serve": {

        const u = easeIO(clamp(e / 0.28, 0, 1));
        L = { x: lerp(REST_L.x, 222, u), y: lerp(REST_L.y, 452, u) }; R = { x: lerp(REST_R.x, 300, u), y: lerp(REST_R.y, 440, u) };
        sag = lerp(66, 30, u); vis = e < 0.28;
        if (e >= 0.28) { const u2 = easeOut(clamp((e - 0.3) / 0.6, 0, 1)); L = { x: lerp(222, REST_L.x - 30, u2), y: lerp(452, H + 140, u2) }; R = { x: lerp(300, REST_R.x + 30, u2), y: lerp(440, H + 140, u2) }; }
        break;
      }
    }

    return { L, R, sag, s, strands, vis, loop, r, wob: d.phase === "stretch" ? d.wob : 0 };
  }

  // 반죽 한 가닥 묶음: 가운데가 잘록해지고, 끊어질 때가 가까우면 파르르 떤다
  function drawRope(L, R, sag, w, strands, neck, wob, alpha = 1) {
    const N = 40, pts = [];
    const cx = (L.x + R.x) / 2, cy = (L.y + R.y) / 2 + sag * 2;
    for (let i = 0; i <= N; i++) {
      const t = i / N, it = 1 - t;
      let x = it * it * L.x + 2 * it * t * cx + t * t * R.x, y = it * it * L.y + 2 * it * t * cy + t * t * R.y;
      const env = Math.sin(t * Math.PI);
      y += Math.sin(now * 46 + t * 9) * wob * 3.2 * env;
      const dx = 2 * it * (cx - L.x) + 2 * t * (R.x - cx), dy = 2 * it * (cy - L.y) + 2 * t * (R.y - cy), l = Math.hypot(dx, dy) || 1;
      const nk = 1 - neck * Math.exp(-Math.pow((t - 0.5) / 0.14, 2));
      const ww = w * nk * (0.82 + 0.18 * Math.min(1, t * 6, (1 - t) * 6));
      pts.push({ x, y, nx: -dy / l, ny: dx / l, w: ww });
    }

    // 도마에 진 그림자

    pts.forEach((p, i) => { const sy = Math.max(p.y + 26, 560 + (p.y - 520) * 0.3); i ? ctx.lineTo(p.x + 8, sy) : ctx.moveTo(p.x + 8, sy); }); ctx.stroke();
    // 몸통
    ctx.beginPath();
    pts.forEach((p, i) => { const x = p.x + p.nx * p.w / 2, y = p.y + p.ny * p.w / 2; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; ctx.lineTo(p.x - p.nx * p.w / 2, p.y - p.ny * p.w / 2); }
    ctx.closePath();
    const pale = clamp(neck * 1.4, 0, 1);
    ctx.fillStyle = `rgb(${lerp(238, 250, pale) | 0},${lerp(222, 244, pale) | 0},${lerp(186, 226, pale) | 0})`; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(150,110,60,.45)"; ctx.stroke();
    // 가닥 사이 홈: 가닥이 많을수록 비단실처럼 촘촘하게
    const lines = Math.min(strands, 28);
    if (lines > 1) {
      ctx.lineWidth = strands > 28 ? 0.6 : 0.9;
      for (let k = 1; k < lines; k++) {
        const o = k / lines - 0.5;

        ctx.beginPath(); pts.forEach((p, i) => { const x = p.x + p.nx * p.w * o, y = p.y + p.ny * p.w * o; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
      }
    }
    // 위쪽 윤기
    ctx.strokeStyle = `rgba(255,255,250,${0.55 + pale * 0.3})`; ctx.lineWidth = Math.max(1, w * 0.12);
    ctx.beginPath(); pts.forEach((p, i) => { if (i < 3 || i > N - 3) return; const x = p.x + p.nx * p.w * 0.28, y = p.y + p.ny * p.w * 0.28; i === 3 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }); ctx.stroke();
    ctx.restore();
  }
  function ropeWidth(strands, s) { return (30 - Math.log2(strands) * 1.6) * (1 - 0.42 * clamp(s, 0, 1.1)); }

  function drawArm(side, hand) {
    // 요리사 팔: 팔꿈치 쪽이 굵고 손목으로 갈수록 가늘어진다. 흰 조리복 소매를 걷어 올렸다
    const ax = side < 0 ? 64 : 416, ay = H + 70;

    ctx.fillStyle = fg; ctx.beginPath(); ctx.ellipse(0, 0, 30, 27, 0, 0, 7); ctx.fill();

    ctx.beginPath(); ctx.ellipse(14, ty * 1.05, 5, 4, 0, 0, 7); ctx.fillStyle = "rgba(255,220,200,.6)"; ctx.fill();
    ctx.restore();
  }

  function drawDough() {
    const gm = ropeGeom(); if (!gm) return;
    if (gm.snap) { drawSnap(gm); return; }
    if (gm.vis) {
      const neck = gm.r > 0.6 ? clamp((gm.r - 0.6) / 0.4, 0, 1) * 0.55 : 0;
      drawRope(gm.L, gm.R, gm.sag, ropeWidth(gm.strands, gm.s), gm.strands, neck, gm.wob);
    }
    // 던진 면 다발: 포물선을 그리며 돌다가 냄비로 쏙
    const d = dough;
    if (d.phase === "serve") {
      const e = now - d.pt, u = clamp((e - 0.28) / 0.3, 0, 1);
      if (e >= 0.28 && u < 1) {
        const x = lerp(262, 408, u), y = lerp(446, 258, u) - Math.sin(u * Math.PI) * 120, sc = lerp(1, 0.55, u);
        ctx.save(); ctx.translate(x, y); ctx.rotate(u * 5); ctx.scale(sc, sc);

  function drawSnap(gm) {

    ctx.textAlign = "center"; ctx.font = "15px " + mono; ctx.fillStyle = "#555";
    ctx.fillText(newBest ? "★ 최고 매상 새로 씀 ★" : `최고 매상 ${won(best)}`, 240, y + 290);
    ctx.font = "26px " + cssVar("--pen"); ctx.fillStyle = "#333"; ctx.fillText("오늘도 수고했어요", 240, y + 330);
    if (e > 1.2) { ctx.globalAlpha = 0.55 + Math.sin(now * 4) * 0.35; ctx.font = "15px " + mono; ctx.fillText("누르면 내일 장사", 240, y + 370); }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!bgCache) bgCache = buildBg();
    let sx = 0, sy = 0;
    if (jolt) { const k = Math.max(0, 1 - (now - jolt.at) / 0.25); if (k <= 0) jolt = null; else { sx = rand(-1, 1) * jolt.amp * k; sy = rand(-1, 1) * jolt.amp * k * 0.7; } }
    ctx.drawImage(bgCache, (OX + EX0 * S + sx * S) * DPR, (OY + EY0 * S + sy * S) * DPR);
    ctx.setTransform(S * DPR, 0, 0, S * DPR, (OX + sx * S) * DPR, (OY + sy * S) * DPR);
    drawRain();
    const b = drawBulb();
    drawParticles();
    drawCustomer();
    drawBowl();
    drawTicket();
    drawStrandCount();
    drawDough();
    drawFlour();
    drawLight(b);
    drawHUD();
    drawPops();
    if (state === "title") drawTitle();
    if (state === "over") drawReceipt();
  }

  function update(dt) {
    if (state === "play") {
      if (!closing && now - T0 >= DAY) {
        closing = true; pop("영업 끝!", 240, 380, "#ffd36b", 64, 1.6, "sign");
        if (dough && dough.phase === "stretch") { creakStop(); dough.phase = "relax"; dough.pt = now; dough.s0 = dough.s; }
        setTimeout(finish, 1600);
      }
      if (!closing) updateDough(dt); else fresh = false;
      updateCustomer(dt);
    } else if (dough) { fresh = false; }
    updateParticles(dt);
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (!document.hidden) { now += dt; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  dough = newDough();
  requestAnimationFrame(frame);
  // 글꼴이 늦게 오면 배경의 네온 글씨를 다시 그린다
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bgCache = null; });

  // 테스트용 읽기 훅
  window.__nd = { get state() { return state; }, get dough() { return dough; }, get cust() { return cust; }, get money() { return money; }, get now() { return now; }, skip: s => { T0 -= s; } };
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>와이어 본딩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&display=swap">
<style>
  /* 한 화면: 본딩 장비의 현미경 렌즈 속 리드프레임. 위에 점수, 아래에 불 켜진 칩 트레이.
     캔버스 하나에 다 그리고, 소리 버튼만 문서 위에 띄운다. 어두운 장면 하나로만 그린다. */
  :root {
    color-scheme: dark;
    --bg: #040b09;
    --ink: #e6fff4;
    --dim: #6fa58f;
    --mint: #5dffc3;
    --amber: #ffb547;
    --kr: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --num: "Orbitron", ui-monospace, monospace;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #snd {
    position: fixed; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    font: 15px var(--kr); color: var(--ink); background: rgba(4, 20, 15, .7); border: 1.5px solid rgba(93, 255, 195, .4);
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  #snd:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c" aria-label="와이어 본딩 게임 화면. 본딩 헤드가 빛나는 패드 위에 왔을 때 눌러서 금선을 잇는다."></canvas>
<button id="snd" type="button">소리 켬</button>
<script>
(() => {
  "use strict";
  // ================= 화면 =================
  const W = 480, H = 720;
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let S = 1, OX = 0, OY = 0, DPR = 1, EX0 = 0, EX1 = W, EY0 = 0, EY1 = H, bgCache = null;
  function fit() {
    const vv = window.visualViewport, w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    S = Math.min(w / W, h / H); OX = (w - W * S) / 2; OY = (h - H * S) / 2;
    EX0 = -OX / S; EX1 = W + OX / S; EY0 = -OY / S; EY1 = H + OY / S;
    bgCache = null;
  }
  addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);
  fit();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const FONT = { kr: css("--kr"), num: css("--num") };
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); };

  // ================= 소리 =================
  let actx = null, master = null, noiseBuf = null, sndOn = true, guardAT = -1, guardWall = 0;
  function audio() {
    if (actx) return actx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      actx = new AC(); master = actx.createGain(); master.gain.value = sndOn ? 0.85 : 0; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
    return actx;
  }
  // 소리 지킴이: 휴대폰이 소리를 재우거나 얼려 두면 손이 닿을 때마다 깨운다
  function wakeAudio() {
    try { if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback"; } catch (e) {}
    if (!actx) return;
    try {
      const t = performance.now();
      if (actx.state === "running" && guardAT >= 0 && t - guardWall > 1500 && actx.currentTime === guardAT) {
        try { actx.close(); } catch (e) {}
        actx = null; audio(); if (!actx) return;
      }
      if (actx.state !== "running") actx.resume();
      const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
      src.buffer = b; src.connect(actx.destination); src.start(0);
      guardAT = actx.currentTime; guardWall = t;
    } catch (e) {}
  }
  ["pointerdown", "pointerup", "touchend", "click", "keydown"].forEach(ev => addEventListener(ev, wakeAudio, { capture: true, passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wakeAudio(); });
  addEventListener("pageshow", wakeAudio);

  function tone(f, dur, type = "sine", vol = 0.1, to = 0, delay = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, type = "highpass", freq = 2000, delay = 0, to = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t0); if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master); src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
  }
  // 딱 맞을 때마다 한 음씩 올라가는 5음 음계
  const PENTA = [0, 2, 4, 7, 9];
  const note = n => 523.25 * Math.pow(2, (Math.floor(n / 5) * 12 + PENTA[n % 5]) / 12);
  const sfx = {
    tick() { tone(2400, 0.025, "square", 0.035); noise(0.03, 0.14, "bandpass", 5200); },
    stitch() { tone(640, 0.07, "triangle", 0.2, 320); noise(0.035, 0.1, "bandpass", 2600); },
    perfect(n) { const f = note(Math.min(n, 19)); tone(f, 0.3, "sine", 0.2); tone(f * 2, 0.22, "sine", 0.06, 0, 0.02); tone(f * 1.5, 0.35, "triangle", 0.05, 0, 0.05); },
    good() { tone(740, 0.1, "sine", 0.07); },
    snap() { noise(0.16, 0.24, "highpass", 6500, 0, 1500); tone(1500, 0.12, "square", 0.035, 260); },
    buzz() { tone(110, 0.36, "sawtooth", 0.11, 82); tone(117, 0.36, "square", 0.04, 86); noise(0.3, 0.1, "lowpass", 700); },
    turn() { tone(150, 0.42, "triangle", 0.05, 230); noise(0.38, 0.03, "bandpass", 600, 0, 1500); },
    power() {
      tone(160, 0.8, "sine", 0.09, 880); noise(0.6, 0.04, "highpass", 7000, 0.15);
      [0, 4, 7, 12, 16].forEach((s, i) => tone(523.25 * Math.pow(2, s / 12), 0.8, "triangle", 0.08, 0, 0.22 + i * 0.07));
      [0, 7, 12].forEach(s => tone(261.63 * Math.pow(2, s / 12), 1.2, "sine", 0.06, 0, 0.55));
    },
    slide() { noise(0.32, 0.07, "bandpass", 500, 0, 2600); },
    warn() { tone(880, 0.08, "square", 0.035); tone(880, 0.08, "square", 0.035, 0, 0.15); },
    over() { tone(330, 0.8, "sawtooth", 0.07, 70); noise(0.6, 0.1, "lowpass", 900, 0, 120); },
    hop() { tone(700, 0.08, "square", 0.02, 1100); },
    start() { tone(392, 0.1, "square", 0.04); tone(784, 0.16, "square", 0.04, 0, 0.09); },
  };
  const vib = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
  const sndBtn = document.getElementById("snd");
  sndBtn.addEventListener("pointerdown", e => e.stopPropagation());
  sndBtn.addEventListener("click", e => {
    e.stopPropagation(); sndOn = !sndOn; sndBtn.textContent = sndOn ? "소리 켬" : "소리 끔"; sndBtn.blur();
    if (audio()) master.gain.value = sndOn ? 0.85 : 0;
  });

  // ================= 칩 =================
  // 칩마다 이름·패드 수·점등 색. 뒤로 갈수록 크고 패드가 많다
  const CHIPS = [
    ["타이머 IC", 8, 160], ["오디오 칩", 10, 175], ["전원 IC", 12, 40], ["MCU", 12, 150],
    ["이미지 센서", 16, 290], ["DRAM", 16, 165], ["낸드 플래시", 20, 195], ["AP", 20, 38],
    ["GPU", 24, 140], ["HBM 컨트롤러", 24, 42], ["AI 가속기", 28, 300], ["양자 제어 칩", 28, 185],
  ];
  // 처음 나오는 칩에서 바뀌는 점을 알려 준다
  const TWIST = { 2: "헤드가 빨라졌다 느려졌다 한다", 4: "패드 간격이 들쭉날쭉", 6: "칩이 살살 흔들린다" };
  function chipDef(i) {
    if (i < CHIPS.length) return { name: CHIPS[i][0], n: CHIPS[i][1], hue: CHIPS[i][2] };
    return { name: `꿈의 칩 ${i - CHIPS.length + 1}호`, n: 28, hue: (i * 47) % 360 };
  }
  const TILT = 0.74, ZK = 1, DIE_Z = 10, HOVER = 32, VIEW = 0.2, CV = Math.cos(VIEW), SV = Math.sin(VIEW), ZOOM = 1.08, WIRE_T = 0.22, FREEZE = 0.13;
  function makeChip(i) {
    const d = chipDef(i), half = 56 + Math.min(i, 8) * 3, pH = Math.max(6.5, 12 - i * 0.6);
    const ch = { i, name: d.name, hue: d.hue, half, pH, pads: [], cur: 0 };
    const base = Math.floor(d.n / 4), rem = d.n % 4, L = 2 * (half - 14);
    for (let s = 0; s < 4; s++) {
      const m = base + (s < rem ? 1 : 0), need = m * (2 * pH + 4), slack = Math.max(0, L - need);
      // 고른 간격, 다섯 번째 칩부터는 남는 자리를 제멋대로 나눠 간격이 들쭉날쭉
      const wts = []; for (let j = 0; j <= m; j++) wts.push(i >= 4 ? rand(0.25, 1.75) : 1);
      const sw = wts.reduce((a, b) => a + b, 0);
      let x = -L / 2;
      for (let j = 0; j < m; j++) {
        x += slack * wts[j] / sw; x += pH + 2;
        ch.pads.push({ side: s, a: x, done: false, off: 0, at: 0, stitched: false, perfect: false, loop: 28 + ((ch.pads.length * 7) % 5) * 2.5 });
        x += pH + 2;
      }
    }
    buildDie(ch);
    return ch;
  }
  // 실리콘 다이 윗면: 블록을 나눠 메모리 격자·로직 점·아날로그 배선을 그린다. 점등용 빛 그림도 같이
  function buildDie(ch) {
    const R = 4, h = ch.half, D = Math.ceil(h * 2 * R), hs = h * 2;
    const c = mk(D, D), g = c.getContext("2d"), cl = mk(D, D), q = cl.getContext("2d");
    g.scale(R, R); q.scale(R, R);
    let seed = ch.i * 7919 + 13; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const gr = g.createLinearGradient(0, 0, hs, hs);
    gr.addColorStop(0, "#2a3144"); gr.addColorStop(0.45, "#1b2030"); gr.addColorStop(0.75, "#232038"); gr.addColorStop(1, "#2d2840");
    g.fillStyle = gr; g.fillRect(0, 0, hs, hs);
    const glowC = `hsl(${ch.hue},100%,70%)`;
    q.strokeStyle = glowC; q.fillStyle = glowC;
    // 실 링
    g.strokeStyle = "rgba(200,210,225,.5)"; g.lineWidth = 1.1; g.strokeRect(2.2, 2.2, hs - 4.4, hs - 4.4);
    g.strokeStyle = "rgba(200,210,225,.18)"; g.lineWidth = 0.5; g.strokeRect(4.2, 4.2, hs - 8.4, hs - 8.4);
    q.lineWidth = 0.8; q.globalAlpha = 0.5; q.strokeRect(2.2, 2.2, hs - 4.4, hs - 4.4); q.globalAlpha = 1;
    // 패드에서 안쪽 코어로 들어가는 배선
    for (const p of ch.pads) {
      g.save(); g.translate(h, h); g.rotate(-p.side * Math.PI / 2);
      q.save(); q.translate(h, h); q.rotate(-p.side * Math.PI / 2);
      const y0 = h - 16, y1 = h - 24, x1 = p.a * 0.82;
      for (const k of [g, q]) {
        k.beginPath(); k.moveTo(p.a, y0); k.lineTo(p.a, y0 - 2); k.lineTo(x1, y1); k.lineTo(x1, h - 26);
      }
      g.strokeStyle = "rgba(205,170,110,.4)"; g.lineWidth = 1.1; g.stroke();
      q.lineWidth = 1; q.globalAlpha = 0.9; q.stroke(); q.globalAlpha = 1;
      g.restore(); q.restore();
    }
    const m = 26;
    function block(x, y, w, hh) {
      const t = rnd();
      if (t < 0.36) { // 메모리 셀 격자
        g.fillStyle = "rgba(120,95,210,.2)"; g.fillRect(x, y, w, hh);
        g.strokeStyle = "rgba(175,155,255,.22)"; g.lineWidth = 0.35; g.beginPath();
        for (let u = x + 1.5; u < x + w; u += 1.8) { g.moveTo(u, y); g.lineTo(u, y + hh); }
        for (let v = y + 1.5; v < y + hh; v += 1.8) { g.moveTo(x, v); g.lineTo(x + w, v); }
        g.stroke();
        g.fillStyle = "rgba(200,190,255,.18)"; g.fillRect(x, y, 2.5, hh); g.fillRect(x, y, w, 2.5);
        q.globalAlpha = 0.28; q.fillRect(x, y, w, hh); q.globalAlpha = 1;
      } else if (t < 0.72) { // 로직 바다
        g.fillStyle = "rgba(40,140,125,.17)"; g.fillRect(x, y, w, hh);
        const n = Math.floor(w * hh / 7);
        for (let k = 0; k < n; k++) {
          const px = x + rnd() * (w - 2), py = y + rnd() * (hh - 1), lw = 0.6 + rnd() * 2.2;
          g.fillStyle = `rgba(${120 + rnd() * 60},${200 + rnd() * 55},${190 + rnd() * 50},${0.08 + rnd() * 0.16})`; g.fillRect(px, py, lw, 0.7);
          if (rnd() < 0.25) { q.globalAlpha = 0.5; q.fillRect(px, py, lw, 0.7); q.globalAlpha = 1; }
        }
      } else { // 아날로그·입출력: 굽이치는 구리선
        g.fillStyle = "rgba(210,140,70,.12)"; g.fillRect(x, y, w, hh);
        g.strokeStyle = "rgba(230,170,100,.35)"; g.lineWidth = 0.6; g.beginPath(); q.beginPath();
        for (let v = y + 2; v < y + hh - 1; v += 3) {
          for (const k of [g, q]) { k.moveTo(x + 1.5, v); k.lineTo(x + w - 1.5, v); if (v + 1.5 < y + hh - 1) k.lineTo(x + w - 1.5, v + 1.5); }
        }
        g.stroke(); q.lineWidth = 0.5; q.globalAlpha = 0.6; q.stroke(); q.globalAlpha = 1;
      }
      g.strokeStyle = "rgba(210,220,240,.28)"; g.lineWidth = 0.5; g.strokeRect(x, y, w, hh);
      q.lineWidth = 0.7; q.strokeRect(x, y, w, hh);
    }
    function split(x, y, w, hh, d) {
      if (d < 3 && (w > 28 || hh > 28) && (d < 1 || rnd() < 0.82)) {
        if (w > hh) { const k = w * (0.32 + rnd() * 0.36); split(x, y, k - 1.4, hh, d + 1); split(x + k + 1.4, y, w - k - 1.4, hh, d + 1); }
        else { const k = hh * (0.32 + rnd() * 0.36); split(x, y, w, k - 1.4, d + 1); split(x, y + k + 1.4, w, hh - k - 1.4, d + 1); }
      } else block(x, y, w, hh);
    }
    split(m, m, hs - 2 * m, hs - 2 * m, 0);
    // 전원 링
    g.strokeStyle = "rgba(220,190,130,.32)"; g.lineWidth = 1.6; g.strokeRect(m - 3.5, m - 3.5, hs - 2 * m + 7, hs - 2 * m + 7);
    q.lineWidth = 1.4; q.strokeRect(m - 3.5, m - 3.5, hs - 2 * m + 7, hs - 2 * m + 7);
    // 각인
    g.fillStyle = "rgba(220,228,240,.38)"; g.font = `700 4.2px ${FONT.num}`; g.textBaseline = "top";
    g.fillText(`SOYU-${String(ch.i + 1).padStart(2, "0")}`, m + 1, m + 1.2);
    ch.tex = c; ch.glowTex = cl;
  }

  // ================= 상태 =================
  let state = "title", now = 0, last = performance.now(), paused = false;
  let chip = makeChip(0), phase = "aim", phaseAt = 0, theta = 0, thFrom = 0, thTo = 0, turned = false, powered = false;
  let lives = 3, score = 0, bonds = 0, perfN = 0, combo = 0, maxCombo = 0, chipsLit = 0, speed = 125, speedBase = 125;
  let best = +(store.get("bond.best") || 0), bestChips = +(store.get("bond.bestChips") || 0), newBest = false, overAt = 0, shake = 0;
  let tray = [], rings = [], pops = [], sparks = [], snaps = [], scorch = [], banner = null, nameCard = null;
  const head = { s: 0, dir: 1, pos: 0, z: HOVER, zT: HOVER, freezeUntil: 0, plungeAt: -9, ballAt: -9 };
  const zero = { y: 0, vy: 0, squash: 0, mood: "idle", moodUntil: 0, lean: 0, blinkAt: 2 };
  const LENS = { x: 240, y: 405, r: 180 };
  let scX = LENS.x, scY = LENS.y, SC = ZOOM, drift = 0;
  for (const p of chip.pads) { p.done = true; p.stitched = true; p.at = -9; }

  const PERF = () => Math.min(4.5, chip.pH * 0.6);
  const target = () => chip.pads[chip.cur];
  const sweepA = () => chip.half + 6;
  const easeAmt = () => chip.i >= 2 ? Math.min(0.55, 0.25 + (chip.i - 2) * 0.1) : 0;
  function headRel() { return head.pos - drift; }

  function newChip(i) {
    chip = makeChip(i); theta = 0; thFrom = thTo = 0;
    speedBase = Math.min(360, 125 + Math.min(i, 10) * 13 + Math.max(0, i - 10) * 9); speed = speedBase;
    head.s = 0; head.dir = 1; head.pos = -sweepA();
    nameCard = { at: now, i, name: chip.name, n: chip.pads.length, twist: TWIST[i] };
  }
  function start() {
    state = "play"; lives = 3; score = 0; bonds = 0; perfN = 0; combo = 0; maxCombo = 0; chipsLit = 0; newBest = false;
    tray = []; rings = []; pops = []; sparks = []; snaps = []; scorch = []; banner = null;
    newChip(0); phase = "in"; phaseAt = now; head.z = 150; head.zT = HOVER;
    Object.assign(zero, { y: 0, vy: 0, squash: 0, mood: "idle", lean: 0 });
    sfx.start(); sfx.slide();
  }

  // ================= 본딩 =================
  function bond() {
    const t = target(), d = headRel() - t.a;
    head.plungeAt = now; head.ballAt = now + FREEZE + 0.05;
    if (nameCard && !nameCard.hideAt) nameCard.hideAt = now;   // 첫 본딩에 이름표가 비켜 준다
    if (Math.abs(d) > chip.pH) { miss(d); return; }
    const perfect = Math.abs(d) <= PERF();
    t.done = true; t.at = now; t.off = perfect ? 0 : d; t.perfect = perfect;
    bonds++; score += perfect ? 2 : 1; speed += 4;
    head.freezeUntil = now + FREEZE;
    sfx.tick();
    zero.vy = 220; zero.squash = 0.3;
    if (perfect) {
      combo++; perfN++; maxCombo = Math.max(maxCombo, combo);
      if (combo >= 4 && chip.i < 8) speed -= 6;   // 연속으로 맞추면 헤드가 조금 느긋해진다 (AP부터는 봐주지 않는다)
      sfx.perfect(combo - 1); vib(12); shake = 1.6;
      rings.push({ at: now, side: t.side, a: t.a, big: combo >= 5 });
      pop(combo > 1 ? `딱! ×${combo}` : "딱!", "#5dffc3", true);

      ctx.fillStyle = "rgba(4,20,15,.85)"; ctx.strokeStyle = `hsl(${chip.hue},100%,70%)`; ctx.lineWidth = 2;
      rr(-150, -40, 300, 78, 12); ctx.fill(); ctx.stroke();
      ctx.font = `34px ${FONT.kr}`; ctx.fillStyle = "#ffb547"; ctx.shadowColor = "rgba(255,181,71,.7)"; ctx.shadowBlur = 14 * S * DPR;
      ctx.fillText("칩 점등!", 0, 2); ctx.shadowBlur = 0;
      ctx.font = `15px ${FONT.kr}`; ctx.fillStyle = "#e6fff4"; ctx.fillText(`${banner.name} · ${banner.n}개째`, 0, 26);
      ctx.restore(); ctx.globalAlpha = 1;
    }
    // 새 칩 이름표
    if (nameCard && state === "play" && now - nameCard.at < 2.0) {
      const e = now - nameCard.at, a = (e < 0.2 ? e / 0.2 : e > 1.6 ? (2.0 - e) / 0.4 : 1) * (nameCard.hideAt ? clamp(1 - (now - nameCard.hideAt) / 0.12, 0, 1) : 1);
      ctx.globalAlpha = a; ctx.save(); ctx.translate(240 + (1 - easeOut(clamp(e / 0.4, 0, 1))) * 60, 268);
      const hh = nameCard.twist ? 70 : 52;
      ctx.fillStyle = "rgba(4,20,15,.82)"; ctx.strokeStyle = "rgba(93,255,195,.55)"; ctx.lineWidth = 1.5;
      rr(-130, -30, 260, hh, 10); ctx.fill(); ctx.stroke();
      ctx.font = `24px ${FONT.kr}`; ctx.fillStyle = "#e6fff4"; ctx.fillText(nameCard.name, 0, 0);
      ctx.font = `700 11px ${FONT.num}`; ctx.fillStyle = "#5dffc3"; ctx.fillText(`CHIP ${String(nameCard.i + 1).padStart(2, "0")} · ${nameCard.n} PADS`, 0, 16);
      if (nameCard.twist) { ctx.font = `13px ${FONT.kr}`; ctx.fillStyle = "#ffb547"; ctx.fillText(nameCard.twist, 0, 34); }
      ctx.restore(); ctx.globalAlpha = 1;
    }
    // 딱! 표시는 이름표보다 위에
    const by = LENS.y - 112;
    for (const p of pops) {
      const e = now - p.at; if (e > 0.8) continue;
      const u = e / 0.8, sc = e < 0.08 ? 0.6 + e * 6 : 1.08 - u * 0.08;
      ctx.globalAlpha = 1 - u * u;
      ctx.save(); ctx.translate(clamp(p.x, 150, 330), by - u * 26); ctx.scale(sc, sc);
      ctx.font = `${p.big ? 38 : 22}px ${FONT.kr}`; ctx.lineWidth = 5; ctx.strokeStyle = "rgba(2,10,8,.75)"; ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0); ctx.restore();
    }
    pops = pops.filter(p => now - p.at < 0.8); ctx.globalAlpha = 1;
    ctx.restore();
  }
  function drawTitle() {
    ctx.save(); ctx.textAlign = "center";
    ctx.font = `700 14px ${FONT.num}`; ctx.fillStyle = "#6fa58f"; ctx.fillText("WIRE BONDING", 240, 52);
    ctx.font = `60px ${FONT.kr}`; ctx.fillStyle = "#e6fff4"; ctx.shadowColor = "rgba(255,200,90,.6)"; ctx.shadowBlur = 22 * S * DPR;
    ctx.fillText("와이어 본딩", 240, 116); ctx.shadowBlur = 0;
    ctx.font = `17px ${FONT.kr}`; ctx.fillStyle = "#cfe9dd";
    ctx.fillText("본딩 헤드가 패드 위에 왔을 때 누르세요", 240, 156);
    ctx.fillStyle = "#5dffc3"; ctx.fillText("가운데 맞히면 딱!", 240, 180);
    ctx.fillStyle = "#ff9a8a"; ctx.fillText("세 번 끊어지면 끝", 240, 204);
    ctx.globalAlpha = 0.55 + Math.sin(now * 4) * 0.35; ctx.font = `24px ${FONT.kr}`; ctx.fillStyle = "#5dffc3";
    ctx.fillText("눌러서 시작", 240, 640); ctx.globalAlpha = 1;
    if (best) { ctx.font = `14px ${FONT.kr}`; ctx.fillStyle = "#6fa58f"; ctx.fillText(`최고 ${best}점 · 칩 ${bestChips}개 점등`, 240, 668); }
    ctx.restore();
  }
  function drawOver() {
    const e = now - overAt; if (e < 0.6) return;
    const a = clamp((e - 0.6) / 0.35, 0, 1);
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(2,8,6,.5)"; ctx.beginPath(); ctx.arc(LENS.x, LENS.y, LENS.r, 0, 7); ctx.fill();
    ctx.translate(240, 405 + (1 - easeOut(a)) * 20);
    ctx.fillStyle = "rgba(4,18,14,.92)"; ctx.strokeStyle = newBest ? "#ffb547" : "rgba(255,107,107,.7)"; ctx.lineWidth = 2;
    rr(-140, -118, 280, 250, 16); ctx.fill(); ctx.stroke();
    ctx.font = `700 11px ${FONT.num}`; ctx.fillStyle = newBest ? "#ffb547" : "#ff8a7a"; ctx.fillText("LINE STOP", 0, -86);
    ctx.font = `36px ${FONT.kr}`; ctx.fillStyle = newBest ? "#ffb547" : "#e6fff4"; ctx.fillText(newBest ? "최고 기록!" : "라인 정지", 0, -50);
    const rows = [["점등한 칩", `${chipsLit}개`], ["본딩", `${bonds}`], ["딱!", `${perfN}`], ["최고 연속", `${maxCombo}`], ["점수", `${score}`]];
    rows.forEach((r, i) => {
      const y = -18 + i * 22;
      ctx.textAlign = "left"; ctx.font = `15px ${FONT.kr}`; ctx.fillStyle = "#9cc9b6"; ctx.fillText(r[0], -104, y);
      ctx.textAlign = "right"; ctx.font = `700 15px ${FONT.num}`; ctx.fillStyle = i === 4 ? "#5dffc3" : "#e6fff4"; ctx.fillText(r[1], 104, y);
    });
    ctx.textAlign = "center"; ctx.font = `13px ${FONT.kr}`; ctx.fillStyle = "#6fa58f";
    ctx.fillText(newBest ? `칩 ${bestChips}개 · 최고 ${best}점` : `최고 ${best}점 · 칩 ${bestChips}개`, 0, 92);
    if (e > 1.0) { ctx.globalAlpha = a * (0.55 + Math.sin(now * 4) * 0.35); ctx.font = `19px ${FONT.kr}`; ctx.fillStyle = "#5dffc3"; ctx.fillText("눌러서 라인 재가동", 0, 120); }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!bgCache) bgCache = buildBg();
    const sx = rand(-1, 1) * shake, sy = rand(-1, 1) * shake;
    ctx.drawImage(bgCache, (OX + EX0 * S) * DPR, (OY + EY0 * S) * DPR);
    ctx.setTransform(S * DPR, 0, 0, S * DPR, (OX + sx * S) * DPR, (OY + sy * S) * DPR);
    drawLensBase();
    // 렌즈 속
    ctx.save(); ctx.beginPath(); ctx.arc(LENS.x, LENS.y, LENS.r, 0, 7); ctx.clip();
    let lit = 0, flying = null;
    scX = LENS.x; scY = LENS.y; SC = ZOOM;
    if (state === "title") lit = 0.55 + Math.sin(now * 2) * 0.25;
    else if (phase === "power" && now >= phaseAt) { const e = now - phaseAt; lit = Math.min(1, e / 0.25) * (0.8 + Math.sin(e * 14) * 0.2 * Math.max(0, 1 - e)); }
    else if (phase === "out") flying = clamp((now - phaseAt) / 0.6, 0, 1);
    else if (phase === "in") scX = LENS.x + (1 - easeOut(clamp((now - phaseAt) / 0.55, 0, 1))) * 400;
    if (flying === null) drawChip(chip, lit, false);
    drawFx();
    if (state !== "title" && flying === null) drawHead();
    drawVignette();
    ctx.restore();
    // 점등된 칩이 트레이로 날아간다
    if (flying !== null) {
      const T = trayLayout(tray.length + 1), sl = T.slot(tray.length), u = easeIO(flying);
      scX = lerp(LENS.x, sl.x, u); scY = lerp(LENS.y, sl.y, u) - Math.sin(u * Math.PI) * 40; SC = lerp(ZOOM, T.size * 0.72 / (2 * (chip.half + 12)), u);
      ctx.save(); ctx.globalAlpha = 1 - Math.max(0, (u - 0.85) / 0.15);
      drawChip(chip, 0.9, true); ctx.restore();
    }
    scX = LENS.x; scY = LENS.y; SC = ZOOM;
    ctx.setTransform(S * DPR, 0, 0, S * DPR, OX * DPR, OY * DPR);
    if (state !== "title") drawTray();
    drawZero();
    drawHUD();
    if (state === "play") drawPops();
    if (state === "title") drawTitle();
    if (state === "over") { drawPops(); drawOver(); }
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (!document.hidden && !paused) { now += dt; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { FONT.kr = css("--kr"); FONT.num = css("--num"); bgCache = null; buildDie(chip); });

  // 테스트용 훅
  window.__bond = {
    get state() { return state; }, get score() { return score; }, get lives() { return lives; }, get chip() { return chip.i; },
    get combo() { return combo; }, get phase() { return phase; }, get chipsLit() { return chipsLit; }, get bonds() { return bonds; }, get perfects() { return perfN; },
    get head() { const t = target(); return { pos: headRel(), target: t ? t.a : null, padHalfWidth: chip.pH, perfect: PERF(), speed, ready: state === "play" && phase === "aim" && now >= head.freezeUntil }; },
    press, start,
    debug: { step(s) { while (s > 1e-9) { const d = Math.min(s, 1 / 240); now += d; update(d); s -= d; } }, pause(b) { paused = !!b; last = performance.now(); }, get now() { return now; } },
  };
})();
</script>
</body>
</html>

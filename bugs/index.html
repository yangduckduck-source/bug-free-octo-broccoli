<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>버그 잡기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&display=swap">
<style>
  /* 한 화면: ZERO RUN의 어두운 기판 위에 커다란 칩 하나. 칩의 구멍(비아) 12개에서 버그가 튀어나온다.
     캔버스 하나에 다 그리고, 소리 버튼만 문서 위에 띄운다. 어두운 장면 하나로만 그린다. */
  :root {
    color-scheme: dark;
    --bg: #04110c;
    --ink: #e6fff4;
    --mint: #5dffc3;
    --kr: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --num: "Orbitron", ui-monospace, monospace;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #snd {
    position: fixed; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    font: 15px var(--kr); color: var(--ink); background: rgba(4, 20, 15, .7); border: 1.5px solid rgba(93, 255, 195, .4);
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  #snd:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c" aria-label="버그 잡기 게임 화면. 칩 구멍에서 튀어나오는 무당벌레 버그를 눌러 잡는다. 0은 누르지 않는다."></canvas>
<button id="snd" type="button">소리 켬</button>
<script src="../common/fab.js?v=7"></script>
<script>
(() => {
  "use strict";
  // ================= 화면 =================
  const W = 480, H = 720;
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let S = 1, OX = 0, OY = 0, DPR = 1, EX0 = 0, EX1 = W, EY0 = 0, EY1 = H, bgCache = null;
  function fit() {
    const vv = window.visualViewport, w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    S = Math.min(w / W, h / H); OX = (w - W * S) / 2; OY = (h - H * S) / 2;
    EX0 = -OX / S; EX1 = W + OX / S; EY0 = -OY / S; EY1 = H + OY / S;
    bgCache = null;
  }
  addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);
  fit();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const FONT = { kr: css("--kr"), num: css("--num") };

  // ================= 소리 =================
  let actx = null, master = null, noiseBuf = null, sndOn = true, guardAT = -1, guardWall = 0;
  function audio() {
    if (actx) return actx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      actx = new AC(); master = actx.createGain(); master.gain.value = sndOn ? 0.85 : 0; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
    return actx;
  }
  // 소리 지킴이: 휴대폰이 소리를 재우거나 얼려 두면 손이 닿을 때마다 깨운다
  function wakeAudio() {
    try { if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback"; } catch (e) {}
    if (!actx) return;
    try {
      const t = performance.now();
      if (actx.state === "running" && guardAT >= 0 && t - guardWall > 1500 && actx.currentTime === guardAT) {
        try { actx.close(); } catch (e) {}
        actx = null; audio(); if (!actx) return;
      }
      if (actx.state !== "running") actx.resume();
      const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
      src.buffer = b; src.connect(actx.destination); src.start(0);
      guardAT = actx.currentTime; guardWall = t;
    } catch (e) {}
  }
  ["pointerdown", "pointerup", "touchend", "click", "keydown"].forEach(ev => addEventListener(ev, wakeAudio, { capture: true, passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wakeAudio(); });
  addEventListener("pageshow", wakeAudio);

  function tone(f, dur, type = "sine", vol = 0.1, to = 0, delay = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, type = "highpass", freq = 2000, delay = 0, to = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t0); if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master); src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
  }
  const PENTA = [0, 2, 4, 7, 9];
  const sfx = {
    pop() { tone(rand(380, 460), 0.07, "sine", 0.06, 900); },
    // 톡! 잡는 소리: 껍질이 탁 하고 작은 딱정벌레 소리, 연속일수록 음이 올라간다
    hit(n) { noise(0.05, 0.35, "bandpass", 2600); tone(260, 0.08, "triangle", 0.25, 90); const k = Math.min(n, 14); tone(659.25 * Math.pow(2, (Math.floor(k / 5) * 12 + PENTA[k % 5]) / 12), 0.12, "sine", 0.1, 0, 0.02); },
    gold() { [0, 4, 7, 12, 16].forEach((s, i) => tone(880 * Math.pow(2, s / 12), 0.18, "sine", 0.09, 0, i * 0.04)); },
    zero() { tone(220, 0.35, "square", 0.08); tone(233, 0.35, "square", 0.08); noise(0.2, 0.1, "lowpass", 600); },
    miss() { tone(140, 0.06, "triangle", 0.08, 90); },
    tick() { tone(1200, 0.05, "square", 0.04); },
    go() { tone(523, 0.1, "square", 0.05); tone(784, 0.12, "square", 0.05, 0, 0.1); tone(1046, 0.2, "square", 0.05, 0, 0.2); },
    end() { tone(1046, 0.15, "square", 0.05); tone(784, 0.15, "square", 0.05, 0, 0.14); tone(523, 0.4, "square", 0.05, 0, 0.28); },
    swarm() { for (let i = 0; i < 6; i++) tone(rand(500, 900), 0.06, "sine", 0.04, rand(900, 1400), i * 0.05); },
  };
  const vib = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
  const sndBtn = document.getElementById("snd");
  sndBtn.addEventListener("pointerdown", e => e.stopPropagation());
  sndBtn.addEventListener("click", e => {
    e.stopPropagation(); sndOn = !sndOn; sndBtn.textContent = sndOn ? "소리 켬" : "소리 끔"; sndBtn.blur();
    if (audio()) master.gain.value = sndOn ? 0.85 : 0;
  });

  // ================= 칩과 구멍 =================
  const CHIP = { x: 40, y: 178, w: 400, h: 470 };
  const COLS = 3, ROWS = 4, HOLE_R = 40;
  const holes = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    holes.push({ x: CHIP.x + 72 + c * 128, y: CHIP.y + 70 + r * 110, who: null });

  // ================= 상태 =================
  const DAY = 30;
  const FX = window.FAB ? FAB.equipped("bugs", "fx") : null;     // 상점 꾸미기: 잡을 때 효과
  const TOOL = window.FAB ? FAB.equipped("bugs", "tool") : null, BG = window.FAB ? FAB.equipped("bugs", "bg") : null;
  let swings = [];
  let state = "title", now = 0, last = performance.now(), T0 = 0, nextAt = 0, overAt = 0, countAt = 0;
  let score = 0, caught = 0, zeros = 0, combo = 0, lastHitAt = -9, best = +(store.get("bugs.best") || 0), newBest = false;
  let splats = [], pops = [], parts = [], shake = 0, flash = 0, lastTick = -1, swarmAt = 0;

  const prog = () => clamp((now - T0) / DAY, 0, 1);
  const mult = () => combo >= 10 ? 3 : combo >= 5 ? 2 : 1;

  function start() {
    state = "count"; countAt = now; score = 0; caught = 0; zeros = 0; combo = 0; newBest = false;
    splats = []; pops = []; parts = []; holes.forEach(h => h.who = null); lastTick = -1;
  }
  function begin() { state = "play"; T0 = now; nextAt = now + 0.3; swarmAt = now + rand(9, 12); sfx.go(); }
  function finish() {
    state = "over"; overAt = now; holes.forEach(h => { if (h.who && !h.who.hit) h.who.leaveAt = Math.min(h.who.leaveAt, now); });
    if (score > best) { best = score; newBest = true; store.set("bugs.best", String(best)); }
    if (window.FAB) setTimeout(() => FAB.report("bugs", { score, caught }), 700);
    sfx.end();
  }

  function spawn(force) {
    const free = holes.filter(h => !h.who);
    if (!free.length) return;
    const h = free[Math.floor(Math.random() * free.length)], p = prog();
    const r = Math.random();
    // 0은 가끔(누르면 감점), 황금 버그는 드물게(+5)
    const kind = force || (r < 0.13 + p * 0.07 ? "zero" : r < 0.18 + p * 0.07 ? "gold" : "bug");
    const stay = lerp(1.15, 0.6, p) * (kind === "gold" ? 0.7 : kind === "zero" ? 1.3 : 1) * rand(0.85, 1.15);
    h.who = { kind, at: now, leaveAt: now + 0.12 + stay, hit: false, hitAt: 0, face: Math.random() < 0.5 ? -1 : 1, wig: rand(0, 6) };
    sfx.pop();
  }

  // ================= 입력 (손가락 여러 개) =================
  function toWorld(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - OX) / S, y: (e.clientY - r.top - OY) / S };
  }
  addEventListener("pointerdown", e => {
    if (e.button > 0) return;
    audio(); wakeAudio();
    if (state === "title") { start(); return; }
    if (state === "over") { if (now - overAt > 1.2) start(); return; }
    if (state !== "play") return;
    tap(toWorld(e));
  });
  addEventListener("keydown", e => {
    if ((e.code === "Space" || e.code === "Enter") && !e.repeat) {
      e.preventDefault(); audio(); wakeAudio();
      if (state === "title") start(); else if (state === "over" && now - overAt > 1.2) start();
    }
  });
  addEventListener("contextmenu", e => e.preventDefault());

  function tap(p) {
    // 가장 가까운 구멍(넉넉한 판정)
    let best = null, bd = 1e9;
    for (const h of holes) { const d = Math.hypot(p.x - h.x, p.y - (h.y - 18)); if (d < bd) { bd = d; best = h; } }
    if (!best || bd > 62) return;
    if (TOOL) swings.push({ x: best.x, y: best.y - 20, at: now });
    const w = best.who;
    if (!w || w.hit || now > w.leaveAt || now - w.at < 0.03) { combo = 0; sfx.miss(); dent(best); return; }
    w.hit = true; w.hitAt = now; w.leaveAt = now + 0.45;
    if (w.kind === "zero") {
      // 0을 눌렀다: 감점, 연속 끊김, 화면이 붉게
      score = Math.max(0, score - 3); zeros++; combo = 0; flash = 1; shake = 7;
      sfx.zero(); vib([40, 30, 40]);
      pops.push({ x: best.x, y: best.y - 70, text: "-3  아야!", color: "#ff5a6a", at: now, size: 30 });
      return;
    }
    if (now - lastHitAt > 1.2) combo = 0;
    combo++; lastHitAt = now; caught++;
    const pts = (w.kind === "gold" ? 5 : 1) * mult();
    score += pts;
    if (w.kind === "gold") sfx.gold(); sfx.hit(combo - 1); vib(w.kind === "gold" ? 30 : 12);
    shake = w.kind === "gold" ? 5 : 2.5;
    splats.push({ x: best.x, y: best.y - 14, at: now, gold: w.kind === "gold", rot: rand(0, 6) });
    for (let i = 0; i < (w.kind === "gold" ? 22 : 12); i++) {
      const a = rand(0, Math.PI * 2), v = rand(80, 260);
      parts.push({ x: best.x, y: best.y - 20, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, t: 0, life: rand(0.3, 0.6), col: FX === "bug_bolt" ? (Math.random() < 0.6 ? "#ffe14a" : "#ffffff") : FX === "bug_fire" ? `hsl(${Math.floor(rand(0, 360))},100%,62%)` : w.kind === "gold" ? "#ffd84a" : Math.random() < 0.7 ? "#ff3b4b" : "#1a1a1a", r: rand(2, 4) * (FX ? 1.3 : 1) });
    }
    pops.push({ x: best.x, y: best.y - 76, text: (w.kind === "gold" ? "황금 " : "") + "+" + pts, color: w.kind === "gold" ? "#ffd84a" : "#e6fff4", at: now, size: w.kind === "gold" ? 34 : 28 });
    if (combo === 5 || combo === 10) pops.push({ x: 240, y: 150, text: combo === 5 ? "연속 ×2" : "연속 ×3", color: "#5dffc3", at: now, size: 36 });
  }
  function dent(h) { pops.push({ x: h.x, y: h.y - 60, text: "헛손", color: "#6fa58f", at: now, size: 20 }); }

  // ================= 갱신 =================
  function update(dt) {
    if (state === "count" && now - countAt >= 2.4) begin();
    if (state === "play") {
      const p = prog(), left = DAY - (now - T0);
      if (left <= 0) { finish(); }
      else {
        const sec = Math.ceil(left); if (sec <= 5 && sec !== lastTick) { lastTick = sec; sfx.tick(); }
        if (now >= nextAt) {
          spawn();
          // 뒤로 갈수록 자주, 가끔은 두 마리가 한꺼번에
          if (Math.random() < 0.15 + p * 0.35) spawn();
          nextAt = now + lerp(0.85, 0.36, p) * rand(0.75, 1.25);
        }
        // 버그 떼: 한꺼번에 우르르
        if (now >= swarmAt) { for (let i = 0; i < 5; i++) spawn("bug"); sfx.swarm(); pops.push({ x: 240, y: 150, text: "버그 떼다!", color: "#ffb547", at: now, size: 38 }); swarmAt = now + rand(9, 12); }
      }
    }
    for (const h of holes) {
      const w = h.who; if (!w) continue;
      if (now > w.leaveAt + 0.16) {
        if (!w.hit && w.kind !== "zero" && state === "play") combo = 0;   // 놓친 버그는 연속을 끊는다
        h.who = null;
      }
    }
    for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 700 * dt; }
    parts = parts.filter(q => q.t < q.life);
    splats = splats.filter(s => now - s.at < 1.2);
    pops = pops.filter(p => now - p.at < 0.9);
    shake *= Math.pow(0.002, dt); flash *= Math.pow(0.01, dt);
  }

  // ================= 그리기 =================
  function buildBg() {
    const c = document.createElement("canvas");
    c.width = Math.ceil((EX1 - EX0) * S * DPR); c.height = Math.ceil((EY1 - EY0) * S * DPR);
    const g = c.getContext("2d"); g.setTransform(S * DPR, 0, 0, S * DPR, -EX0 * S * DPR, -EY0 * S * DPR);
    let gr = g.createLinearGradient(0, EY0, 0, EY1); gr.addColorStop(0, "#030c09"); gr.addColorStop(1, "#0a2219");
    g.fillStyle = gr; g.fillRect(EX0, EY0, EX1 - EX0, EY1 - EY0);
    // 기판 격자와 배선
    g.strokeStyle = "#0b1f17"; g.lineWidth = 1;
    for (let x = Math.floor(EX0 / 24) * 24; x < EX1; x += 24) { g.beginPath(); g.moveTo(x, EY0); g.lineTo(x, EY1); g.stroke(); }
    for (let y = Math.floor(EY0 / 24) * 24; y < EY1; y += 24) { g.beginPath(); g.moveTo(EX0, y); g.lineTo(EX1, y); g.stroke(); }
    let seed = 5; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    g.strokeStyle = "#0f3527"; g.lineWidth = 3; g.lineCap = "round";
    for (let i = 0; i < 26; i++) {
      let x = EX0 + rnd() * (EX1 - EX0), y = EY0 + rnd() * (EY1 - EY0); g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 3; k++) { const L = 40 + rnd() * 100; if (k % 2) x += (rnd() < 0.5 ? -1 : 1) * L; else y += (rnd() < 0.5 ? -1 : 1) * L; g.lineTo(x, y); }
      g.stroke(); g.fillStyle = "#1d5a43"; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill();
    }
    // 칩 다리(핀)
    g.fillStyle = "#9aa7a1";
    for (let i = 0; i < 12; i++) {
      const yy = CHIP.y + 30 + i * 36; g.fillRect(CHIP.x - 14, yy, 14, 10); g.fillRect(CHIP.x + CHIP.w, yy, 14, 10);
    }
    // 칩 몸체
    g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(CHIP.x + 8, CHIP.y + 10, CHIP.w, CHIP.h);
    gr = g.createLinearGradient(0, CHIP.y, 0, CHIP.y + CHIP.h); gr.addColorStop(0, "#0d241c"); gr.addColorStop(1, "#081812");
    g.fillStyle = gr; g.fillRect(CHIP.x, CHIP.y, CHIP.w, CHIP.h);
    g.strokeStyle = "#173d2e"; g.lineWidth = 3; g.strokeRect(CHIP.x + 1.5, CHIP.y + 1.5, CHIP.w - 3, CHIP.h - 3);
    g.fillStyle = "#173d2e"; g.beginPath(); g.arc(CHIP.x + 22, CHIP.y + 22, 7, 0, 7); g.fill();       // 1번 핀 표시
    g.fillStyle = "rgba(93,255,195,.25)"; g.font = `700 11px ${FONT.num}`; g.textAlign = "right";
    g.fillText("DEBUG-01  ZR-0", CHIP.x + CHIP.w - 14, CHIP.y + CHIP.h - 12);
    // 구멍(비아): 금빛 테두리 패드 안에 깊은 어둠
    for (const h of holes) {
      g.fillStyle = "#b8923f"; g.beginPath(); g.ellipse(h.x, h.y, HOLE_R + 8, (HOLE_R + 8) * 0.42, 0, 0, 7); g.fill();
      g.fillStyle = "#e3c06a"; g.beginPath(); g.ellipse(h.x, h.y - 2, HOLE_R + 6, (HOLE_R + 6) * 0.4, 0, Math.PI, 0); g.fill();
      gr = g.createRadialGradient(h.x, h.y + 4, 4, h.x, h.y, HOLE_R);
      gr.addColorStop(0, "#000"); gr.addColorStop(1, "#0b1510");
      g.fillStyle = gr; g.beginPath(); g.ellipse(h.x, h.y, HOLE_R, HOLE_R * 0.38, 0, 0, 7); g.fill();
    }
    // 야간 클린룸: 노란 리소그래피 조명이 위에서 비스듬히 쏟아진다
    if (BG === "bug_night") {
      g.fillStyle = "rgba(255,190,50,.14)"; g.fillRect(EX0, EY0, EX1 - EX0, EY1 - EY0);
      for (let i = 0; i < 5; i++) {
        const x = EX0 + (EX1 - EX0) * (i + 0.5) / 5, lg = g.createLinearGradient(0, EY0, 0, EY1);
        lg.addColorStop(0, "rgba(255,214,90,.22)"); lg.addColorStop(1, "rgba(255,214,90,0)");
        g.fillStyle = lg; g.beginPath(); g.moveTo(x - 18, EY0); g.lineTo(x + 18, EY0); g.lineTo(x + 70, EY1); g.lineTo(x - 30, EY1); g.closePath(); g.fill();
      }
    }
    return c;
  }

  // 무당벌레: 빨간 등딱지에 까만 점, 동그란 눈 (황금 버그는 금빛)
  function ladybug(x, y, s, gold, face, wig, splat) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const shell = gold ? "#ffcf3a" : "#e8303b", shellHi = gold ? "#fff3b0" : "#ff7a7f", shellLo = gold ? "#b07d10" : "#9c1420";
    // 다리
    ctx.strokeStyle = "#141414"; ctx.lineWidth = 3; ctx.lineCap = "round";
    for (let i = -1; i <= 1; i++) for (const sd of [-1, 1]) {
      const k = Math.sin(now * 18 + wig + i) * 3;
      ctx.beginPath(); ctx.moveTo(sd * 18, i * 10 + 4); ctx.lineTo(sd * 30, i * 12 + 8 + k); ctx.stroke();
    }
    // 머리
    ctx.fillStyle = "#151515"; ctx.beginPath(); ctx.arc(face * 2, -22, 14, 0, 7); ctx.fill();
    // 더듬이
    ctx.strokeStyle = "#151515"; ctx.lineWidth = 2.4;
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * 6, -32); ctx.quadraticCurveTo(sd * 12, -46 + Math.sin(now * 9 + wig) * 2, sd * 16, -44); ctx.stroke(); ctx.fillStyle = "#151515"; ctx.beginPath(); ctx.arc(sd * 16, -44, 3, 0, 7); ctx.fill(); }
    // 등딱지
    const gr = ctx.createRadialGradient(-8, -6, 3, 0, 4, 30); gr.addColorStop(0, shellHi); gr.addColorStop(0.45, shell); gr.addColorStop(1, shellLo);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(0, 4, 24, 22, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#151515"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(0, 26); ctx.stroke();
    ctx.fillStyle = "#151515";
    [[-11, -2, 5], [11, -2, 5], [-12, 13, 4.2], [12, 13, 4.2], [-4, 20, 3], [4, 20, 3]].forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(a, b, r, 0, 7); ctx.fill(); });
    // 눈
    if (splat) {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      for (const sd of [-1, 1]) { const ex = face * 2 + sd * 6, ey = -24; ctx.beginPath(); ctx.moveTo(ex - 3, ey - 3); ctx.lineTo(ex + 3, ey + 3); ctx.moveTo(ex + 3, ey - 3); ctx.lineTo(ex - 3, ey + 3); ctx.stroke(); }
    } else {
      ctx.fillStyle = "#fff"; for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(face * 2 + sd * 6, -24, 4.2, 0, 7); ctx.fill(); }
      ctx.fillStyle = "#151515"; for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(face * 3 + sd * 6, -23.5, 2, 0, 7); ctx.fill(); }
    }
    if (gold) { ctx.globalAlpha = 0.6 + Math.sin(now * 12) * 0.4; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-12, -8, 3, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
    ctx.restore();
  }
  // ZERO RUN의 주인공 0: 민트빛 고리 안에 눈
  function zeroChar(x, y, s, hurt) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = hurt ? "rgba(255,90,106,.25)" : "rgba(93,255,195,.22)"; ctx.beginPath(); ctx.ellipse(0, 0, 25, 33, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = hurt ? "#ff5a6a" : "#5dffc3"; ctx.lineWidth = 7; ctx.beginPath(); ctx.ellipse(0, 0, 18, 26, 0, 0, 7); ctx.stroke();
    ctx.fillStyle = "#e6fff4"; ctx.strokeStyle = "#e6fff4"; ctx.lineWidth = 2.4;
    if (hurt) { for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * 6 - 3, -5); ctx.lineTo(sd * 6 + 3, 1); ctx.moveTo(sd * 6 + 3, -5); ctx.lineTo(sd * 6 - 3, 1); ctx.stroke(); } }
    else { ctx.fillRect(-7, -6, 3.4, 8); ctx.fillRect(3.6, -6, 3.4, 8); }
    ctx.restore();
  }

  function drawHoles() {
    for (const h of holes) {
      const w = h.who; if (!w) continue;
      // 구멍에서 쏙 올라왔다가 쏙 들어간다: 구멍 아래는 가려서 보이지 않게
      const up = easeOut(clamp((now - w.at) / 0.12, 0, 1)), down = clamp((now - w.leaveAt) / 0.16, 0, 1);
      const rise = w.hit ? 1 : up * (1 - down);
      ctx.save();
      ctx.beginPath(); ctx.rect(h.x - 70, h.y - 150, 140, 150); ctx.ellipse(h.x, h.y, HOLE_R, HOLE_R * 0.38, 0, 0, Math.PI); ctx.clip();
      const y = h.y + 46 - rise * 62;
      if (w.kind === "zero") zeroChar(h.x, y - 6, 1, w.hit);
      else if (!w.hit) ladybug(h.x, y, 1, w.kind === "gold", w.face, w.wig, false);
      ctx.restore();
      // 구멍 앞 테두리를 다시 그려 몸이 구멍 안에서 나오는 것처럼
      ctx.strokeStyle = "#e3c06a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(h.x, h.y, HOLE_R + 2, (HOLE_R + 2) * 0.38, 0, 0.05, Math.PI - 0.05); ctx.stroke();
      // 0이 나와 있으면 경고 띠
      if (w.kind === "zero" && !w.hit && rise > 0.5) { ctx.fillStyle = "rgba(93,255,195,.9)"; ctx.font = `13px ${FONT.kr}`; ctx.textAlign = "center"; ctx.fillText("누르지 마!", h.x, h.y + 32); }
    }
  }
  function drawSplats() {
    for (const s of splats) {
      const e = now - s.at, a = clamp(1 - (e - 0.6) / 0.6, 0, 1), u = easeOut(clamp(e / 0.12, 0, 1));
      ctx.save(); ctx.globalAlpha = a; ctx.translate(s.x, s.y - 30);
      ctx.scale(1 + u * 0.3, (1 - u * 0.55));
      ladybug(0, 0, 1, s.gold, 1, 0, true);
      ctx.restore();
      // "톡!" 충격 고리
      if (e < 0.25) { ctx.strokeStyle = FX === "bug_bolt" ? `rgba(255,225,74,${1 - e / 0.25})` : FX === "bug_fire" ? `hsla(${(now * 600) % 360},100%,65%,${1 - e / 0.25})` : `rgba(255,255,255,${1 - e / 0.25})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.x, s.y - 30, 20 + e * 200, 0, 7); ctx.stroke(); }
    }
    for (const q of parts) { ctx.fillStyle = q.col; ctx.globalAlpha = 1 - q.t / q.life; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  // 손에 든 도구: 누른 자리에서 한 번 휘두르고 사라진다
  function drawSwings() {
    for (const w of swings) {
      const e = now - w.at; if (e > 0.28) continue;
      const u = e / 0.28, a = 1 - Math.max(0, u - 0.6) / 0.4, hitU = Math.min(1, e / 0.07);
      ctx.save(); ctx.globalAlpha = a; ctx.translate(w.x + 34, w.y - 10);
      if (TOOL === "bug_hammer") {          // 뿅망치: 빨간 머리에 노란 띠, 내려칠 때 납작해진다
        ctx.rotate(-0.9 + hitU * 0.9);
        ctx.fillStyle = "#f4d03f"; ctx.fillRect(-4, -4, 8, 60);
        const sq = e < 0.1 ? 1 - Math.sin(e / 0.1 * Math.PI) * 0.25 : 1;
        ctx.save(); ctx.translate(-34, -6); ctx.scale(1, sq);
        ctx.fillStyle = "#ff4a5a"; ctx.beginPath(); ctx.ellipse(0, 0, 30, 18, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#ffe14a"; ctx.fillRect(-6, -18, 12, 36);
        ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(-12, -8, 9, 4, -0.3, 0, 7); ctx.fill();
        ctx.restore();
      } else if (TOOL === "bug_iron") {     // 납땜 인두: 달아오른 끝과 위로 피어오르는 연기
        ctx.rotate(-0.5 + hitU * 0.25);
        ctx.fillStyle = "#2a2f3f"; ctx.fillRect(-7, 6, 14, 54); ctx.fillStyle = "#c9d3df"; ctx.fillRect(-3, -26, 6, 34);
        ctx.fillStyle = "#ff7a2a"; ctx.beginPath(); ctx.moveTo(-3, -26); ctx.lineTo(3, -26); ctx.lineTo(0, -40); ctx.closePath(); ctx.fill();
        ctx.fillStyle = `rgba(255,140,40,${0.5 * (1 - u)})`; ctx.beginPath(); ctx.arc(0, -40, 9, 0, 7); ctx.fill();
        ctx.fillStyle = `rgba(220,230,240,${0.35 * (1 - u)})`;
        for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(Math.sin(u * 8 + i) * 6, -46 - u * 40 - i * 10, 5 + i * 2, 0, 7); ctx.fill(); }
      } else if (TOOL === "bug_vac") {      // 진공 흡입기: 노즐로 빨려드는 바람 줄
        ctx.rotate(-0.3);
        ctx.fillStyle = "#dfe8eb"; ctx.fillRect(-8, -6, 16, 62); ctx.fillStyle = "#3bd1ff"; ctx.fillRect(-12, -14, 24, 12);
        ctx.strokeStyle = `rgba(160,230,255,${0.8 * (1 - u)})`; ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) { const r = 44 * (1 - ((u * 2 + i / 5) % 1)); ctx.beginPath(); ctx.arc(-24, -30, r, -0.4 + i, 0.6 + i); ctx.stroke(); }
      }
      ctx.restore();
    }
    swings = swings.filter(w => now - w.at < 0.28);
  }
  function drawPops() {
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const p of pops) {
      const u = (now - p.at) / 0.9; ctx.globalAlpha = u > 0.6 ? (1 - u) / 0.4 : 1;
      ctx.font = `${p.size}px ${FONT.kr}`; ctx.lineWidth = 5; ctx.strokeStyle = "rgba(2,10,7,.8)";
      ctx.strokeText(p.text, p.x, p.y - u * 26); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y - u * 26);
    }
    ctx.restore();
  }
  function drawHUD() {
    ctx.save(); ctx.textBaseline = "alphabetic";
    // 점수
    ctx.textAlign = "left"; ctx.font = `14px ${FONT.kr}`; ctx.fillStyle = "#6fa58f"; ctx.fillText("잡은 점수", 28, 48);
    ctx.font = `900 44px ${FONT.num}`; ctx.fillStyle = "#e6fff4"; ctx.fillText(String(score), 26, 94);
    // 남은 시간
    const left = state === "play" ? Math.max(0, DAY - (now - T0)) : state === "count" ? DAY : 0;
    ctx.textAlign = "right"; ctx.font = `14px ${FONT.kr}`; ctx.fillStyle = "#6fa58f"; ctx.fillText("남은 시간", W - 28, 48);
    ctx.font = `900 44px ${FONT.num}`; ctx.fillStyle = left <= 5 && state === "play" ? (Math.floor(now * 4) % 2 ? "#ff5a6a" : "#ffb547") : "#e6fff4";
    ctx.fillText(left.toFixed(left < 10 ? 1 : 0), W - 26, 94);
    // 시간 막대
    ctx.fillStyle = "#0f3527"; ctx.fillRect(28, 112, W - 56, 6);
    ctx.fillStyle = left <= 5 ? "#ff5a6a" : "#5dffc3"; ctx.fillRect(28, 112, (W - 56) * (left / DAY), 6);
    // 연속
    if (combo >= 2 && state === "play") {
      ctx.textAlign = "center"; ctx.font = `20px ${FONT.kr}`; ctx.fillStyle = mult() > 1 ? "#5dffc3" : "#cfe9dd";
      ctx.fillText(`${combo}연속${mult() > 1 ? ` · 점수 ×${mult()}` : ""}`, 240, 152);
    }
    ctx.restore();
  }
  function drawTitle() {
    ctx.fillStyle = "rgba(2,10,7,.72)"; ctx.fillRect(EX0, EY0, EX1 - EX0, EY1 - EY0);
    ctx.save(); ctx.textAlign = "center";
    ctx.font = `700 14px ${FONT.num}`; ctx.fillStyle = "#6fa58f"; ctx.fillText("DEBUG MODE", 240, 170);
    ctx.font = `76px ${FONT.kr}`; ctx.fillStyle = "#e6fff4"; ctx.shadowColor = "rgba(93,255,195,.7)"; ctx.shadowBlur = 22; ctx.fillText("버그 잡기", 240, 248); ctx.shadowBlur = 0;
    ladybug(170, 340, 1.4, false, 1, 0, false); zeroChar(310, 336, 1.2, false);
    ctx.font = `20px ${FONT.kr}`; ctx.fillStyle = "#ff7a7f"; ctx.fillText("톡! 잡아라", 170, 412);
    ctx.fillStyle = "#5dffc3"; ctx.fillText("누르면 -3", 310, 412);
    ctx.font = `17px ${FONT.kr}`; ctx.fillStyle = "#cfe9dd";
    ctx.fillText("30초 동안 칩 구멍에서 나오는 버그를 잡는다", 240, 470);
    ctx.fillText("황금 버그 +5 · 다섯 번 연속이면 점수 두 배", 240, 498);
    ctx.globalAlpha = 0.55 + Math.sin(now * 4) * 0.35; ctx.font = `26px ${FONT.kr}`; ctx.fillStyle = "#5dffc3"; ctx.fillText("눌러서 시작", 240, 572); ctx.globalAlpha = 1;
    if (best) { ctx.font = `15px ${FONT.kr}`; ctx.fillStyle = "#6fa58f"; ctx.fillText(`최고 ${best}점`, 240, 606); }
    ctx.restore();
  }
  function drawCount() {
    const e = now - countAt, n = 3 - Math.floor(e / 0.8), u = (e % 0.8) / 0.8;
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.globalAlpha = 1 - u * 0.6;
    ctx.font = `${120 - u * 30}px ${FONT.num}`; ctx.fillStyle = "#5dffc3"; ctx.fillText(n > 0 ? String(n) : "", 240, 400);
    ctx.restore();
  }
  function rank(s) { return s >= 90 ? "버그 헌터" : s >= 65 ? "수석 엔지니어" : s >= 45 ? "선임 엔지니어" : s >= 25 ? "주니어 엔지니어" : "인턴"; }
  function drawOver() {
    const e = now - overAt, a = clamp(e / 0.4, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(2,10,7,.8)"; ctx.fillRect(EX0, EY0, EX1 - EX0, EY1 - EY0);
    ctx.textAlign = "center";
    ctx.font = `700 14px ${FONT.num}`; ctx.fillStyle = "#6fa58f"; ctx.fillText("DEBUG COMPLETE", 240, 214);
    ctx.font = `40px ${FONT.kr}`; ctx.fillStyle = "#e6fff4"; ctx.fillText("디버그 끝!", 240, 264);
    ctx.font = `900 84px ${FONT.num}`; ctx.fillStyle = newBest ? "#ffb547" : "#5dffc3"; ctx.fillText(String(score), 240, 366);
    ctx.font = `20px ${FONT.kr}`; ctx.fillStyle = newBest ? "#ffb547" : "#cfe9dd"; ctx.fillText(newBest ? "최고 기록!" : `최고 ${best}점`, 240, 402);
    ctx.font = `17px ${FONT.kr}`; ctx.fillStyle = "#cfe9dd";
    ctx.fillText(`잡은 버그 ${caught}마리 · 누른 0 ${zeros}번`, 240, 448);
    ctx.font = `26px ${FONT.kr}`; ctx.fillStyle = "#ffb547"; ctx.fillText(`직급: ${rank(score)}`, 240, 494);
    if (e > 1.2) { ctx.globalAlpha = a * (0.55 + Math.sin(now * 4) * 0.35); ctx.font = `20px ${FONT.kr}`; ctx.fillStyle = "#5dffc3"; ctx.fillText("눌러서 다시", 240, 560); }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!bgCache) bgCache = buildBg();
    const sx = rand(-1, 1) * shake, sy = rand(-1, 1) * shake;
    ctx.drawImage(bgCache, (OX + EX0 * S + sx * S) * DPR, (OY + EY0 * S + sy * S) * DPR);
    ctx.setTransform(S * DPR, 0, 0, S * DPR, (OX + sx * S) * DPR, (OY + sy * S) * DPR);
    drawHoles();
    drawSplats();
    drawSwings();
    ctx.setTransform(S * DPR, 0, 0, S * DPR, OX * DPR, OY * DPR);
    if (flash > 0.02) { ctx.fillStyle = `rgba(255,60,80,${0.28 * flash})`; ctx.fillRect(EX0, EY0, EX1 - EX0, EY1 - EY0); }
    drawHUD();
    drawPops();
    if (state === "title") drawTitle();
    if (state === "count") drawCount();
    if (state === "over") drawOver();
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (!document.hidden) { now += dt; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { FONT.kr = css("--kr"); FONT.num = css("--num"); bgCache = null; });

  // 테스트용 읽기 훅
  window.__bugs = { get state() { return state; }, get holes() { return holes; }, get score() { return score; }, get combo() { return combo; }, skip: s => { T0 -= s; }, toScreen: h => ({ x: OX + h.x * S, y: OY + (h.y - 18) * S }) };
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소유네 반도체 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  /* 게임 목록: 흰 바탕에 게임마다 큰 타일 하나 */
  :root {
    color-scheme: light;
    --page: #f5f5f7;
    --panel: #ffffff;
    --ink: #1d1d1f;
    --sub: #6e6e73;
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --body: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  /* 게임이 늘어도 한 화면에: 화면 높이에 맞춰 2열 격자를 늘이고 줄인다 */
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.4;
    padding-inline: 14px; padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
  }
  main { max-width: 880px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 6vw, 48px); line-height: 1.05; }
  .lead { margin: 0; color: var(--sub); font-size: 16px; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 12px; }
  a.tile {
    min-height: 0; display: flex; flex-direction: column; text-decoration: none; color: inherit;
    background: var(--panel); border-radius: 20px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); transition: transform .2s ease, box-shadow .2s ease;
  }
  a.tile:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(0,0,0,.12); }
  a.tile:focus-visible { outline: 3px solid #0071e3; outline-offset: 4px; }
  .art { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .art svg { width: 100%; height: 100%; }
  .art.zero { background: #04110c; }
  .art.matgo { background: #0a2219; }
  .info { flex: none; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 1px; }
  .info h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 4vw, 30px); line-height: 1.1; }
  .info p { margin: 0; color: var(--sub); font-size: 15px; }
  .go { display: none; }
  footer { color: var(--sub); font-size: 12px; text-align: center; }
  footer a { color: var(--sub); }
  /* 공장 장부 줄: 웨이퍼 · 오늘의 공정 · 상점 · 업적 */
  .fabbar { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .head .wafer { margin-left: auto; align-self: center; }
  .wafer .rk { font: 800 13px var(--body); color: #5dffc3; padding: 2px 8px; border-radius: 999px; background: rgba(93,255,195,.14); }
  .item.shop { grid-template-columns: minmax(0, 1fr); }
  .item.shop .btns { justify-content: flex-start; }
  .item .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .item .lock { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .ladder { display: flex; gap: 4px; }
  .ladder span { flex: 1; text-align: center; font-size: 12px; font-weight: 800; padding: 6px 0; border-radius: 8px; background: #e6e8e6; color: var(--sub); }
  .ladder span.on { background: #0d241c; color: #5dffc3; }
  .head .lead { flex-basis: 100%; }
  .wafer { display: inline-flex; align-items: center; gap: 7px; font-family: var(--display); font-size: 20px; padding: 6px 14px 6px 8px; border-radius: 999px; background: #0d241c; color: #e6fff4; }
  .coin { width: 22px; height: 22px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #fff, #b7c4dd 35%, #8fa0c4 60%, #c8b8ee 80%, #9fd6d0); box-shadow: 0 0 0 1.5px rgba(255,255,255,.6) inset; }
  .fb { min-height: 40px; padding: 0 8px; justify-content: center; white-space: nowrap; border-radius: 999px; border: 0; background: var(--panel); color: var(--ink); font: 700 15px var(--body); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.08); display: inline-flex; align-items: center; gap: 6px; }
  .fb .dot { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #0d241c; color: #5dffc3; font-size: 12px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
  .fb.done .dot { background: #1f8f73; color: #fff; }
  .fb:focus-visible, .sheet button:focus-visible { outline: 3px solid #0071e3; outline-offset: 3px; }
  .shade { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 12, .45); display: flex; align-items: flex-end; justify-content: center; padding: 0 0 env(safe-area-inset-bottom, 0px); }
  .shade[hidden] { display: none; }
  .sheet { width: min(560px, 100%); max-height: 86%; overflow: auto; background: #f7f8f7; border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) 22px; display: flex; flex-direction: column; gap: 12px; }
  .sheet h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sheet .x { border: 0; background: #e6e8e6; border-radius: 999px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
  .sheet .note { margin: 0; color: var(--sub); font-size: 14px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--panel); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
  .item .t { font-weight: 800; font-size: 16px; min-width: 0; }
  .item .s { color: var(--sub); font-size: 13px; }
  .item .r { font-family: var(--display); font-size: 17px; color: #1f8f73; white-space: nowrap; }
  .item.off { opacity: .55; }
  .bar2 { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: #e6e8e6; overflow: hidden; }
  .bar2 i { display: block; height: 100%; background: #1f8f73; }
  .swatch { width: 26px; height: 26px; border-radius: 8px; flex: none; }
  .item .buy { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 0; font: 800 14px var(--body); cursor: pointer; background: #0d241c; color: #5dffc3; white-space: nowrap; }
  .item .buy.on { background: #1f8f73; color: #fff; }
  .item .buy:disabled { opacity: .45; cursor: default; }
  .stamp { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .stamp span { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: #e6e8e6; color: var(--sub); }
  .stamp span.on { background: #0d241c; color: #5dffc3; }
  .recs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .recs div { background: var(--panel); border-radius: 14px; padding: 10px 12px; }
  .recs b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; }
  .recs span { color: var(--sub); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { a.tile { transition: none; } }
</style>
<script src="common/fab.js?v=5"></script>
</head>
<body>
<main>
  <div class="head">
    <h1>소유네 반도체 게임</h1>
    <span class="wafer" title="직급과 웨이퍼: 게임을 하면 웨이퍼가 쌓이고, 누적 웨이퍼로 승진한다"><span class="rk" id="rk">인턴</span><i class="coin"></i><span id="wf">0</span></span>
    <p class="lead">골라서 바로 하는 작은 게임들</p>

  <div class="fabbar">

    <button class="fb" id="b-shop" type="button">상점</button>
    <button class="fb" id="b-ach" type="button">업적·기록</button>
  </div>

  <div class="grid">

          <g fill="#020604"><ellipse cx="90" cy="120" rx="36" ry="13"/><ellipse cx="230" cy="120" rx="36" ry="13"/></g>
          <g transform="translate(90 96)"><circle cx="0" cy="-20" r="12" fill="#151515"/><ellipse cx="0" cy="4" rx="22" ry="20" fill="#e8303b"/><line x1="0" y1="-14" x2="0" y2="24" stroke="#151515" stroke-width="2"/><g fill="#151515"><circle cx="-10" cy="-1" r="4.5"/><circle cx="10" cy="-1" r="4.5"/><circle cx="-11" cy="13" r="3.8"/><circle cx="11" cy="13" r="3.8"/></g><circle cx="-5" cy="-22" r="3.6" fill="#fff"/><circle cx="5" cy="-22" r="3.6" fill="#fff"/></g>
          <ellipse cx="230" cy="96" rx="15" ry="22" fill="none" stroke="#5dffc3" stroke-width="6"/>
          <text x="160" y="50" font-family="Black Han Sans, sans-serif" font-size="28" fill="#ffd84a" text-anchor="middle">톡!</text>
        </svg>
      </div>
      <div class="info">
        <h2>버그 잡기</h2>
        <p>30초 두더지 잡기</p>

    <a class="tile" href="hbm/">

          <rect width="640" height="180" fill="#040b09"/>
          <g transform="translate(320 0)">
            <path d="M0 150 L-86 100 L-86 112 L0 162 L86 112 L86 100 Z" fill="#0c1814"/>
            <path d="M0 50 L-86 100 L0 150 L86 100 Z" fill="#183a30" stroke="#5dffc3" stroke-width="1.5"/>
            <g fill="#14302a" stroke="#5dffc3" stroke-opacity=".35">
              <path d="M0 138 L-80 92 L-80 100 L0 146 L80 100 L80 92 Z"/><path d="M0 126 L-80 80 L-80 88 L0 134 L80 88 L80 80 Z"/><path d="M0 114 L-80 68 L-80 76 L0 122 L80 76 L80 68 Z"/>
            </g>
            <path d="M0 22 L-80 68 L0 114 L80 68 Z" fill="#1f4a3c" stroke="#5dffc3" stroke-width="1.6"/>
            <rect x="-2" y="24" width="4" height="120" fill="#c8ffe9" opacity=".55"/>
            <ellipse cx="0" cy="58" rx="7" ry="10" fill="none" stroke="#5dffc3" stroke-width="3"/>
          </g>
          <path d="M150 52 L200 24 L250 52 L200 80 Z" fill="#183a30" stroke="#e6fff4" stroke-width="1.4" opacity=".8"/>
        </svg>
      </div>
      <div class="info">
        <h2>칩 쌓기</h2>
        <p>원버튼 칩 쌓기</p>
        <span class="go">하러 가기 →</span>
      </div>
    </a>

    <a class="tile" href="ninety-nine/">
      <div class="art" style="background:#0a2219">
        <svg viewBox="0 0 320 180" width="100%" height="100%" aria-hidden="true">
          <rect x="96" y="36" width="128" height="96" rx="12" fill="#020806" stroke="#18493a" stroke-width="3"/>
          <text x="160" y="112" font-family="Orbitron, monospace" font-weight="900" font-size="64" fill="#ff4b4b" text-anchor="middle">99</text>
          <rect x="112" y="122" width="96" height="5" rx="2" fill="#ffb547"/>
          <g transform="translate(36 70) rotate(-10)"><rect width="44" height="62" rx="6" fill="#15302a" stroke="#2d6150" stroke-width="2"/><text x="22" y="40" font-family="monospace" font-weight="900" font-size="24" fill="#ffb547" text-anchor="middle">K</text></g>
          <g transform="translate(244 64) rotate(10)"><rect width="44" height="62" rx="6" fill="#15302a" stroke="#2d6150" stroke-width="2"/><text x="22" y="40" font-family="monospace" font-weight="900" font-size="22" fill="#5dffc3" text-anchor="middle">7</text></g>
        </svg>
      </div>
      <div class="info">
        <h2>99</h2>
        <p>CPU와 카드 대결</p>
        <span class="go">하러 가기 →</span>
      </div>
    </a>

    <a class="tile" href="homerun/">
      <div class="art" style="background:#0c2a2e">
        <svg viewBox="0 0 320 180" width="100%" height="100%" aria-hidden="true">
          <rect y="112" width="320" height="68" fill="#a9b7cf"/>
          <rect y="108" width="320" height="5" fill="#5dffc3"/>
                    <circle cx="226" cy="58" r="10" fill="#fbfbf6"/>
          <ellipse cx="226" cy="58" rx="16" ry="5" fill="none" stroke="#2fbf9a" stroke-width="2"/><circle cx="226" cy="58" r="18" fill="#5dffc3" opacity=".25"/>
          <path d="M90 150 L170 70" stroke="#c58a4b" stroke-width="10" stroke-linecap="round"/>
          <path d="M240 46 q20 -10 34 -26" stroke="#ffcf3a" stroke-width="3" fill="none" stroke-dasharray="4 5"/>
          <text x="40" y="44" font-family="Black Han Sans, sans-serif" font-size="30" fill="#ffcf3a">HOME RUN</text>
        </svg>
      </div>
      <div class="info">
        <h2>야구왕</h2>
        <p>원버튼 타격</p>
        <span class="go">하러 가기 →</span>
      </div>
    </a>

    <a class="tile" href="yangmatgo/">
      <div class="art matgo">
        <svg viewBox="0 0 320 180" width="100%" height="100%" aria-hidden="true">
          <g transform="translate(96 34) rotate(-10)"><rect width="64" height="96" rx="7" fill="#fffdf6" stroke="#222" stroke-width="2"/><circle cx="44" cy="22" r="12" fill="#e0352b"/><rect x="5" y="5" width="18" height="18" rx="4" fill="#fff" stroke="#222"/><text x="14" y="19" font-size="14" font-weight="900" text-anchor="middle">1</text><ellipse cx="32" cy="58" rx="22" ry="8" fill="#1d4d2c"/><ellipse cx="24" cy="46" rx="14" ry="6" fill="#2c6e3f"/></g>
          <g transform="translate(160 30) rotate(8)"><rect width="64" height="96" rx="7" fill="#b3121d" stroke="#5e0a10" stroke-width="2"/><circle cx="32" cy="48" r="13" fill="#f7f0df"/><text x="32" y="54" font-size="16" font-weight="900" fill="#b3121d" text-anchor="middle">양</text></g>
        </svg>
      </div>
      <div class="info">
        <h2>양맞고</h2>
        <p>1:1 고스톱</p>
        <span class="go">하러 가기 →</span>
      </div>
    </a>

    <a class="tile" href="zero-run/">
      <div class="art zero">
        <svg viewBox="0 0 320 180" width="100%" height="100%" aria-hidden="true">
          <g fill="#cfe9dd">
            <rect x="40" y="110" width="9" height="70"/><rect x="60" y="110" width="9" height="70"/><rect x="80" y="110" width="9" height="70"/>
            <rect x="190" y="96" width="9" height="84"/><rect x="210" y="96" width="9" height="84"/><rect x="230" y="96" width="9" height="84"/><rect x="250" y="96" width="9" height="84"/>
          </g>
          <text x="140" y="170" font-family="monospace" font-size="16" fill="#5dffc3" opacity=".3">0 0 0</text>
          <ellipse cx="140" cy="70" rx="10" ry="14" fill="none" stroke="#5dffc3" stroke-width="4"/>
        </svg>
      </div>
      <div class="info">
        <h2>ZERO RUN</h2>
        <p>원버튼 러너</p>
        <span class="go">하러 가기 →</span>
      </div>

  </div>

  <footer>© 2026 yangduckduck-source · 플레이·공유 자유, 코드 재사용 금지 (<a href="https://github.com/yangduckduck-source/bug-free-octo-broccoli/blob/main/LICENSE">LICENSE</a>)</footer>
</main>
<div class="shade" id="sh" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"></div></div>
<script>
  // ===== 공장 장부: 웨이퍼 · 오늘의 공정 · 상점 · 업적·기록 =====
  (() => {
    if (!window.FAB) return;
    const $ = s => document.querySelector(s), sh = $("#sh"), sheet = $("#sheet");
    const num = n => Number(n || 0).toLocaleString("ko-KR");
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    function head() {
      FAB.reload();
      $("#wf").textContent = num(FAB.S.wafers);
      $("#rk").textContent = FAB.RANKS[FAB.rank()].name;
      const d = FAB.S.mis.filter(m => m.done).length;
      $("#mis-n").textContent = `${d}/${FAB.S.mis.length}`; $("#b-mis").classList.toggle("done", d === FAB.S.mis.length);
    }
    let cur = null;
    function open(kind) { cur = kind; render(); sh.hidden = false; const x = sheet.querySelector(".x"); if (x) x.focus(); }
    function close() { sh.hidden = true; cur = null; head(); }
    sh.addEventListener("click", e => { if (e.target === sh) close(); });
    addEventListener("keydown", e => { if (e.key === "Escape" && !sh.hidden) close(); });
    const top = t => `<h3 id="sh-t">${t}<button class="x" type="button" aria-label="닫기">✕</button></h3>`;
    function render() {
      const S = FAB.S;
      if (cur === "mis") {
        const att = S.att.streak || 0, k = ((att - 1) % 7 + 7) % 7;
        sheet.innerHTML = top("오늘의 공정") +
          `<p class="note">날마다 세 가지 공정이 바뀝니다. 끝내면 웨이퍼, 세 가지를 다 끝내면 보너스 ${FAB.ALL_DONE_BONUS}장.</p>` +
          `<div class="list">` + S.mis.map(m => {
            const d = FAB.missionDef(m.id), v = Math.min(m.v, d.t);
            return `<div class="item${m.done ? "" : ""}"><div><div class="t">${m.done ? "✓ " : ""}${esc(d.label)}</div><div class="s">${esc(FAB.GAMES[d.g])} · ${num(v)} / ${num(d.t)}</div></div><div class="r">+${d.r}</div><div class="bar2"><i style="width:${(v / d.t) * 100}%"></i></div></div>`;
          }).join("") + `</div>` +
          `<h3 style="font-size:20px">출근 도장 · ${att}일 연속</h3>` +
          `<div class="stamp">` + [20, 25, 30, 35, 40, 45, 100].map((r, i) => `<span class="${att > 0 && i <= k ? "on" : ""}">${i + 1}일<br>+${r}</span>`).join("") + `</div>` +
          `<p class="note">하루에 한 번, 게임방에 들어오면 도장이 찍힙니다. 이어서 오면 보상이 커지고 7일째엔 100장.</p>`;
      } else if (cur === "shop") {
        const by = {}, R = FAB.rank(), RN = FAB.RANKS, nx = RN[R + 1];
        FAB.SHOP.forEach(it => (by[it.g] = by[it.g] || []).push(it));
        sheet.innerHTML = top("상점") +
          `<p class="note">겉모습만 바꿉니다(승패 영향 없음). <b>코팅</b>은 정해진 판 수만큼 쓰면 닳고, <b>소장판</b>은 비싸지만 영구입니다. 좋은 꾸미기는 직급이 올라야 열립니다.</p>` +
          `<p class="note">보유 웨이퍼 <b>${num(S.wafers)}장</b> · 직급 <b>${RN[R].name}</b>${nx ? ` · ${nx.name}까지 누적 ${num(nx.at - S.earned)}장` : ""}</p>` +
          Object.keys(by).map(g => `<h3 style="font-size:19px">${esc(FAB.GAMES[g])}</h3><div class="list">` + by[g].map(it => {
            const perm = S.owned.includes(it.id), left = S.uses[it.id] || 0, on = FAB.equipped(it.g, it.slot) === it.id;
            const st = perm ? "소장 중" : left ? `코팅 ${left}판 남음` : "";
            const eq = (perm || left) ? `<button class="buy${on ? " on" : ""}" type="button" data-eq="${it.id}">${on ? "착용 중" : "착용"}</button>` : "";
            const cb = perm ? "" : R < it.c[2] ? `<span class="lock">코팅은 ${RN[it.c[2]].name}부터</span>` : `<button class="buy" type="button" data-buy="${it.id}" data-k="c" ${S.wafers < it.c[0] ? "disabled" : ""}>${it.c[1]}판 ${num(it.c[0])}장</button>`;
            const pb = perm ? "" : R < it.p[1] ? `<span class="lock">소장은 ${RN[it.p[1]].name}부터</span>` : `<button class="buy" type="button" data-buy="${it.id}" data-k="p" ${S.wafers < it.p[0] ? "disabled" : ""}>소장 ${num(it.p[0])}장</button>`;
            return `<div class="item shop"><div style="display:flex;gap:10px;align-items:center;min-width:0"><i class="swatch" style="background:${it.col}"></i><div class="t">${esc(it.name)}</div>${st ? `<div class="s" style="margin-left:auto;white-space:nowrap">${st}</div>` : ""}</div><div class="btns">${eq}${cb}${pb}</div></div>`;
          }).join("") + `</div>`).join("");
      } else if (cur === "ach") {
        const B = S.best, got = FAB.ACH.filter(a => S.ach[a.id]).length;
        const rec = [
          ["칩 쌓기", (B.chip || {}).layers, "단"], ["버그 잡기", (B.bugs || {}).score, "점"], ["야구왕", (B.baseball || {}).runs, "점"],
          ["ZERO RUN", (B.zero || {}).bytes, "B"], ["99 연승", (B.nn || {}).streak, "연승"], ["누적 웨이퍼", S.earned, "장"],
        ];
        const R = FAB.rank(), nx = FAB.RANKS[R + 1];
        sheet.innerHTML = top("업적·기록") + `<h3 style="font-size:19px">직급 · ${FAB.RANKS[R].name}</h3><div class="ladder">` +
          FAB.RANKS.map((r, i) => `<span class="${i <= R ? "on" : ""}">${r.name}</span>`).join("") + `</div>` +
          `<p class="note">${nx ? `누적 웨이퍼 ${num(S.earned)}장 · ${nx.name}까지 ${num(nx.at - S.earned)}장` : "최고 직급에 올랐습니다."}</p>` +
          `<h3 style="font-size:19px">명예의 전당</h3><div class="recs">` +
          rec.map(([n, v, u]) => `<div><span>${n}</span><b>${v ? num(v) + u : "—"}</b></div>`).join("") + `</div>` +
          `<h3 style="font-size:19px">업적 ${got} / ${FAB.ACH.length}</h3><div class="list">` +
          FAB.ACH.map(a => `<div class="item${S.ach[a.id] ? "" : " off"}"><div><div class="t">${S.ach[a.id] ? "★ " : ""}${esc(a.label)}</div><div class="s">${esc(a.desc)}</div></div><div class="r">+${a.r}</div></div>`).join("") + `</div>` +
          `<p class="note">온라인 랭킹(친구와 점수 겨루기)은 앱으로 출시할 때 구글 플레이 게임즈·애플 게임센터에 연결합니다.</p>`;
      }
    }
    sheet.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.classList.contains("x")) return close();
      if (b.dataset.buy) { if (FAB.buy(b.dataset.buy, b.dataset.k)) FAB.toast({ earned: 0, lines: [] }, "새 꾸미기를 착용했어요"); render(); head(); }
      if (b.dataset.eq) { FAB.equip(b.dataset.eq); render(); }
    });
    $("#b-mis").addEventListener("click", () => open("mis"));
    $("#b-shop").addEventListener("click", () => open("shop"));
    $("#b-ach").addEventListener("click", () => open("ach"));
    head();
    setTimeout(head, 50);                                   // 출근 도장이 찍힌 뒤 다시
    addEventListener("pageshow", head);                     // 게임에서 돌아오면 새로
    document.addEventListener("visibilitychange", () => { if (!document.hidden) head(); });
  })();

  // 게임 링크에 들어갈 때마다 버전 표시(?v=시각)를 붙인다.
  // 휴대폰이 예전에 받아 둔 게임 파일을 다시 쓰지 않고 늘 최신 판을 받아오게 하려는 것.
  document.querySelectorAll("a.tile").forEach(a => {
    const base = a.getAttribute("href");
    const stamp = () => { a.href = base + "?v=" + Date.now().toString(36); };
    stamp(); a.addEventListener("pointerdown", stamp); a.addEventListener("click", stamp);
  });
</script>
</body>
</html>

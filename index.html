<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오락실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  /* 게임 목록: 흰 바탕에 게임마다 큰 타일 하나 */
  :root {
    color-scheme: light;
    --page: #f5f5f7;
    --panel: #ffffff;
    --ink: #1d1d1f;
    --sub: #6e6e73;
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --body: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  /* 게임이 늘어도 한 화면에: 화면 높이에 맞춰 2열 격자를 늘이고 줄인다 */
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.4;
    padding-inline: 14px; padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
  }
  main { max-width: 880px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 6vw, 48px); line-height: 1.05; }
  .lead { margin: 0; color: var(--sub); font-size: 16px; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 12px; }
  a.tile {
    min-height: 0; display: flex; flex-direction: column; text-decoration: none; color: inherit;
    background: var(--panel); border-radius: 20px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); transition: transform .2s ease, box-shadow .2s ease;
  }
  a.tile:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(0,0,0,.12); }
  a.tile:focus-visible { outline: 3px solid #0071e3; outline-offset: 4px; }
  .art { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .art svg { width: 100%; height: 100%; }
  .art.zero { background: #04110c; }
  .art.matgo { background: #5d6744; }
  .info { flex: none; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 1px; }
  .info h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 4vw, 30px); line-height: 1.1; }
  .info p { margin: 0; color: var(--sub); font-size: 15px; }
  .go { display: none; }
  footer { color: var(--sub); font-size: 12px; text-align: center; }
  footer a { color: var(--sub); }
  @media (prefers-reduced-motion: reduce) { a.tile { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>오락실</h1>
    <p class="lead">골라서 바로 하는 작은 게임들</p>
  </div>

  <div class="grid">
    <a class="tile" href="ninety-nine/">
      <div class="art" style="background:#0a2219">
        <svg viewBox="0 0 320 180" width="100%" height="100%" aria-hidden="true">
          <rect x="96" y="36" width="128" height="96" rx="12" fill="#020806" stroke="#18493a" stroke-width="3"/>
          <text x="160" y="112" font-family="Orbitron, monospace" font-weight="900" font-size="64" fill="#ff4b4b" text-anchor="middle">99</text>
          <rect x="112" y="122" width="96" height="5" rx="2" fill="#ffb547"/>
          <g transform="translate(36 70) rotate(-10)"><rect width="44" height="62" rx="6" fill="#15302a" stroke="#2d6150" stroke-width="2"/><text x="22" y="40" font-family="monospace" font-weight="900" font-size="24" fill="#ffb547" text-anchor="middle">K</text></g>
          <g transform="translate(244 64) rotate(10)"><rect width="44" height="62" rx="6" fill="#15302a" stroke="#2d6150" stroke-width="2"/><text x="22" y="40" font-family="monospace" font-weight="900" font-size="22" fill="#5dffc3" text-anchor="middle">7</text></g>
        </svg>
      </div>
      <div class="info">
        <h2>99</h2>
        <p>CPU와 카드 대결</p>
        <span class="go">하러 가기 →</span>
      </div>
    </a>

    <a class="tile" href="homerun/">
      <div class="art" style="background:#0b0f1e">
        <svg viewBox="0 0 320 180" width="100%" height="100%" aria-hidden="true">
          <rect y="112" width="320" height="68" fill="#2f8a43"/>
          <rect y="108" width="320" height="5" fill="#0f5132"/>
                    <circle cx="226" cy="58" r="10" fill="#fbfbf6"/>
          <path d="M219 52 q7 6 0 12 M233 52 q-7 6 0 12" stroke="#d33" stroke-width="2" fill="none"/>
          <path d="M90 150 L170 70" stroke="#c58a4b" stroke-width="10" stroke-linecap="round"/>
          <path d="M240 46 q20 -10 34 -26" stroke="#ffcf3a" stroke-width="3" fill="none" stroke-dasharray="4 5"/>
          <text x="40" y="44" font-family="Black Han Sans, sans-serif" font-size="30" fill="#ffcf3a">HOME RUN</text>
        </svg>
      </div>
      <div class="info">
        <h2>홈런왕</h2>
        <p>원버튼 타격</p>
        <span class="go">하러 가기 →</span>
      </div>
    </a>

    <a class="tile" href="yangmatgo/">
      <div class="art matgo">
        <svg viewBox="0 0 320 180" width="100%" height="100%" aria-hidden="true">
          <g transform="translate(96 34) rotate(-10)"><rect width="64" height="96" rx="7" fill="#fffdf6" stroke="#222" stroke-width="2"/><circle cx="44" cy="22" r="12" fill="#e0352b"/><rect x="5" y="5" width="18" height="18" rx="4" fill="#fff" stroke="#222"/><text x="14" y="19" font-size="14" font-weight="900" text-anchor="middle">1</text><ellipse cx="32" cy="58" rx="22" ry="8" fill="#1d4d2c"/><ellipse cx="24" cy="46" rx="14" ry="6" fill="#2c6e3f"/></g>
          <g transform="translate(160 30) rotate(8)"><rect width="64" height="96" rx="7" fill="#b3121d" stroke="#5e0a10" stroke-width="2"/><circle cx="32" cy="48" r="13" fill="#f7f0df"/><text x="32" y="54" font-size="16" font-weight="900" fill="#b3121d" text-anchor="middle">양</text></g>
        </svg>
      </div>
      <div class="info">
        <h2>양맞고</h2>
        <p>1:1 고스톱</p>
        <span class="go">하러 가기 →</span>
      </div>
    </a>

    <a class="tile" href="zero-run/">
      <div class="art zero">
        <svg viewBox="0 0 320 180" width="100%" height="100%" aria-hidden="true">
          <g fill="#cfe9dd">
            <rect x="40" y="110" width="9" height="70"/><rect x="60" y="110" width="9" height="70"/><rect x="80" y="110" width="9" height="70"/>
            <rect x="190" y="96" width="9" height="84"/><rect x="210" y="96" width="9" height="84"/><rect x="230" y="96" width="9" height="84"/><rect x="250" y="96" width="9" height="84"/>
          </g>
          <text x="140" y="170" font-family="monospace" font-size="16" fill="#5dffc3" opacity=".3">0 0 0</text>
          <ellipse cx="140" cy="70" rx="10" ry="14" fill="none" stroke="#5dffc3" stroke-width="4"/>
        </svg>
      </div>
      <div class="info">
        <h2>ZERO RUN</h2>
        <p>원버튼 러너</p>
        <span class="go">하러 가기 →</span>
      </div>
    </a>
  </div>

  <footer>© 2026 yangduckduck-source · 플레이·공유 자유, 코드 재사용 금지 (<a href="https://github.com/yangduckduck-source/bug-free-octo-broccoli/blob/main/LICENSE">LICENSE</a>)</footer>
</main>
<script>
  // 게임 링크에 들어갈 때마다 버전 표시(?v=시각)를 붙인다.
  // 휴대폰이 예전에 받아 둔 게임 파일을 다시 쓰지 않고 늘 최신 판을 받아오게 하려는 것.
  document.querySelectorAll("a.tile").forEach(a => {
    const base = a.getAttribute("href");
    const stamp = () => { a.href = base + "?v=" + Date.now().toString(36); };
    stamp(); a.addEventListener("pointerdown", stamp); a.addEventListener("click", stamp);
  });
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팹 물류</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&display=swap">
<style>
  /* 한 화면: 클린룸 천장을 위에서 내려다본다. 스토커에서 나온 웨이퍼 통이 레일을 타고 장비로 간다.
     캔버스 하나에 다 그리고, 소리 버튼만 문서 위에 띄운다. 어두운 장면 하나로만 그린다. */
  :root {
    color-scheme: dark;
    --bg: #040b09;
    --ink: #e6fff4;
    --dim: #6fa58f;
    --mint: #5dffc3;
    --gold: #ffcf3a;
    --kr: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --num: "Orbitron", ui-monospace, monospace;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #snd {
    position: fixed; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    font: 15px var(--kr); color: var(--ink); background: rgba(4, 20, 15, .7); border: 1.5px solid rgba(93, 255, 195, .4);
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  #snd:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c" aria-label="팹 물류 게임 화면. 갈림길을 눌러 레일 방향을 바꾸고, 웨이퍼 통을 같은 색 장비로 보낸다."></canvas>
<button id="snd" type="button">소리 켬</button>
<script src="../common/fab.js?v=8"></script>
<script>
(() => {
  "use strict";
  // ================= 화면 =================
  const W = 400, H = 800;
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let S = 1, OX = 0, OY = 0, DPR = 1, EX0 = 0, EX1 = W, EY0 = 0, EY1 = H, bgCache = null;
  function fit() {
    const vv = window.visualViewport, w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    S = Math.min(w / W, h / H); OX = (w - W * S) / 2; OY = (h - H * S) / 2;
    EX0 = -OX / S; EX1 = W + OX / S; EY0 = -OY / S; EY1 = H + OY / S;
    bgCache = null;
  }
  addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);
  fit();
  const toScreen = (x, y) => ({ x: OX + x * S, y: OY + y * S });

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const FONT = { kr: css("--kr"), num: css("--num") };

  // ================= 소리 =================
  let actx = null, master = null, noiseBuf = null, sndOn = true, guardAT = -1, guardWall = 0;
  function audio() {
    if (actx) return actx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      actx = new AC(); master = actx.createGain(); master.gain.value = sndOn ? 0.85 : 0; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
    return actx;
  }
  // 소리 지킴이: 휴대폰이 소리를 재우거나 얼려 두면 손이 닿을 때마다 깨운다
  function wakeAudio() {
    try { if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback"; } catch (e) {}
    if (!actx) return;
    try {
      const t = performance.now();
      if (actx.state === "running" && guardAT >= 0 && t - guardWall > 1500 && actx.currentTime === guardAT) {
        try { actx.close(); } catch (e) {}
        actx = null; audio(); if (!actx) return;
      }
      if (actx.state !== "running") actx.resume();
      const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
      src.buffer = b; src.connect(actx.destination); src.start(0);
      guardAT = actx.currentTime; guardWall = t;
    } catch (e) {}
  }
  ["pointerdown", "pointerup", "touchend", "click", "keydown"].forEach(ev => addEventListener(ev, wakeAudio, { capture: true, passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wakeAudio(); });
  addEventListener("pageshow", wakeAudio);

  function tone(f, dur, type = "sine", vol = 0.1, to = 0, delay = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, type = "highpass", freq = 2000, delay = 0, to = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t0); if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master); src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
  }
  // 제대로 보낼 때마다 한 음씩 올라가는 5음 음계
  const PENTA = [0, 2, 4, 7, 9];
  const note = n => 659.25 * Math.pow(2, (Math.floor(n / 5) * 12 + PENTA[n % 5]) / 12);
  const sfx = {
    // 철-컥: 쇳소리 두 번
    clack() { noise(0.035, 0.3, "bandpass", 3800); tone(1400, 0.03, "square", 0.05, 600); noise(0.06, 0.32, "bandpass", 1500, 0.055); tone(220, 0.07, "triangle", 0.22, 110, 0.055); },
    buzz() { tone(120, 0.16, "square", 0.05, 100); },
    ding(n) { const f = note(Math.min(n, 14)); tone(f, 0.45, "sine", 0.18); tone(f * 2, 0.3, "sine", 0.05, 0, 0.01); tone(f * 1.5, 0.4, "triangle", 0.04, 0, 0.04); },
    alarm() { [0, 1, 2].forEach(i => tone(i % 2 ? 620 : 880, 0.13, "sawtooth", 0.07, 0, i * 0.15)); noise(0.3, 0.06, "lowpass", 700); },
    bonus() { [0, 4, 7, 12].forEach((s, i) => tone(659.25 * Math.pow(2, s / 12), 0.35, "triangle", 0.08, 0, i * 0.06)); },
    spawn() { tone(260, 0.12, "triangle", 0.05, 380); noise(0.12, 0.03, "bandpass", 900, 0, 2400); },
    drop() { tone(520, 0.12, "sine", 0.04, 300); },
    stage() { [0, 4, 7, 12, 16].forEach((s, i) => tone(523.25 * Math.pow(2, s / 12), 0.55, "triangle", 0.08, 0, i * 0.09)); },
    over() { tone(440, 0.9, "sawtooth", 0.08, 70); noise(0.7, 0.12, "lowpass", 900, 0, 100); },
    start() { tone(392, 0.1, "square", 0.04); tone(784, 0.16, "square", 0.04, 0, 0.09); },
  };
  // 천장 공조 소리: 아주 작게 깔린다
  let hum = null, humCtx = null;
  function humOn(on) {
    const a = audio(); if (!a) return;
    try {
      if (!hum || humCtx !== a) {
        humCtx = a; hum = a.createGain(); hum.gain.value = 0;
        const o1 = a.createOscillator(), o2 = a.createOscillator(), g2 = a.createGain(), n = a.createBufferSource(), f = a.createBiquadFilter(), gn = a.createGain();
        o1.frequency.value = 58; o2.type = "triangle"; o2.frequency.value = 116.4; g2.gain.value = 0.3;
        n.buffer = noiseBuf; n.loop = true; f.type = "lowpass"; f.frequency.value = 340; gn.gain.value = 0.7;
        o1.connect(hum); o2.connect(g2).connect(hum); n.connect(f).connect(gn).connect(hum); hum.connect(master);
        o1.start(); o2.start(); n.start();
      }
      const t = a.currentTime; hum.gain.cancelScheduledValues(t); hum.gain.setTargetAtTime(on ? 0.02 : 0, t, 0.5);
    } catch (e) {}
  }
  const vib = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
  const sndBtn = document.getElementById("snd");
  sndBtn.addEventListener("pointerdown", e => e.stopPropagation());
  sndBtn.addEventListener("click", e => {
    e.stopPropagation(); sndOn = !sndOn; sndBtn.textContent = sndOn ? "소리 켬" : "소리 끔"; sndBtn.blur();
    if (audio()) master.gain.value = sndOn ? 0.85 : 0;
  });

  // ================= 배치도 =================
  // 장비: 노광은 노란 조명 아래, 식각·증착·세정·계측
  const TOOL = {
    "노광": { c: "#ffd23a", en: "LITHO" },
    "식각": { c: "#ff5d5d", en: "ETCH" },
    "증착": { c: "#4fa8ff", en: "DEPO" },
    "세정": { c: "#47e27c", en: "CLEAN" },
    "계측": { c: "#b67dff", en: "METRO" },
  };
  // 단계마다 갈림길 [x, y, 왼쪽, 오른쪽]. s=갈림길, t=장비. 모두 이진 나무라 어느 장비든 갈 수 있다
  const LAYOUTS = [
    { tw: 96, sw: [[200, 270, "t0", "s1"], [265, 430, "t1", "t2"]], tools: [["노광", 80], ["식각", 200], ["증착", 320]] },
    { tw: 80, sw: [[200, 250, "s1", "s2"], [110, 390, "t0", "t1"], [290, 450, "t2", "t3"]], tools: [["노광", 65], ["세정", 155], ["식각", 245], ["증착", 335]] },
    { tw: 68, sw: [[200, 240, "s1", "s2"], [100, 380, "t0", "t1"], [290, 370, "s3", "t4"], [238, 500, "t2", "t3"]], tools: [["노광", 48], ["세정", 124], ["식각", 200], ["계측", 276], ["증착", 352]] },
  ];
  const STAGE_AT = [0, 20, 50];
  const MAX_ON = [3, 3, 4];                  // 단계별 레일 위 최대 통 수: 한꺼번에 몰려 정신없지 않게
  const ENTRY = { x: 200, y: 116 }, PORT_Y = 654, STUB = 24, MIN_GAP = 42, HIT = 44;

  // 꺾이는 곳은 둥글게 깎아 점열로 만든다
  function mkPath(pts) {
    const p = [pts[0]], n = pts.length;
    for (let i = 1; i < n - 1; i++) {
      const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
      const l1 = Math.hypot(px - x, py - y), l2 = Math.hypot(nx - x, ny - y);
      const r = Math.min(34, i === 1 ? l1 : l1 / 2, i === n - 2 ? l2 : l2 / 2);
      const ax = x + (px - x) / l1 * r, ay = y + (py - y) / l1 * r, bx = x + (nx - x) / l2 * r, by = y + (ny - y) / l2 * r;
      for (let k = 0; k <= 10; k++) { const t = k / 10, u = 1 - t; p.push([u * u * ax + 2 * u * t * x + t * t * bx, u * u * ay + 2 * u * t * y + t * t * by]); }
    }
    p.push(pts[n - 1]);
    const cum = [0];
    for (let i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
    return { p, cum, len: cum[cum.length - 1] };
  }
  function at(e, d) {
    d = clamp(d, 0, e.len);
    const c = e.cum; let lo = 0, hi = c.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c[m] <= d) lo = m; else hi = m; }
    const a = e.p[lo], b = e.p[hi], seg = c[hi] - c[lo] || 1, t = (d - c[lo]) / seg;
    return { x: lerp(a[0], b[0], t), y: lerp(a[1], b[1], t), a: Math.atan2(b[1] - a[1], b[0] - a[0]) };
  }
  function build(k) {
    const spec = LAYOUTS[k];
    const sws = spec.sw.map(([x, y]) => ({ x, y, state: Math.random() < 0.5 ? 0 : 1, out: [], ang: 0, flipAt: -9, denyAt: -9 }));
    const tools = spec.tools.map(([n, x]) => ({ n, x, y: PORT_Y, c: TOOL[n].c, en: TOOL[n].en, lit: -9, bad: -9 }));
    const edges = [];
    const target = id => id[0] === "s" ? { sw: +id.slice(1) } : { tool: +id.slice(1) };
    const pos = t => t.sw != null ? sws[t.sw] : tools[t.tool];
    const edge = (pts, to, from) => { const e = mkPath(pts); e.to = to; e.from = from; edges.push(e); return edges.length - 1; };
    const root = edge([[ENTRY.x, ENTRY.y], [sws[0].x, sws[0].y]], { sw: 0 }, -1);
    spec.sw.forEach(([x, y, a, b], i) => [a, b].forEach(id => {
      const to = target(id), c = pos(to), y1 = y + STUB, dx = c.x - x;
      sws[i].out.push(edge([[x, y], [x, y1], [c.x, y1 + Math.abs(dx)], [c.x, c.y]], to, i));
    }));
    const lay = { k, sws, tools, edges, root, tw: spec.tw };
    sws.forEach(s => { s.ang = swAng(lay, s); });
    return lay;
  }
  // 갈림길 화살표가 가리킬 방향: 켜진 길로 조금 들어간 곳
  function swAng(lay, s) { const q = at(lay.edges[s.out[s.state]], 46); return Math.atan2(q.y - s.y, q.x - s.x); }

  // ================= 상태 =================
  let state = "title", now = 0, last = performance.now();
  let L = build(0), stage = 0, foups = [], drops = [], pops = [], sparks = [], queue = [], uid = 0;
  let score = 0, lives = 3, combo = 0, best = +(store.get("rail.best") || 0), overAt = 0, newBest = false, shake = 0;
  let spawnT = 0, pending = false, trans = null, banner = null, lampAt = [-9, -9, -9], delivered = 0, wrong = 0;
  let maxCombo = 0, clean = 0, cleanSet = false, confetti = [], flashes = [];
  const dbg = { auto: true, god: false, log: [] };
  // 공장 장부의 꾸미기: 통(금빛·투명), 레일(금·네온), 배송 효과(축포). 페이지를 열 때 한 번 읽는다
  const eq = slot => { try { return window.FAB ? FAB.equipped("rail", slot) : null; } catch (e) { return null; } };
  const SKIN = { foup: eq("foup"), rail: eq("rail"), fx: eq("fx") };
  const PARTY = ["#ff5a6a", "#ffcf3a", "#5dffc3", "#3bd1ff", "#b38cff", "#ff6fb5", "#ffffff"];

  // 새 장비가 들어오면 숨 돌릴 틈: 단계 안에서의 점수로 빨라지고, 단계가 바뀌면 다시 느긋하게 시작한다
  const local = () => score - STAGE_AT[stage];
  const interval = () => Math.max(1.25 + stage * 0.15, 2.8 - local() * 0.04);
  const speed = () => Math.min(118 + stage * 4, 66 + stage * 6 + local() * 1.0);
  function fillQueue(first) {
    if (first) queue = [first];
    while (queue.length < 3) {
      let n = L.tools[Math.floor(Math.random() * L.tools.length)].n;
      const q = queue.length;
      if (q >= 2 && queue[q - 1] === n && queue[q - 2] === n) n = L.tools[Math.floor(Math.random() * L.tools.length)].n;
      queue.push(n);
    }
  }
  function reset() {
    L = build(0); stage = 0; foups = []; drops = []; pops = []; sparks = []; queue = [];
    score = 0; lives = 3; combo = 0; delivered = 0; wrong = 0; maxCombo = 0; clean = 0; cleanSet = false; confetti = []; flashes = []; spawnT = interval() - 1.0; pending = false; trans = null; banner = null; lampAt = [-9, -9, -9];
    fillQueue();
  }
  function start() { reset(); state = "play"; newBest = false; sfx.start(); humOn(true); }
  function spawn(dest) {
    const n = dest || queue.shift(); if (!dest) fillQueue();
    const q = at(L.edges[L.root], 0);
    foups.push({ id: ++uid, e: L.root, d: 0, dest: n, x: q.x, y: q.y, a: q.a, v: 0, ph: rand(0, 6) });
    if (!dest) sfx.spawn();
  }
  function pop(x, y, text, color, big) { pops.push({ x, y, text, color, at: now, big }); }

  function flip(i) {
    if (state !== "play" || trans) return false;
    const s = L.sws[i]; if (!s) return false;
    // 통이 바로 그 갈림 지점 위에 있으면 못 바꾼다
    if (foups.some(f => Math.hypot(f.x - s.x, f.y - s.y) < 15)) { s.denyAt = now; sfx.buzz(); return false; }
    s.state ^= 1; s.flipAt = now; sfx.clack(); vib(8);
    return true;
  }
  // 장비를 누르면: 그 장비로 가는 길의 갈림길을 한 번에 맞춘다 (통이 올라앉은 갈림길은 그대로)
  function pathTo(ti) {
    const walk = (si, acc) => {
      const sw = L.sws[si];
      for (let k = 0; k < 2; k++) {
        const to = L.edges[sw.out[k]].to;
        if (to.tool === ti) return [...acc, [si, k]];
        if (to.sw != null) { const r = walk(to.sw, [...acc, [si, k]]); if (r) return r; }
      }
      return null;
    };
    return walk(0, []) || [];
  }
  function routeTo(ti) {
    if (state !== "play" || trans) return false;
    let changed = 0, denied = 0;
    for (const [si, k] of pathTo(ti)) {
      const sw = L.sws[si]; if (sw.state === k) continue;
      if (foups.some(f => Math.hypot(f.x - sw.x, f.y - sw.y) < 15)) { sw.denyAt = now; denied++; continue; }
      sw.state = k; sw.flipAt = now; changed++;
    }
    L.tools[ti].pick = now;
    if (changed) { sfx.clack(); vib(8); } else if (denied) sfx.buzz(); else sfx.tick && sfx.tick();
    return true;
  }
  // 지금 갈림길대로라면 스토커에서 나온 통이 닿을 장비
  function routeEnd() {
    let e = L.root;
    for (let hop = 0; hop < 8; hop++) { const to = L.edges[e].to; if (to.tool != null) return to.tool; const sw = L.sws[to.sw]; e = sw.out[sw.state]; }
    return -1;
  }
  function arrive(f, ti) {
    const t = L.tools[ti], ok = f.dest === t.n;
    drops.push({ x: f.x, y: f.y, a: f.a, dest: f.dest, at: now, ph: f.ph });
    dbg.log.push({ dest: f.dest, tool: t.n, ok });
    if (ok) {
      combo++; delivered++; score += 1; t.lit = now;
      pop(t.x, t.y - 6, "+1", "#5dffc3"); sfx.ding(combo - 1); vib(10);
      for (let i = 0; i < 12; i++) { const a = rand(0, Math.PI * 2), v = rand(40, 120); sparks.push({ x: t.x, y: t.y + 4, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, t: 0, life: rand(0.35, 0.65), c: t.c }); }
      if (combo % 5 === 0) {
        const b = combo % 10 === 0 ? 5 : 2; score += b;
        pop(200, 214, `연속 ${combo}! +${b}`, "#ffcf3a", true); setTimeout(sfx.bonus, 140);
      }
      if (combo > maxCombo) maxCombo = combo;
      // 20점에 처음 닿는 순간까지 오배송이 하나도 없었으면 '경보 없는 하루'
      if (!cleanSet && score >= 20) { cleanSet = true; clean = wrong === 0 ? 1 : 0; }
      if (SKIN.fx === "rail_party") party(t);
    } else {
      combo = 0; wrong++; t.bad = now; shake = 6;
      pop(t.x, t.y - 6, "오배송!", "#ff6b5e"); sfx.alarm(); vib([80, 50, 80]);
      if (!dbg.god) { lives--; lampAt[lives] = now; if (lives <= 0) { gameOver(); return; } }
    }

    if (!bgCache) bgCache = buildBg();
    const sx = rand(-1, 1) * shake, sy = rand(-1, 1) * shake;
    ctx.drawImage(bgCache, (OX + EX0 * S) * DPR, (OY + EY0 * S) * DPR);
    ctx.setTransform(S * DPR, 0, 0, S * DPR, (OX + sx * S) * DPR, (OY + sy * S) * DPR);
    // 새 장비 반입: 옛 배치가 흐려지고 새 배치가 떠오른다
    let al = 1;
    if (trans) { const e = now - trans.at; al = e < 0.75 ? 1 - e / 0.75 : clamp((e - 0.75) / 0.6, 0, 1); }
    drawLayout(L, al);
    for (const d of drops) {
      const u = clamp((now - d.at) / 0.45, 0, 1);
      drawFoup(d.x, d.y, d.a, d.dest, 1 - u * 0.25, 1 - u, d.ph, u);
    }
    drawSwitchHeads(L, al);
    for (const f of foups) drawFoup(f.x, f.y, f.a, f.dest, 1, 1, f.ph);
    for (const s of sparks) { ctx.globalAlpha = 1 - s.t / s.life; ctx.fillStyle = s.c; ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    if (flashes.length || confetti.length) drawParty();
    drawStocker();
    ctx.setTransform(S * DPR, 0, 0, S * DPR, OX * DPR, OY * DPR);
    drawHUD();
    if (state === "title") drawTitle();
    if (state === "over") drawOver();
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (!document.hidden) { now += dt; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { FONT.kr = css("--kr"); FONT.num = css("--num"); });

  // 테스트용 훅 (좌표는 화면 CSS px)
  window.__rail = {
    routeTo: i => routeTo(i), routeEnd: () => routeEnd(), toolScreen: i => { const t = L.tools[i]; return { x: OX + t.x * S, y: OY + (t.y + 30) * S }; },
    get state() { return state; }, get score() { return score; }, get lives() { return lives; }, get stage() { return stage; },
    get combo() { return combo; }, get pending() { return pending; }, get transitioning() { return !!trans; },
    get foups() { return foups.map(f => { const p = toScreen(f.x, f.y); return { x: p.x, y: p.y, color: TOOL[f.dest].c, dest: f.dest, id: f.id }; }); },
    get switches() { return L.sws.map(s => { const p = toScreen(s.x, s.y); return { x: p.x, y: p.y, state: s.state }; }); },
    get tools() { return L.tools.map(t => { const p = toScreen(t.x, t.y); return { x: p.x, y: p.y, name: t.n, color: t.c }; }); },
    flip(i) { return flip(i); }, start() { start(); },
    debug: {
      get log() { return dbg.log; }, get record() { return { score, delivered, maxCombo, clean, cleanSet, wrong }; }, skin: SKIN,
      kill() { gameOver(); },
      auto(on) { dbg.auto = !!on; }, god(on) { dbg.god = !!on; },
      spawn(n) { spawn(n); }, setScore(v) { score = v; },
      setSwitch(i, v) { L.sws[i].state = v ? 1 : 0; },
      setStage(k) { L = build(k); stage = k; foups = []; pending = false; trans = null; queue = []; fillQueue(); },
      step(sec) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { now += 1 / 60; update(1 / 60); } },
    },
  };
})();
</script>
</body>
</html>

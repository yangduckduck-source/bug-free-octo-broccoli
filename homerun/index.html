<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈런왕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  /* 한 화면: 포수 뒤에서 본 야간 경기장. 위에 LED 전광판, 나머지는 캔버스 하나. */
  :root {
    color-scheme: dark;
    --bg: #0b0f1e;
    --ink: #f4f1e6;
    --sub: #9aa3b8;
    --led: #ffcf3a;
    --red: #ff4b3e;
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --body: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
  body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; padding: 24px; background: rgba(6, 9, 20, .62); pointer-events: none;
  }
  .hidden { display: none; }
  .overlay h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(56px, 16vw, 96px); color: var(--led); line-height: 1; text-shadow: 0 4px 0 #b3361f, 0 10px 30px rgba(0,0,0,.6); }
  .overlay h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(36px, 10vw, 56px); color: var(--ink); }
  .overlay p { margin: 0; font-size: 18px; color: var(--ink); max-width: 22em; line-height: 1.5; }
  .overlay .small { font-size: 15px; color: var(--sub); }
  .overlay .stat { font-family: var(--display); font-size: 30px; color: var(--led); }
  .blink { margin-top: 14px; font-size: 18px; font-weight: 700; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #snd {
    position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 5;
    min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer;
    background: rgba(255,255,255,.12); color: var(--ink); font: 700 15px var(--body);
  }
  #time {
    position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 5;
    min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--led); color: #1a1406; font: 900 16px var(--body);
  }
  #time.hidden { display: none; }
  .btns { display: flex; gap: 10px; margin-top: 10px; }
  .btns button { min-height: 52px; padding: 0 26px; border-radius: 16px; border: 0; cursor: pointer; font: 900 18px var(--body); background: var(--led); color: #1a1406; }
  .btns button.ghost { background: rgba(255,255,255,.14); color: var(--ink); }
  #time:focus-visible, .btns button:focus-visible, #snd:focus-visible { outline: 3px solid var(--led); outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="야구 타석"></canvas></div>

<div class="overlay" id="title">
  <h1>홈런왕</h1>
  <p>공이 홈플레이트에 닿는 순간에 맞춰 누르세요.<br>정확할수록 멀리 날아갑니다. 아웃 세 개면 끝.</p>
  <div class="blink">스페이스 · 클릭 · 터치로 시작</div>
  <p class="small" id="best-title"></p>
</div>

<div class="overlay hidden" id="over">
  <h2>경기 종료</h2>
  <div class="stat" id="final"></div>
  <p id="final-sub"></p>
  <p class="small" id="best-over"></p>
  <div class="blink">다시 하려면 누르세요</div>
</div>

<button id="snd" type="button">소리·목소리</button>
<button id="time" type="button" class="hidden">타임</button>

<div class="overlay hidden" id="pause" style="pointer-events:auto">
  <h2>타임</h2>
  <p>경기가 멈췄습니다.</p>
  <div class="btns"><button type="button" id="resume">계속하기</button><button type="button" id="restart" class="ghost">처음부터</button></div>
</div>

<script>
(() => {
  "use strict";
  // ================= 기본 =================
  const W = 480, H = 720;                     // 논리 좌표 (세로 2:3)
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const $ = s => document.querySelector(s);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let S = 1;
  function fit() {
    const vv = window.visualViewport;
    const vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
    S = Math.min(vw / W, vh / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = Math.floor(W * S) + "px"; cv.style.height = Math.floor(H * S) + "px";
    cv.width = Math.floor(W * S * dpr); cv.height = Math.floor(H * S * dpr);
    ctx.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);
    bgCache = null;
  }
  window.addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);

  // ================= 원근 =================
  // 카메라는 홈플레이트 2.5m 뒤, 높이 1.4m. 거리 d(m)의 땅·공을 화면에 투영한다.
  const HORIZON = 250, F = 696, CAMH = 1.4, PLATE_D = 2.5, MOUND_D = PLATE_D + 18.44;
  const proj = (x, y, d) => { const k = F / d; return { x: W / 2 + x * k, y: HORIZON + (CAMH - y) * k, k }; };
  const ZONE = { x0: -0.22, x1: 0.22, y0: 0.5, y1: 1.05 };

  // ================= 소리 =================
  const MODES = ["all", "sfx", "off"], LABEL = { all: "소리·목소리", sfx: "효과음만", off: "소리 끔" };
  let mode = store.get("homerun.snd"); if (!MODES.includes(mode)) mode = "all";
  let actx = null, master = null, noiseBuf = null;
  // 오디오 엔진은 페이지가 뜨자마자 만들어 둔다(멈춘 상태). 녹음은 이 엔진으로 미리 풀고, 소리는 첫 터치 때 깨운다
  function initAudio() {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = actx.createDynamicsCompressor();
        master = actx.createGain(); master.gain.value = 0.9; master.connect(comp).connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      return actx;
    } catch (e) { return null; }
  }
  function audio() {
    if (mode === "off") return null;
    const a = initAudio(); if (!a) return null;
    try { if (a.state !== "running") a.resume(); } catch (e) {}
    return a;
  }
  function tone(f, dur, type = "sine", vol = 0.1, delay = 0, to = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(type, freq, q, dur, vol, delay = 0, to = 0, attack = 0.004) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master); src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  }
  const sfx = {
    pitch() { noise("bandpass", 600, 1, 0.25, 0.08, 0, 1800); },
    swing() { noise("bandpass", 500, 0.8, 0.18, 0.22, 0, 2400, 0.02); },
    mitt() { noise("lowpass", 900, 0.7, 0.09, 0.6); tone(110, 0.1, "sine", 0.35, 0, 60); },     // 미트에 꽂히는 퍽
    // 알루미늄 배트 "깡!": 순간 접촉음 + 퍽 하는 몸통 + 금속관이 길게 우는 비조화 배음(1 : 2.76 : 5.4)
    // 살짝 어긋난 쌍둥이 음을 겹쳐 "까아앙" 하고 떨리며 사라진다
    ping(power = 1, ring = 1) {
      const f = 1500 + power * 300;
      noise("highpass", 4500, 0.7, 0.035, 1.0 * power, 0, 0, 0.001);       // 딱 맞는 찰나
      noise("bandpass", 2600, 2, 0.09, 0.55 * power, 0, 0, 0.001);
      tone(f * 0.5, 0.08, "triangle", 0.35 * power, 0, f * 0.28);           // 손바닥에 오는 퍽
      tone(f, 0.95 * ring, "sine", 0.42 * power, 0, f * 0.965);
      tone(f * 1.007, 0.85 * ring, "sine", 0.22 * power, 0, f * 0.972);
      tone(f * 2.76, 0.5 * ring, "sine", 0.2 * power, 0, f * 2.76 * 0.98);
      tone(f * 5.4, 0.26 * ring, "sine", 0.1 * power);
      tone(f * 1.51, 0.35 * ring, "triangle", 0.1 * power);
      if (power > 1.1) { tone(f, 0.6, "sine", 0.1, 0.14, f * 0.965); tone(f * 2.76, 0.3, "sine", 0.05, 0.14); }   // 관중석에 부딪혀 돌아오는 메아리
    },
    crack(power) { this.ping(power, 0.6 + power * 0.45); },
    tip() { this.ping(0.7, 0.4); },                 // 빗맞은 "팅" (파울·범타)
    dull() { noise("bandpass", 700, 1.5, 0.09, 0.45); tone(300, 0.08, "triangle", 0.2, 0, 180); },
    crowd(vol = 0.2, dur = 1.6) { noise("bandpass", 900, 0.6, dur, vol, 0, 0, dur * 0.25); noise("bandpass", 2200, 0.8, dur * 0.8, vol * 0.5, 0.05, 0, dur * 0.2); },
    groan() { noise("lowpass", 500, 0.7, 0.9, 0.15, 0, 0, 0.2); },
    organ() { [392, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, i === 5 ? 0.45 : 0.14, "square", 0.06, [0, .15, .3, .45, .7, .85][i])); },
    level() { [523, 784, 1047].forEach((f, i) => tone(f, 0.16, "square", 0.06, i * 0.09)); },
    pa() { tone(68, 0.22, "sine", 0.22, 0, 50); noise("lowpass", 260, 0.7, 0.35, 0.08, 0.02); },   // 구장 확성기의 낮은 울림
    over() { [392, 330, 262].forEach((f, i) => tone(f, 0.35, "triangle", 0.1, i * 0.18)); },
  };
  // 직접 녹음한 심판·아나운서 목소리 (앞뒤 침묵 자르고 저음·압축·구장 메아리 입힌 mp3)

    const male = !plain && voiceMale;
    if (voice && !plain) u.voice = voice;
    u.pitch = clamp((male ? 0.72 : 0.32) + lift, 0.1, 2);   // 남성 음성은 살짝만, 여성 음성은 바닥까지 낮춘다
    u.rate = 0.92 + lift * 0.3; u.volume = 1;
    // 고른 음성이 기기에서 안 돌면(네트워크 음성 등) 기본 음성으로 다시 말한다
    if (!plain) u.onerror = e => { if (!/interrupted|canceled/.test(e.error || "")) { if (++voiceFail >= 1) voice = null; try { speechSynthesis.speak(utter(t, lift, true)); } catch (er) {} } };
    return u;
  }
  // lift: 홈런처럼 흥분한 외침은 조금 올린다
  function say(t, lift = 0) {
    if (mode !== "all") return;
    if (LINE_KEY[t] && playClip(LINE_KEY[t])) return;     // 녹음이 있으면 녹음으로
    if (!("speechSynthesis" in window)) return;
    try {
      if (!voice && !voiceFail) pickVoice();
      lastLine = { t, lift, at: performance.now() };
      if (!speechReady) return;     // 아직 잠겨 있으면 손을 떼는 순간 unlockSpeech가 대신 말한다
      const go = () => { try { speechSynthesis.resume(); speechSynthesis.speak(utter(t, lift, !voice)); } catch (e) {} };
      // 말하는 중에 끊고 곧장 말하면 크롬·사파리가 새 말까지 삼킨다 → 끊고 잠깐 쉰 뒤 말한다
      if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 90); } else go();
      sfx.pa();
    } catch (e) {}
  }
  const sndBtn = $("#snd");
  const syncSnd = () => { sndBtn.textContent = LABEL[mode]; };
  syncSnd();
  sndBtn.addEventListener("pointerdown", e => e.stopPropagation());
  sndBtn.addEventListener("click", e => { e.stopPropagation(); mode = MODES[(MODES.indexOf(mode) + 1) % 3]; store.set("homerun.snd", mode); syncSnd(); sndBtn.blur(); });

  // ================= 구질·투구 =================
  // 휘는 정도는 출발과 도착에서 0이 되도록: 처음엔 엉뚱한 곳으로 가다가 끝에서 꺾인다.
  const PITCHES = {
    fast:   { name: "직구",     speed: 1.0,  bend: z => ({ x: 0, y: 0.06 * Math.sin(Math.PI * z) }) },
    change: { name: "체인지업", speed: 0.8,  bend: z => ({ x: 0.12 * z * (1 - z ** 3), y: 0.18 * z * (1 - z ** 4) }) },
    curve:  { name: "커브",     speed: 0.74, bend: z => ({ x: -0.18 * z * (1 - z ** 2), y: 0.55 * Math.sin(Math.PI * z) * (1 - z) + 0.25 * z * (1 - z ** 3) }) },
    slider: { name: "슬라이더", speed: 0.88, bend: z => ({ x: 0.42 * z * (1 - z ** 4), y: 0.05 * Math.sin(Math.PI * z) }) },
    fork:   { name: "포크",     speed: 0.86, bend: z => ({ x: 0, y: 0.42 * z * (1 - z ** 5) }) },
    knuckle:{ name: "너클",     speed: 0.68, bend: (z, s) => ({ x: 0.07 * Math.sin(z * 17 + s) * z, y: 0.06 * Math.sin(z * 13 + s * 2) * z }) },
    rising: { name: "라이징 직구", speed: 1.06, bend: z => ({ x: 0, y: -0.12 * z * (1 - z ** 2) + 0.08 * Math.sin(Math.PI * z) }) },
  };
  // 레벨별로 열리는 것
  const UNLOCK = [
    null,
    { pitch: "fast", motion: "windup" },
    { pitch: "change" },
    { pitch: "curve", motion: "set" },
    { pitch: "slider" },
    { pitch: "fork", motion: "quick" },
    { pitch: "knuckle", motion: "hesitate" },
    { motion: "side" },
    { pitch: "rising" },
  ];
  const MOTION_NAME = { windup: "와인드업", set: "세트포지션", quick: "퀵모션", hesitate: "멈칫 투구", side: "사이드암" };
  const PITCHES_PER_LEVEL = 12;

  // ================= 판정 창 (ms) =================
  // 버튼을 누른 순간과 공이 홈에 닿는 순간의 차이
  const WIN = { hr: 18, double: 30, single: 44, out: 62, foul: 95 };

  // ================= 상태 =================
  let state = "title";     // title | play | over
  let best = Number(store.get("homerun.best")) || 0;
  let G, P, fx, msg, now = performance.now();
  let paused = false, pauseAcc = 0, pauseStart = 0;
  const gameNow = () => (paused ? pauseStart : performance.now()) - pauseAcc;
  // 경기 시계 기준 예약 (타임 중엔 흐르지 않는다)
  let timers = [];
  const later = (fn, ms) => timers.push({ at: now + ms, fn });

  function newGame() {
    G = { runs: 0, outs: 0, balls: 0, strikes: 0, bases: [0, 0, 0], pitches: 0, level: 1, hits: 0, hr: 0, pool: ["fast"], motions: ["windup"], batters: 1, combo: 0 };
    fx = []; msg = null; P = null; timers = [];
    nextPitch(900);
  }

  function levelUp() {
    const L = G.level + 1;
    G.level = L;
    const u = UNLOCK[L];
    const news = [];
    if (u && u.pitch) { G.pool.push(u.pitch); news.push("새 구질 · " + PITCHES[u.pitch].name); }
    if (u && u.motion) { G.motions.push(u.motion); news.push("새 모션 · " + MOTION_NAME[u.motion]); }
    sfx.level();
    banner(`LEVEL ${L}`, news.join("  ") || "공이 더 빨라집니다", "#ffcf3a", 1800);
  }

  // 다음 투구는 delay 뒤에 만든다. 그 사이엔 지금 공(날아가는 타구, 스윙 자세)을 계속 보여 준다.
  let queuedAt = 0;
  function nextPitch(delay = 1300) { queuedAt = now + delay; }
  function makePitch() {
    const L = G.level, delay = 0;
    const type = pick(G.pool);
    const motion = pick(G.motions);
    const fb = Math.min(162, 122 + (L - 1) * 4.5 + rand(-2, 2));            // 직구 구속(km/h)
    const kmh = Math.round(fb * PITCHES[type].speed);
    const inZone = Math.random() < 0.56;
    let tx, ty;
    if (inZone) { tx = rand(ZONE.x0 + 0.03, ZONE.x1 - 0.03); ty = rand(ZONE.y0 + 0.04, ZONE.y1 - 0.04); }
    else {
      const side = pick(["in", "out", "high", "low", "low"]);
      const off = rand(0.06, 0.32);
      tx = side === "in" ? ZONE.x0 - off : side === "out" ? ZONE.x1 + off : rand(ZONE.x0, ZONE.x1);
      ty = side === "high" ? ZONE.y1 + off : side === "low" ? ZONE.y0 - off : rand(ZONE.y0, ZONE.y1);
    }
    const side = motion === "side";
    const rel = releasePoint(side);
    const flight = (18.44 / (kmh / 3.6)) * 1000;     // 날아오는 시간(ms)
    // 모션 시간표: 준비 → (다리 들기·멈칫) → 내딛기 → 놓기
    const setT = rand(500, 1100);
    const lift = motion === "quick" ? 120 : motion === "set" ? 320 : 480;
    const hold = motion === "hesitate" ? rand(250, 650) : motion === "windup" && L > 3 ? rand(0, 180) : 0;
    const stride = motion === "quick" ? 130 : 220;
    const t0 = now + delay;
    P = {
      type, motion, kmh, inZone, tx, ty, rel, flight, seed: rand(0, 6),
      tSet: t0, tLift: t0 + setT, tHold: t0 + setT + lift, tStride: t0 + setT + lift + hold, tRel: t0 + setT + lift + hold + stride,
      swung: false, swingT: 0, result: null, done: false, hit: null, brk: tx < 0 ? -1 : 1,
    };
    P.tArr = P.tRel + flight;
  }

  // 공의 3D 위치 (z: 0=놓는 순간, 1=홈 도착)
  function ballPos(z) {
    const b = PITCHES[P.type].bend(z, P.seed);
    const x = P.rel.x + (P.tx - P.rel.x) * z + b.x * P.brk;   // brk: 휘는 방향(±1)
    const y = P.rel.y + (P.ty - P.rel.y) * z + b.y;
    const d = P.rel.d + (PLATE_D - P.rel.d) * z;
    return { x, y, d };
  }

  // ================= 입력 =================
  function press(ev) {
    if (state === "title") { start(); return; }
    if (state === "over") { if (now - overAt > 900) start(); return; }
    if (!P || P.swung || P.done || P.result) return;
    if (paused) return;
    const raw = ev && ev.timeStamp && Math.abs(ev.timeStamp - performance.now()) < 1000 ? ev.timeStamp : performance.now();
    const t = raw - pauseAcc;                 // 경기 시계로 바꾼다
    if (t < P.tRel - 120) return;            // 공을 놓기도 전에 누르면 무시
    P.swung = true; P.swingT = t; feel("batter", "effort", 500);
    sfx.swing();
    judge(t - P.tArr);
  }
  window.addEventListener("keydown", e => {
    if (e.code === "Escape" || e.code === "KeyP") { if (state === "play") setPause(!paused); return; }
    if (e.code === "Space" || e.code === "Enter") { if (paused) return; e.preventDefault(); if (!e.repeat) press(e); }
  });
  window.addEventListener("pointerdown", e => { if (e.target.closest && e.target.closest("button")) return; e.preventDefault(); press(e); });

  // ================= 진동 =================
  // 안드로이드는 vibrate, 아이폰(사파리 18 이상)은 스위치를 켤 때 나는 '톡' 햅틱을 빌린다
  const hapticSwitch = (() => {
    try {
      const l = document.createElement("label"), i = document.createElement("input");
      i.type = "checkbox"; i.setAttribute("switch", ""); i.tabIndex = -1; l.appendChild(i);
      l.setAttribute("aria-hidden", "true"); l.style.cssText = "position:fixed;left:-200px;top:0;opacity:0;pointer-events:none";
      document.body.appendChild(l); return l;
    } catch (e) { return null; }
  })();
  const BUZZ = { hr: [45, 35, 70], double: [55], single: [40], out: [18], foul: [18] };
  function buzz(kind, delay) {
    const pat = BUZZ[kind]; if (!pat) return;
    let vib = false;
    try { if (navigator.vibrate) { vib = true; delay > 20 ? setTimeout(() => navigator.vibrate(pat), delay) : navigator.vibrate(pat); } } catch (e) {}
    if (!vib && hapticSwitch) { try { hapticSwitch.click(); } catch (e) {} }   // 아이폰은 누르는 순간 안에서만 울린다
  }

  // ================= 타임 =================
  const timeBtn = $("#time");
  function setPause(on) {
    if (on === paused || state !== "play") return;
    if (on) { pauseStart = performance.now(); paused = true; try { speechSynthesis.cancel(); } catch (e) {} if (actx) actx.suspend(); }
    else { pauseAcc += performance.now() - pauseStart; paused = false; if (actx && mode !== "off") actx.resume(); }
    $("#pause").classList.toggle("hidden", !on);
    timeBtn.classList.toggle("hidden", on);
    if (on) $("#resume").focus();
  }
  timeBtn.addEventListener("click", e => { e.stopPropagation(); setPause(true); });
  $("#resume").addEventListener("click", e => { e.stopPropagation(); setPause(false); });
  $("#restart").addEventListener("click", e => { e.stopPropagation(); setPause(false); start(); });
  // 다른 앱·탭으로 가면 저절로 타임
  document.addEventListener("visibilitychange", () => { if (document.hidden) setPause(true); });

  function start() {
    state = "play";
    $("#title").classList.add("hidden"); $("#over").classList.add("hidden");
    timeBtn.classList.remove("hidden");
    audio();
    newGame();
    say("플레이볼!", 0.1);
  }

  // ================= 판정 =================
  function inZoneFinal() { return P.tx >= ZONE.x0 && P.tx <= ZONE.x1 && P.ty >= ZONE.y0 && P.ty <= ZONE.y1; }
  function judge(delta) {
    const ad = Math.abs(delta);
    const far = Math.max(ZONE.x0 - P.tx, P.tx - ZONE.x1, ZONE.y0 - P.ty, P.ty - ZONE.y1, 0);   // 존에서 벗어난 거리(m)
    P.delta = delta;
    // 존 밖 공은 맞혀도 한 단계씩 나빠지고, 너무 멀면 헛스윙
    let tier = ad <= WIN.hr ? 0 : ad <= WIN.double ? 1 : ad <= WIN.single ? 2 : ad <= WIN.out ? 3 : ad <= WIN.foul ? 4 : 5;
    if (far > 0.2) tier = 5; else if (far > 0) tier = Math.min(5, tier + (far > 0.1 ? 2 : 1));
    // 어려운 구질일수록 정타가 조금 어렵다
    if (tier < 3 && (P.type === "knuckle" || P.type === "fork") && Math.random() < 0.25) tier++;
    const kinds = ["hr", "double", "single", "out", "foul", "whiff"];
    P.pending = kinds[tier];
    buzz(P.pending, Math.max(0, Math.min(P.tArr + 8, now + 30) - now));
    // 결과는 공이 홈에 닿는 순간에 낸다 (일찍 휘둘렀으면 그때까지 기다림)
    if (P.pending === "whiff") P.resolveAt = Math.max(now, P.tArr);
    else P.resolveAt = Math.max(now, Math.min(P.tArr + 8, now + 30));
  }

  function resolve(kind) {
    P.result = kind;
    const late = P.delta > 0;
    switch (kind) {
      // 맞힌 공: 지금은 소리와 함께 날리기만 하고, 판정은 공이 떨어지거나 넘어갈 때 낸다
      case "hr":     sfx.crack(1.4); impact("hr");  sfx.crowd(0.18, 1.2); launch(rand(42, 48), rand(26, 34), (late ? 1 : -1) * rand(2, 22)); break;
      case "double": sfx.crack(1.1); impact("double");  sfx.crowd(0.14, 1.0); launch(rand(33, 38), rand(16, 24), (late ? 1 : -1) * rand(14, 34)); break;
      case "single": sfx.crack(0.95); impact("single"); sfx.crowd(0.1, 0.8);  launch(rand(26, 33), rand(6, 16), (late ? 1 : -1) * rand(4, 38)); break;
      case "out": {
        sfx.tip(); impact("out");
        P.fly = Math.random() < 0.55;
        launch(P.fly ? rand(24, 30) : rand(16, 22), P.fly ? rand(38, 55) : rand(-8, 2), (late ? 1 : -1) * rand(0, 35));
        break;
      }
      case "foul": {
        sfx.tip(); impact("foul");
        P.back = Math.random() < 0.4;
        if (P.back) launch(rand(18, 26), rand(55, 75), 180 + rand(-25, 25));
        else launch(rand(22, 30), rand(10, 30), (late ? 1 : -1) * rand(50, 70));
        break;
      }
      case "whiff": strike(true); break;
      case "strike": strike(false); break;
      case "ball": {
        sfx.mitt();
        G.balls++;
        if (G.balls >= 4) { advanceWalk(); say("볼넷!"); feel("batter", "smirk", 1800); feel("pitcher", "annoyed", 1800); banner("볼넷", "", "#7ee08a", 1300); endPA(); }
        else { say("볼!"); feel("pitcher", "annoyed", 900); banner("볼", "", "#7ee08a", 800); nextPitch(); }
        break;
      }
    }
  }
  // 공이 떨어지거나(안타·파울), 펜스를 넘거나(홈런), 잡히거나(뜬공), 처리될 때(땅볼) 판정을 낸다
  function call(kind) {
    if (P.called) return;
    P.called = kind; P.calledAt = now;
    switch (kind) {
      case "hr": {
        sfx.crowd(0.42, 3); later(sfx.organ, 300);
        const n = 1 + G.bases.reduce((a, b) => a + b, 0);
        G.runs += n; G.bases = [0, 0, 0]; G.hits++; G.hr++;
        say("홈런!", 0.25); feel("batter", "joy", 2800); feel("pitcher", "shock", 2800);
        banner(n === 4 ? "만루 홈런!" : "홈런!", `${n}점`, "#ffcf3a", 2400, true);
        endPA(); break;
      }
      case "double": sfx.crowd(0.25, 1.6); feel("batter", "joy", 2000); feel("pitcher", "annoyed", 2000); advance(2); G.hits++; say("2루타!", 0.15); banner("2루타!", "", "#ffffff", 1500); endPA(); break;
      case "single": sfx.crowd(0.18, 1.3); feel("batter", "happy", 1800); feel("pitcher", "annoyed", 1800); advance(1); G.hits++; say("안타!", 0.15); banner("안타!", "", "#ffffff", 1300); endPA(); break;
      case "out": out(P.fly ? "뜬공 아웃" : "땅볼 아웃"); break;
      case "foul":
        if (G.strikes < 2) G.strikes++;
        say("파울!"); banner("파울", "", "#d7dbe6", 1000); feel("batter", "annoyed", 1100);
        nextPitch(1300); break;
    }
  }
  function watchFlight() {
    const h = P.hit, kind = P.result, age = now - h.t0;
    if (P.called || !h) return;
    if (age > 4500) return call(kind);                                          // 안전장치
    if (kind === "hr" && h.d >= PLATE_D + 108) return call("hr");                // 펜스를 넘음
    if (kind === "foul" && P.back && age > 550) return call("foul");             // 뒤로 넘어감 (잠깐 뒤 판정)
    if (kind === "out" && P.fly && h.vy < 0 && h.y < 2.2) return call("out");    // 수비수가 잡음
    if (kind === "out" && !P.fly && age > 1100) return call("out");             // 땅볼을 처리
    if (h.landed && (kind === "single" || kind === "double" || kind === "foul")) return call(kind);   // 땅에 떨어짐
  }
  function strike(swinging) {
    sfx.mitt();
    G.strikes++;
    if (G.strikes >= 3) { out(swinging ? "헛스윙 삼진" : "루킹 삼진", true); return; }
    say(swinging ? "헛스윙!" : "스트라이크!"); feel("batter", swinging ? "annoyed" : "shock", 1000); feel("pitcher", "smirk", 1000);
    banner(swinging ? "헛스윙" : "스트라이크", "", "#ffcf3a", 900);
    nextPitch();
  }
  function out(label, k) {
    G.outs++;
    if (k) sfx.groan();
    say(k ? "삼진 아웃!" : "아웃!"); feel("batter", "sad", 2000); feel("pitcher", "smirk", 2000);
    banner(label, `${G.outs} 아웃`, "#ff6b5e", 1500);
    if (G.outs >= 3) { queuedAt = 0; later(gameOver, 1700); P.done = true; return; }
    endPA();
  }
  function endPA() { G.balls = 0; G.strikes = 0; G.batters++; nextPitch(2200); }
  function advance(n) {
    let runs = 0;
    const b = G.bases;
    for (let i = 2; i >= 0; i--) if (b[i]) { b[i] = 0; if (i + n >= 3) runs++; else b[i + n] = 1; }
    b[n - 1] = 1;
    G.runs += runs;
    if (runs) later(() => banner(`${runs}점 득점!`, "", "#7ee08a", 1200), 900);
  }
  function advanceWalk() {
    const b = G.bases;
    if (b[0]) { if (b[1]) { if (b[2]) G.runs++; b[2] = 1; } b[1] = 1; }
    b[0] = 1;
  }

  // 맞은 공: 3D 포물선으로 날린다 (속도 m/s, 발사각, 좌우각)
  // 맞는 순간: 멈칫(히트스톱) → 화면 흔들림·확대 → 흰 번쩍임 → 충격 고리와 불꽃 → "깡!"
  let jolt = null, stopAt = 0, stopLen = 0;
  const JOLT = { hr: [95, 10, 0.07, 0.5], double: [75, 7, 0.05, 0.36], single: [60, 5, 0.035, 0.26], out: [35, 3, 0.015, 0.1], foul: [35, 3, 0.015, 0.1] };
  function impact(kind) {
    const [stop, amp, zoom, flash] = JOLT[kind], s = ballScreen({ x: 0, y: 0.9, d: PLATE_D }), good = kind !== "out" && kind !== "foul";
    jolt = { at: performance.now(), amp, zoom, flash, x: s.sx, y: s.sy, word: good ? "깡!" : "팅", big: kind === "hr" ? 1.35 : good ? 1 : 0.7, good };
    stopAt = performance.now(); stopLen = stop;
    const n = good ? 22 : 8;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(2, good ? 6.5 : 3.5);
      fx.push({ x: s.sx, y: s.sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, t: 0, life: rand(0.22, 0.45), col: pick(["#fff7d1", "#ffd659", "#ffffff"]) });
    }
  }
  function drawImpact(c) {
    if (!jolt) return;
    const e = performance.now() - jolt.at;
    // 충격 고리 + 빛살
    if (e < 260) {
      const u = e / 260, r = (jolt.good ? 10 : 6) + u * (jolt.good ? 70 : 34) * jolt.big;
      c.save(); c.globalAlpha = (1 - u) * 0.9; c.strokeStyle = "#fff4c2"; c.lineWidth = 5 * (1 - u) + 1;
      c.beginPath(); c.arc(jolt.x, jolt.y, r, 0, 7); c.stroke();
      if (jolt.good) {
        c.lineWidth = 3 * (1 - u) + 0.5; c.beginPath();

  // ================= 사람 골격 =================
  // 관절을 실제 3차원(미터) 공간에 두고, 동작마다 자세(키프레임)를 정해 그 사이를 부드럽게 잇는다.
  // 팔다리는 굵기가 변하는 원통(허벅지 굵고 종아리 가늘게)으로, 조명 쪽은 밝게 반대쪽은 어둡게 칠한다.
  const V = (x, y, z) => ({ x, y, z });
  const add = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z);
  const sub = (a, b) => V(a.x - b.x, a.y - b.y, a.z - b.z);
  const mul = (a, s) => V(a.x * s, a.y * s, a.z * s);
  const lerp3 = (a, b, t) => add(a, mul(sub(b, a), t));
  const norm = a => { const l = Math.hypot(a.x, a.y, a.z) || 1; return V(a.x / l, a.y / l, a.z / l); };
  const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  function mix(a, b, t) {
    const o = {};
    for (const k in a) o[k] = typeof a[k] === "number" ? a[k] + (b[k] - a[k]) * t : V(a[k].x + (b[k].x - a[k].x) * t, a[k].y + (b[k].y - a[k].y) * t, a[k].z + (b[k].z - a[k].z) * t);
    return o;
  }
  function poseAt(keys, t, curve = ease) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
      const [t0, a] = keys[i - 1], [t1, b] = keys[i];
      return mix(a, b, curve((t - t0) / (t1 - t0)));
    }
    return keys[keys.length - 1][1];
  }
  function joint(a, b, len, bend) {          // 팔꿈치·무릎: 길이를 지키며 bend 쪽으로 꺾는다
    const mid = mul(add(a, b), 0.5);
    const d = Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
    const h = Math.sqrt(Math.max(0, len * len - (d / 2) * (d / 2)));
    return add(mid, mul(norm(bend), h));
  }
  function makeProjector(ox, od, scale = 1) {
    const base = proj(ox, 0, od);

      return { x: base.x + (q.x - base.x) * scale, y: base.y + (q.y - base.y) * scale, k: q.k * scale };
    };
  }
  // ---- 칠하기: 몸 전체를 별도 층에 한 덩어리로 칠하고, 바깥 윤곽만 한 번 두른다 ----
  // 토막마다 윤곽선을 그으면 관절마다 이음매가 보여 목각 인형처럼 된다.
  const LIGHT = { x: 0.62, y: -0.78 };          // 조명: 오른쪽 위
  const layer = document.createElement("canvas"), lctx = layer.getContext("2d");
  const sil = document.createElement("canvas"), sctx = sil.getContext("2d");
  function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function tone3(c, f) { const [r, g, b] = hex(c); const t = v => Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f)); return `rgb(${t(r)},${t(g)},${t(b)})`; }

  function cylGrad(c, A, B, r, base) {
    const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
    let nx = -dy / L, ny = dx / L;
    if (nx * LIGHT.x + ny * LIGHT.y < 0) { nx = -nx; ny = -ny; }

  }
  function ball3(c, pr, p, r, col, sq = 1) {

  // 점들을 감싸는 볼록 껍질을 부드러운 곡선으로 (몸통·골반의 실루엣)
  function hull(pts) {
    pts = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
    const cr = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);

  // 사람 하나를 층에 칠한 뒤 윤곽을 둘러 본 화면에 옮긴다
  function figure(c, pr, joints, drawParts) {
    // 인물 층은 화면 크기(논리 px × S) 해상도로 칠하고, 본 화면(기기 해상도)에 확대해 붙인다 — 휴대폰에서 가볍게
    const PXc = cv.width / W, PL = S;
    const lw = Math.ceil(W * PL), lh = Math.ceil(H * PL);
    if (layer.width !== lw || layer.height !== lh) { layer.width = sil.width = lw; layer.height = sil.height = lh; }
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const p of joints) { const q = pr(p); x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }
    const m = 0.35 * pr(joints[0]).k;

    const lW = Math.min(lw - lx, Math.ceil((x1 - x0 + 2 * m) * PL)), lH = Math.min(lh - ly, Math.ceil((y1 - y0 + 2 * m) * PL));

    lctx.setTransform(PL, 0, 0, PL, 0, 0);

    sctx.globalCompositeOperation = "source-in"; sctx.fillStyle = "#0b0d18"; sctx.fillRect(lx, ly, lW, lH);
    sctx.globalCompositeOperation = "source-over";

  }

  // 공통 몸. J: 관절(사람 기준 l/r), kit: 색, ex: 손·머리·장식 그리기
  function bodyParts(c, pr, J, kit, ex) {
    const it = [], P3 = (f, z) => it.push({ d: z, f });
    const zOf = (...ps) => ps.reduce((a, p) => a + p.z, 0) / ps.length;
    // 다리: 넉넉한 바지 → 스타킹 → 스파이크

  function batterPose() {
    const t = now;

      hip: p.hip, sc, lsh: fsh, rsh: bsh, lhp: fhp, rhp: bhp, head, fwd: chest, hfwd: hChest, hax: hAxis,

  function drawPitchBall(c, hand) {

    const z = clamp((now - P.tRel) / P.flight, 0, 1.06);
    if (z >= 1.06) return;                        // 미트에 들어간 뒤엔 감춘다
    const w = ballPos(Math.min(z, 1));
    if (z > 1) w.d = PLATE_D - (z - 1) * 6;      // 포수 미트로
    const sc = ballScreen(w);
    const r = Math.max(1.6, 0.06 * sc.k);

  function drawMsg(c) {
    if (P && P.swung && P.delta != null && now - P.swingT < 1300) {
      const d = Math.round(P.delta), ad = Math.abs(d);
      const ballMiss = P.result === "whiff" && ad <= WIN.foul;     // 타이밍은 맞았는데 존에서 너무 빠진 공
      const t = ballMiss ? "존 밖 공" : ad <= WIN.hr ? "완벽!" : d < 0 ? `빠름 ${ad}ms` : `늦음 ${ad}ms`;

    const u = (now - msg.t0) / msg.dur;

  function draw() {
    if (!bgCache) {
      bgCache = document.createElement("canvas");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      bgCache.width = Math.floor(W * S * dpr); bgCache.height = Math.floor(H * S * dpr);
      const b = bgCache.getContext("2d"); b.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);

    drawImpact(ctx);
    if (shaking) ctx.restore();
    if (jolt) { const e = performance.now() - jolt.at; if (e < 140) { ctx.fillStyle = `rgba(255,252,235,${jolt.flash * (1 - e / 140)})`; ctx.fillRect(0, 0, W, H); } }
    if (state !== "title" && G) drawBoard(ctx);
    drawMsg(ctx);
  }

  // ================= 루프 =================
  let acc = 0, last = performance.now();
  function frame(t) {
    now = gameNow();
    if (paused) { last = t; draw(); requestAnimationFrame(frame); return; }
    if (stopAt) {
      if (performance.now() - stopAt < stopLen) { now = stopAt - pauseAcc; last = t; draw(); requestAnimationFrame(frame); return; }
      pauseAcc += stopLen; stopAt = 0; now = gameNow();
    }
    acc += Math.min(0.1, (t - last) / 1000); last = t;
    while (acc >= 1 / 60) { update(); acc -= 1 / 60; }
    draw();
    requestAnimationFrame(frame);
  }

  $("#best-title").textContent = best ? `최고 기록 ${best}점` : "";
  // 타이틀 화면용 기본 상태
  G = { runs: 0, outs: 0, balls: 0, strikes: 0, bases: [0, 0, 0], level: 1, pool: ["fast"], motions: ["windup"] };
  fx = [];
  fit();
  requestAnimationFrame(frame);

  // 테스트용 읽기 훅
  window.__hr = { get state() { return state; }, get G() { return G; }, get P() { return P; }, now: () => gameNow(), get paused() { return paused; }, get clips() { return Object.keys(clips).length; }, get clipPlays() { return clipPlays; }, feel: (w, m, ms) => feel(w, m, ms) };
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈런왕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  /* 한 화면: 포수 뒤에서 본 야간 경기장. 위에 LED 전광판, 나머지는 캔버스 하나. */
  :root {
    color-scheme: dark;
    --bg: #0b0f1e;
    --ink: #f4f1e6;
    --sub: #9aa3b8;
    --led: #ffcf3a;
    --red: #ff4b3e;
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --body: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
  body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; padding: 24px; background: rgba(6, 9, 20, .62); pointer-events: none;
  }
  .hidden { display: none; }
  .overlay h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(56px, 16vw, 96px); color: var(--led); line-height: 1; text-shadow: 0 4px 0 #b3361f, 0 10px 30px rgba(0,0,0,.6); }
  .overlay h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(36px, 10vw, 56px); color: var(--ink); }
  .overlay p { margin: 0; font-size: 18px; color: var(--ink); max-width: 22em; line-height: 1.5; }
  .overlay .small { font-size: 15px; color: var(--sub); }
  .overlay .stat { font-family: var(--display); font-size: 30px; color: var(--led); }
  .blink { margin-top: 14px; font-size: 18px; font-weight: 700; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #snd {
    position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 5;
    min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer;
    background: rgba(255,255,255,.12); color: var(--ink); font: 700 15px var(--body);
  }
  #time {
    position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 5;
    min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--led); color: #1a1406; font: 900 16px var(--body);
  }
  #time.hidden { display: none; }
  .btns { display: flex; gap: 10px; margin-top: 10px; }
  .btns button { min-height: 52px; padding: 0 26px; border-radius: 16px; border: 0; cursor: pointer; font: 900 18px var(--body); background: var(--led); color: #1a1406; }
  .btns button.ghost { background: rgba(255,255,255,.14); color: var(--ink); }
  #time:focus-visible, .btns button:focus-visible, #snd:focus-visible { outline: 3px solid var(--led); outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="야구 타석"></canvas></div>

<div class="overlay" id="title">
  <h1>홈런왕</h1>
  <p>공이 홈플레이트에 닿는 순간에 맞춰 누르세요.<br>정확할수록 멀리 날아갑니다. 아웃 세 개면 끝.</p>
  <div class="blink">스페이스 · 클릭 · 터치로 시작</div>
  <p class="small" id="best-title"></p>
</div>

<div class="overlay hidden" id="over">
  <h2>경기 종료</h2>
  <div class="stat" id="final"></div>
  <p id="final-sub"></p>
  <p class="small" id="best-over"></p>
  <div class="blink">다시 하려면 누르세요</div>
</div>

<button id="snd" type="button">소리·목소리</button>
<button id="time" type="button" class="hidden">타임</button>

<div class="overlay hidden" id="pause" style="pointer-events:auto">
  <h2>타임</h2>
  <p>경기가 멈췄습니다.</p>
  <div class="btns"><button type="button" id="resume">계속하기</button><button type="button" id="restart" class="ghost">처음부터</button></div>
</div>

<script>
(() => {
  "use strict";
  // ================= 기본 =================
  const W = 480, H = 720;                     // 논리 좌표 (세로 2:3)
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const $ = s => document.querySelector(s);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let S = 1;
  function fit() {
    const vv = window.visualViewport;
    const vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
    S = Math.min(vw / W, vh / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = Math.floor(W * S) + "px"; cv.style.height = Math.floor(H * S) + "px";
    cv.width = Math.floor(W * S * dpr); cv.height = Math.floor(H * S * dpr);
    ctx.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);
    bgCache = null;
  }
  window.addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);

  // ================= 원근 =================
  // 카메라는 홈플레이트 2.5m 뒤, 높이 1.4m. 거리 d(m)의 땅·공을 화면에 투영한다.
  const HORIZON = 250, F = 696, CAMH = 1.4, PLATE_D = 2.5, MOUND_D = PLATE_D + 18.44;
  const proj = (x, y, d) => { const k = F / d; return { x: W / 2 + x * k, y: HORIZON + (CAMH - y) * k, k }; };
  const ZONE = { x0: -0.22, x1: 0.22, y0: 0.5, y1: 1.05 };

  // ================= 소리 =================
  const MODES = ["all", "sfx", "off"], LABEL = { all: "소리·목소리", sfx: "효과음만", off: "소리 끔" };
  let mode = store.get("homerun.snd"); if (!MODES.includes(mode)) mode = "all";
  let actx = null, master = null, noiseBuf = null;
  function audio() {
    if (mode === "off") return null;
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = actx.createDynamicsCompressor();
        master = actx.createGain(); master.gain.value = 0.9; master.connect(comp).connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (actx.state === "suspended") actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function tone(f, dur, type = "sine", vol = 0.1, delay = 0, to = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(type, freq, q, dur, vol, delay = 0, to = 0, attack = 0.004) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master); src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  }
  const sfx = {
    pitch() { noise("bandpass", 600, 1, 0.25, 0.08, 0, 1800); },
    swing() { noise("bandpass", 500, 0.8, 0.18, 0.22, 0, 2400, 0.02); },
    mitt() { noise("lowpass", 900, 0.7, 0.09, 0.6); tone(110, 0.1, "sine", 0.35, 0, 60); },     // 미트에 꽂히는 퍽
    crack(power) {    // 배트에 맞는 딱!
      noise("highpass", 2500, 0.8, 0.05, 0.7 * power); tone(1900, 0.06, "triangle", 0.25 * power, 0, 1200);
      noise("bandpass", 1200, 2, 0.12, 0.3 * power, 0.005); tone(240, 0.12, "sine", 0.3 * power, 0, 120);
      if (power > 1.1) noise("highpass", 2200, 0.8, 0.25, 0.12, 0.09);   // 경기장 메아리
    },
    dull() { noise("bandpass", 700, 1.5, 0.09, 0.45); tone(300, 0.08, "triangle", 0.2, 0, 180); },
    crowd(vol = 0.2, dur = 1.6) { noise("bandpass", 900, 0.6, dur, vol, 0, 0, dur * 0.25); noise("bandpass", 2200, 0.8, dur * 0.8, vol * 0.5, 0.05, 0, dur * 0.2); },
    groan() { noise("lowpass", 500, 0.7, 0.9, 0.15, 0, 0, 0.2); },
    organ() { [392, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, i === 5 ? 0.45 : 0.14, "square", 0.06, [0, .15, .3, .45, .7, .85][i])); },
    level() { [523, 784, 1047].forEach((f, i) => tone(f, 0.16, "square", 0.06, i * 0.09)); },
    over() { [392, 330, 262].forEach((f, i) => tone(f, 0.35, "triangle", 0.1, i * 0.18)); },
  };
  // 심판 목소리: 짧은 낱말만, 낮고 힘차게
  let voice = null;
  function pickVoice() { try { const vs = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang)); voice = vs.find(v => /male|남|injoon|인준/i.test(v.name)) || vs[0] || null; } catch (e) {} }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(t, pitch = 0.85) {
    if (mode !== "all" || !("speechSynthesis" in window)) return;
    try { if (speechSynthesis.pending) speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "ko-KR"; if (voice) u.voice = voice; u.pitch = pitch; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {}
  }
  const sndBtn = $("#snd");
  const syncSnd = () => { sndBtn.textContent = LABEL[mode]; };
  syncSnd();
  sndBtn.addEventListener("pointerdown", e => e.stopPropagation());
  sndBtn.addEventListener("click", e => { e.stopPropagation(); mode = MODES[(MODES.indexOf(mode) + 1) % 3]; store.set("homerun.snd", mode); syncSnd(); sndBtn.blur(); });

  // ================= 구질·투구 =================
  // 휘는 정도는 출발과 도착에서 0이 되도록: 처음엔 엉뚱한 곳으로 가다가 끝에서 꺾인다.
  const PITCHES = {
    fast:   { name: "직구",     speed: 1.0,  bend: z => ({ x: 0, y: 0.06 * Math.sin(Math.PI * z) }) },
    change: { name: "체인지업", speed: 0.8,  bend: z => ({ x: 0.12 * z * (1 - z ** 3), y: 0.18 * z * (1 - z ** 4) }) },
    curve:  { name: "커브",     speed: 0.74, bend: z => ({ x: -0.18 * z * (1 - z ** 2), y: 0.55 * Math.sin(Math.PI * z) * (1 - z) + 0.25 * z * (1 - z ** 3) }) },
    slider: { name: "슬라이더", speed: 0.88, bend: z => ({ x: 0.42 * z * (1 - z ** 4), y: 0.05 * Math.sin(Math.PI * z) }) },
    fork:   { name: "포크",     speed: 0.86, bend: z => ({ x: 0, y: 0.42 * z * (1 - z ** 5) }) },
    knuckle:{ name: "너클",     speed: 0.68, bend: (z, s) => ({ x: 0.07 * Math.sin(z * 17 + s) * z, y: 0.06 * Math.sin(z * 13 + s * 2) * z }) },
    rising: { name: "라이징 직구", speed: 1.06, bend: z => ({ x: 0, y: -0.12 * z * (1 - z ** 2) + 0.08 * Math.sin(Math.PI * z) }) },
  };
  // 레벨별로 열리는 것
  const UNLOCK = [
    null,
    { pitch: "fast", motion: "windup" },
    { pitch: "change" },
    { pitch: "curve", motion: "set" },
    { pitch: "slider" },
    { pitch: "fork", motion: "quick" },
    { pitch: "knuckle", motion: "hesitate" },
    { motion: "side" },
    { pitch: "rising" },
  ];
  const MOTION_NAME = { windup: "와인드업", set: "세트포지션", quick: "퀵모션", hesitate: "멈칫 투구", side: "사이드암" };
  const PITCHES_PER_LEVEL = 12;

  // ================= 판정 창 (ms) =================
  // 버튼을 누른 순간과 공이 홈에 닿는 순간의 차이
  const WIN = { hr: 18, double: 30, single: 44, out: 62, foul: 95 };

  // ================= 상태 =================
  let state = "title";     // title | play | over
  let best = Number(store.get("homerun.best")) || 0;
  let G, P, fx, msg, now = performance.now();
  let paused = false, pauseAcc = 0, pauseStart = 0;
  const gameNow = () => (paused ? pauseStart : performance.now()) - pauseAcc;
  // 경기 시계 기준 예약 (타임 중엔 흐르지 않는다)
  let timers = [];
  const later = (fn, ms) => timers.push({ at: now + ms, fn });

  function newGame() {
    G = { runs: 0, outs: 0, balls: 0, strikes: 0, bases: [0, 0, 0], pitches: 0, level: 1, hits: 0, hr: 0, pool: ["fast"], motions: ["windup"], batters: 1, combo: 0 };
    fx = []; msg = null; P = null; timers = [];
    nextPitch(900);
  }

  function levelUp() {
    const L = G.level + 1;
    G.level = L;
    const u = UNLOCK[L];
    const news = [];
    if (u && u.pitch) { G.pool.push(u.pitch); news.push("새 구질 · " + PITCHES[u.pitch].name); }
    if (u && u.motion) { G.motions.push(u.motion); news.push("새 모션 · " + MOTION_NAME[u.motion]); }
    sfx.level();
    banner(`LEVEL ${L}`, news.join("  ") || "공이 더 빨라집니다", "#ffcf3a", 1800);
  }

  // 다음 투구는 delay 뒤에 만든다. 그 사이엔 지금 공(날아가는 타구, 스윙 자세)을 계속 보여 준다.
  let queuedAt = 0;
  function nextPitch(delay = 1300) { queuedAt = now + delay; }
  function makePitch() {
    const L = G.level, delay = 0;
    const type = pick(G.pool);
    const motion = pick(G.motions);
    const fb = Math.min(162, 122 + (L - 1) * 4.5 + rand(-2, 2));            // 직구 구속(km/h)
    const kmh = Math.round(fb * PITCHES[type].speed);
    const inZone = Math.random() < 0.56;
    let tx, ty;
    if (inZone) { tx = rand(ZONE.x0 + 0.03, ZONE.x1 - 0.03); ty = rand(ZONE.y0 + 0.04, ZONE.y1 - 0.04); }
    else {
      const side = pick(["in", "out", "high", "low", "low"]);
      const off = rand(0.06, 0.32);
      tx = side === "in" ? ZONE.x0 - off : side === "out" ? ZONE.x1 + off : rand(ZONE.x0, ZONE.x1);
      ty = side === "high" ? ZONE.y1 + off : side === "low" ? ZONE.y0 - off : rand(ZONE.y0, ZONE.y1);
    }
    const side = motion === "side";
    const rel = releasePoint(side);
    const flight = (18.44 / (kmh / 3.6)) * 1000;     // 날아오는 시간(ms)
    // 모션 시간표: 준비 → (다리 들기·멈칫) → 내딛기 → 놓기
    const setT = rand(500, 1100);
    const lift = motion === "quick" ? 120 : motion === "set" ? 320 : 480;
    const hold = motion === "hesitate" ? rand(250, 650) : motion === "windup" && L > 3 ? rand(0, 180) : 0;
    const stride = motion === "quick" ? 130 : 220;
    const t0 = now + delay;
    P = {
      type, motion, kmh, inZone, tx, ty, rel, flight, seed: rand(0, 6),
      tSet: t0, tLift: t0 + setT, tHold: t0 + setT + lift, tStride: t0 + setT + lift + hold, tRel: t0 + setT + lift + hold + stride,
      swung: false, swingT: 0, result: null, done: false, hit: null, brk: tx < 0 ? -1 : 1,
    };
    P.tArr = P.tRel + flight;
  }

  // 공의 3D 위치 (z: 0=놓는 순간, 1=홈 도착)
  function ballPos(z) {
    const b = PITCHES[P.type].bend(z, P.seed);
    const x = P.rel.x + (P.tx - P.rel.x) * z + b.x * P.brk;   // brk: 휘는 방향(±1)
    const y = P.rel.y + (P.ty - P.rel.y) * z + b.y;
    const d = P.rel.d + (PLATE_D - P.rel.d) * z;
    return { x, y, d };
  }

  // ================= 입력 =================
  function press(ev) {
    if (state === "title") { start(); return; }
    if (state === "over") { if (now - overAt > 900) start(); return; }
    if (!P || P.swung || P.done || P.result) return;
    if (paused) return;
    const raw = ev && ev.timeStamp && Math.abs(ev.timeStamp - performance.now()) < 1000 ? ev.timeStamp : performance.now();
    const t = raw - pauseAcc;                 // 경기 시계로 바꾼다
    if (t < P.tRel - 120) return;            // 공을 놓기도 전에 누르면 무시
    P.swung = true; P.swingT = t;
    sfx.swing();
    judge(t - P.tArr);
  }
  window.addEventListener("keydown", e => {
    if (e.code === "Escape" || e.code === "KeyP") { if (state === "play") setPause(!paused); return; }
    if (e.code === "Space" || e.code === "Enter") { if (paused) return; e.preventDefault(); if (!e.repeat) press(e); }
  });
  window.addEventListener("pointerdown", e => { if (e.target.closest && e.target.closest("button")) return; e.preventDefault(); press(e); });

  // ================= 타임 =================
  const timeBtn = $("#time");
  function setPause(on) {
    if (on === paused || state !== "play") return;
    if (on) { pauseStart = performance.now(); paused = true; try { speechSynthesis.cancel(); } catch (e) {} if (actx) actx.suspend(); }
    else { pauseAcc += performance.now() - pauseStart; paused = false; if (actx && mode !== "off") actx.resume(); }
    $("#pause").classList.toggle("hidden", !on);
    timeBtn.classList.toggle("hidden", on);
    if (on) $("#resume").focus();
  }
  timeBtn.addEventListener("click", e => { e.stopPropagation(); setPause(true); });
  $("#resume").addEventListener("click", e => { e.stopPropagation(); setPause(false); });
  $("#restart").addEventListener("click", e => { e.stopPropagation(); setPause(false); start(); });
  // 다른 앱·탭으로 가면 저절로 타임
  document.addEventListener("visibilitychange", () => { if (document.hidden) setPause(true); });

  function start() {
    state = "play";
    $("#title").classList.add("hidden"); $("#over").classList.add("hidden");
    timeBtn.classList.remove("hidden");
    audio();
    newGame();
    say("플레이볼!", 0.9);
  }

  // ================= 판정 =================
  function inZoneFinal() { return P.tx >= ZONE.x0 && P.tx <= ZONE.x1 && P.ty >= ZONE.y0 && P.ty <= ZONE.y1; }
  function judge(delta) {
    const ad = Math.abs(delta);
    const far = Math.max(ZONE.x0 - P.tx, P.tx - ZONE.x1, ZONE.y0 - P.ty, P.ty - ZONE.y1, 0);   // 존에서 벗어난 거리(m)
    P.delta = delta;
    // 존 밖 공은 맞혀도 한 단계씩 나빠지고, 너무 멀면 헛스윙
    let tier = ad <= WIN.hr ? 0 : ad <= WIN.double ? 1 : ad <= WIN.single ? 2 : ad <= WIN.out ? 3 : ad <= WIN.foul ? 4 : 5;
    if (far > 0.2) tier = 5; else if (far > 0) tier = Math.min(5, tier + (far > 0.1 ? 2 : 1));
    // 어려운 구질일수록 정타가 조금 어렵다
    if (tier < 3 && (P.type === "knuckle" || P.type === "fork") && Math.random() < 0.25) tier++;
    const kinds = ["hr", "double", "single", "out", "foul", "whiff"];
    P.pending = kinds[tier];
    // 결과는 공이 홈에 닿는 순간에 낸다 (일찍 휘둘렀으면 그때까지 기다림)
    if (P.pending === "whiff") P.resolveAt = Math.max(now, P.tArr);
    else P.resolveAt = Math.max(now, Math.min(P.tArr + 8, now + 30));
  }

  function resolve(kind) {
    P.result = kind;
    const late = P.delta > 0;
    switch (kind) {
      case "hr": {
        sfx.crack(1.4); sfx.crowd(0.4, 3); later(sfx.organ, 900);
        launch(rand(42, 48), rand(26, 34), (late ? 1 : -1) * rand(2, 22));
        const n = 1 + G.bases.reduce((a, b) => a + b, 0);
        G.runs += n; G.bases = [0, 0, 0]; G.hits++; G.hr++;
        say("홈런!", 1.0);
        banner(n === 4 ? "만루 홈런!" : "홈런!", `${n}점`, "#ffcf3a", 2400, true);
        endPA(); break;
      }
      case "double": {
        sfx.crack(1.1); sfx.crowd(0.25, 1.8);
        launch(rand(33, 38), rand(16, 24), (late ? 1 : -1) * rand(14, 34));
        advance(2); G.hits++;
        say("2루타!", 0.95); banner("2루타!", "", "#ffffff", 1500);
        endPA(); break;
      }
      case "single": {
        sfx.crack(0.95); sfx.crowd(0.18, 1.4);
        launch(rand(26, 33), rand(6, 16), (late ? 1 : -1) * rand(4, 38));
        advance(1); G.hits++;
        say("안타!", 0.95); banner("안타!", "", "#ffffff", 1300);
        endPA(); break;
      }
      case "out": {
        sfx.dull();
        const fly = Math.random() < 0.55;
        launch(fly ? rand(24, 30) : rand(16, 22), fly ? rand(38, 55) : rand(-8, 2), (late ? 1 : -1) * rand(0, 35));
        out(fly ? "뜬공 아웃" : "땅볼 아웃"); break;
      }
      case "foul": {
        sfx.dull();
        const back = Math.random() < 0.4;
        if (back) launch(rand(18, 26), rand(55, 75), 180 + rand(-25, 25));
        else launch(rand(22, 30), rand(10, 30), (late ? 1 : -1) * rand(50, 70));
        if (G.strikes < 2) G.strikes++;
        say("파울!"); banner("파울", "", "#d7dbe6", 1000);
        nextPitch(1500); break;
      }
      case "whiff": strike(true); break;
      case "strike": strike(false); break;
      case "ball": {
        sfx.mitt();
        G.balls++;
        if (G.balls >= 4) { advanceWalk(); say("볼넷!"); banner("볼넷", "", "#7ee08a", 1300); endPA(); }
        else { say("볼!"); banner("볼", "", "#7ee08a", 800); nextPitch(); }
        break;
      }
    }
  }
  function strike(swinging) {
    sfx.mitt();
    G.strikes++;
    if (G.strikes >= 3) { out(swinging ? "헛스윙 삼진" : "루킹 삼진", true); return; }
    say(swinging ? "헛스윙!" : "스트라이크!");
    banner(swinging ? "헛스윙" : "스트라이크", "", "#ffcf3a", 900);
    nextPitch();
  }
  function out(label, k) {
    G.outs++;
    if (k) sfx.groan();
    say(k ? "삼진 아웃!" : "아웃!");
    banner(label, `${G.outs} 아웃`, "#ff6b5e", 1500);
    if (G.outs >= 3) { queuedAt = 0; later(gameOver, 1700); P.done = true; return; }
    endPA();
  }
  function endPA() { G.balls = 0; G.strikes = 0; G.batters++; nextPitch(2200); }
  function advance(n) {
    let runs = 0;
    const b = G.bases;
    for (let i = 2; i >= 0; i--) if (b[i]) { b[i] = 0; if (i + n >= 3) runs++; else b[i + n] = 1; }
    b[n - 1] = 1;
    G.runs += runs;
    if (runs) later(() => banner(`${runs}점 득점!`, "", "#7ee08a", 1200), 900);
  }
  function advanceWalk() {
    const b = G.bases;
    if (b[0]) { if (b[1]) { if (b[2]) G.runs++; b[2] = 1; } b[1] = 1; }
    b[0] = 1;
  }

  // 맞은 공: 3D 포물선으로 날린다 (속도 m/s, 발사각, 좌우각)
  function launch(v, ang, spray) {
    const a = ang * Math.PI / 180, s = spray * Math.PI / 180;
    P.hit = { x: 0, y: 0.9, d: PLATE_D, vx: v * Math.cos(a) * Math.sin(s), vy: v * Math.sin(a), vd: v * Math.cos(a) * Math.cos(s), t0: now, trail: [] };
  }

  function gameOver() {
    state = "over";
    timeBtn.classList.add("hidden");
    sfx.over();
    const nb = G.runs > best;
    if (nb) { best = G.runs; store.set("homerun.best", String(best)); }
    $("#final").textContent = `${G.runs}점`;
    $("#final-sub").textContent = `안타 ${G.hits} · 홈런 ${G.hr} · 레벨 ${G.level} · 타자 ${G.batters}명`;
    $("#best-over").textContent = nb ? "신기록!" : `최고 기록 ${best}점`;
    $("#over").classList.remove("hidden");
    overAt = now;
    say("게임 셋!");
  }
  let overAt = 0;

  // ================= 알림 문구 =================
  function banner(big, small, color, dur, huge) { msg = { big, small, color, t0: now, dur, huge }; }

  // ================= 갱신 =================
  function update() {
    if (state !== "play") return;
    if (timers.length) { const due = timers.filter(t => now >= t.at); timers = timers.filter(t => now < t.at); due.forEach(t => t.fn()); }
    if (queuedAt && now >= queuedAt) { queuedAt = 0; makePitch(); }
    if (!P) return;
    // 레벨: 공 12개마다
    if (!P.counted && now >= P.tRel) {
      P.counted = true; G.pitches++; sfx.pitch();
      if (G.pitches % PITCHES_PER_LEVEL === 0 && G.level < 30) later(levelUp, 1200);
    }
    if (P.pending && !P.result && now >= P.resolveAt) resolve(P.pending);
    // 안 휘두르고 지나간 공
    // 늦은 스윙(파울)까지 기다렸다가 판정한다
    if (!P.swung && !P.result && now >= P.tArr + WIN.foul + 5) resolve(inZoneFinal() ? "strike" : "ball");
    // 날아가는 공
    if (P.hit) {
      const h = P.hit, dt = 1 / 60;
      for (let i = 0; i < 2; i++) {
        if (h.y <= 0 && h.vy < 0) { h.vy *= -0.35; h.vd *= 0.6; h.vx *= 0.6; h.y = 0; }
        h.x += h.vx * dt / 2; h.y += h.vy * dt / 2; h.d += h.vd * dt / 2; h.vy -= 9.8 * dt / 2;
      }
      h.trail.push({ x: h.x, y: h.y, d: h.d }); if (h.trail.length > 14) h.trail.shift();
    }
    for (const f of fx) { f.t += 1 / 60; f.x += f.vx; f.y += f.vy; f.vy += 0.05; }
    fx = fx.filter(f => f.t < f.life);
    if (P.result === "hr" && Math.random() < 0.25) firework();
  }
  function firework() {
    const x = rand(60, 420), y = rand(60, 200), col = pick(["#ffcf3a", "#ff4b3e", "#7ee08a", "#5ab8ff", "#ffffff"]);
    for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, sp = rand(1.5, 3.2); fx.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: rand(0.7, 1.2), col }); }
    if (Math.random() < 0.3) tone(rand(300, 500), 0.2, "sine", 0.04, 0, 80);
  }

  // ================= 그리기 =================
  let bgCache = null;
  function drawBackground(c) {

    // 타석 흙과 홈플레이트
    c.fillStyle = "#b07a49"; c.beginPath(); c.ellipse(W / 2, 646, 150, 46, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "rgba(255,255,255,.7)"; c.lineWidth = 2;
    for (const s of [-1, 1]) c.strokeRect(W / 2 + s * 92 - 34, 610, 68, 70);
    const hp = [[-0.22, PLATE_D], [0.22, PLATE_D], [0.22, PLATE_D + 0.22], [0, PLATE_D + 0.43], [-0.22, PLATE_D + 0.22]].map(([x, d]) => proj(x, 0, d));
    c.fillStyle = "#f6f3ea"; c.beginPath(); c.moveTo(hp[0].x, hp[0].y); for (const p of hp) c.lineTo(p.x, p.y); c.closePath(); c.fill();
  }

  // ================= 사람 골격 =================
  // 관절을 실제 3차원(미터) 공간에 두고, 동작마다 자세(키프레임)를 정해 그 사이를 부드럽게 잇는다.
  // 그릴 때는 경기장과 같은 원근(proj)으로 투영하고, 먼 부위부터 칠한다.
  const V = (x, y, z) => ({ x, y, z });
  const add = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z);
  const mul = (a, s) => V(a.x * s, a.y * s, a.z * s);
  const norm = a => { const l = Math.hypot(a.x, a.y, a.z) || 1; return V(a.x / l, a.y / l, a.z / l); };
  const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  function mix(a, b, t) {      // 숫자·벡터가 섞인 자세 두 개를 보간
    const o = {};
    for (const k in a) o[k] = typeof a[k] === "number" ? a[k] + (b[k] - a[k]) * t : V(a[k].x + (b[k].x - a[k].x) * t, a[k].y + (b[k].y - a[k].y) * t, a[k].z + (b[k].z - a[k].z) * t);
    return o;
  }
  // keys: [[시각, 자세], ...] 시각 순. 구간마다 가속·감속을 넣는다.
  function poseAt(keys, t, curve = ease) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
      const [t0, a] = keys[i - 1], [t1, b] = keys[i];
      return mix(a, b, curve((t - t0) / (t1 - t0)));
    }
    return keys[keys.length - 1][1];
  }
  // 팔꿈치·무릎: 두 끝점 사이를 bend 방향으로 꺾는다
  function joint(a, b, len, bend) {
    const mid = mul(add(a, b), 0.5);
    const d = Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
    const h = Math.sqrt(Math.max(0, len * len - (d / 2) * (d / 2)));
    return add(mid, mul(norm(bend), h));
  }

  // 원근 투영 + 크기 배율(투수는 멀어서 조금 키운다)
  function makeProjector(ox, od, scale = 1) {
    const base = proj(ox, 0, od);
    return p => {
      const q = proj(ox + p.x, p.y, od + p.z);
      return { x: base.x + (q.x - base.x) * scale, y: base.y + (q.y - base.y) * scale, k: q.k * scale, d: od + p.z };
    };
  }
  function limb(c, pr, a, b, w, col) {
    const A = pr(a), B = pr(b);
    c.strokeStyle = col; c.lineWidth = Math.max(1.2, w * (A.k + B.k) / 2); c.lineCap = "round";
    c.beginPath(); c.moveTo(A.x, A.y); c.lineTo(B.x, B.y); c.stroke();
  }
  // 그릴 것들을 깊이 순(먼 것 먼저)으로
  function paint(c, items) { items.sort((p, q) => q.d - p.d); for (const it of items) it.f(); }

  // ---------- 투수 (오른손, 포수를 마주 봄) ----------
  // th: 몸 돌림(90 = 옆으로 서서 왼어깨가 홈 쪽, 0 = 정면). lean: 홈 쪽으로 숙임.
  // rh: 던지는 손, gh: 글러브 손, lf/rf: 왼발·오른발, lk/rk: 무릎 굽히는 방향
  const PK = {
    set:     { th: 90, lean: 0.02, hip: V(0, 0.95, 0),     rh: V(-0.26, 1.28, 0.02),  gh: V(-0.26, 1.3, -0.04),  lf: V(0.02, 0, -0.24), rf: V(0, 0, 0.16) },
    lift:    { th: 98, lean: -0.08, hip: V(0, 0.99, 0.04), rh: V(-0.22, 1.36, 0.06),  gh: V(-0.22, 1.38, 0.0),   lf: V(-0.12, 0.62, -0.12), rf: V(0, 0, 0.14) },
    lowlift: { th: 92, lean: 0, hip: V(0, 0.96, 0.02),     rh: V(-0.24, 1.3, 0.04),   gh: V(-0.24, 1.32, -0.02),  lf: V(-0.02, 0.22, -0.2), rf: V(0, 0, 0.15) },
    stride:  { th: 78, lean: 0.18, hip: V(0.04, 0.78, -0.42), rh: V(0.3, 1.5, 0.6),   gh: V(-0.22, 1.34, -0.7),   lf: V(0.3, 0, -0.98), rf: V(-0.06, 0, 0.14) },
    release: { th: 8, lean: 0.5, hip: V(0.06, 0.8, -0.72),  rh: V(-0.34, 1.72, -0.98), gh: V(0.3, 1.08, -0.52),    lf: V(0.3, 0, -1.02), rf: V(-0.1, 0.06, -0.12) },
    follow:  { th: -22, lean: 1.0, hip: V(0.08, 0.76, -0.86), rh: V(0.38, 0.62, -1.06), gh: V(0.34, 0.96, -0.58),  lf: V(0.3, 0, -1.02), rf: V(-0.16, 0.48, 0.12) },
  };
  // 사이드암: 팔이 옆으로 낮게
  const PK_SIDE = {
    stride:  { ...PK.stride, rh: V(0.24, 1.28, 0.58) },
    release: { ...PK.release, lean: 0.32, rh: V(-0.82, 1.34, -0.82) },
    follow:  { ...PK.follow, lean: 0.7, rh: V(0.42, 0.82, -1.0) },
  };
  function pitcherPose() {
    if (!P) return PK.set;
    const side = P.motion === "side", K = side ? { ...PK, ...PK_SIDE } : PK;
    const lift = P.motion === "quick" ? PK.lowlift : PK.lift;
    const bob = { ...lift, hip: add(lift.hip, V(0, Math.sin(now / 90) * 0.006, 0)) };   // 멈칫할 때 미세하게 흔들림
    return poseAt([
      [P.tLift, K.set], [P.tHold, lift], [P.tStride, bob],
      [P.tStride + (P.tRel - P.tStride) * 0.62, K.stride], [P.tRel, K.release],
      [P.tRel + 380, K.follow], [P.tRel + 900, K.follow], [P.tRel + 1600, K.set],
    ], now);
  }
  function pitcherJoints(p) {
    const th = p.th * Math.PI / 180;
    const axis = V(-Math.cos(th), 0, Math.sin(th));            // 왼어깨 → 오른어깨
    const fwd = V(-Math.sin(th), 0, -Math.cos(th));            // 가슴이 향한 쪽
    const sc = add(p.hip, V(0, 0.52 * Math.cos(p.lean), -0.52 * Math.sin(p.lean)));   // 어깨 중심
    const ls = add(sc, mul(axis, -0.19)), rs = add(sc, mul(axis, 0.19));
    const hipAxis = V(-Math.cos(th * 0.75), 0, Math.sin(th * 0.75));
    const lh = add(p.hip, mul(hipAxis, -0.11)), rhp = add(p.hip, mul(hipAxis, 0.11));
    return {
      sc, ls, rs, lh, rhp, fwd,
      head: add(sc, V(0, 0.24 * Math.cos(p.lean * 0.8), -0.24 * Math.sin(p.lean * 0.8))),
      le: joint(ls, p.gh, 0.3, add(V(0, -1, 0), mul(fwd, -0.4))), re: joint(rs, p.rh, 0.3, add(V(0, -0.6, 0), mul(axis, 0.7))),
      lk: joint(lh, p.lf, 0.47, add(fwd, V(0, 0.3, -0.6))), rk: joint(rhp, p.rf, 0.47, add(fwd, V(0, 0, -0.4))),
    };
  }
  let lastHand = null;
  function drawPitcher(c) {
    const p = pitcherPose(), J = pitcherJoints(p);
    const pr = makeProjector(0, MOUND_D, 1.4);
    const UNI = "#f2f2f2", NAVY = "#1d3a8a", SKIN = "#e8b98f", SHOE = "#151515";
    // 그림자
    const g0 = pr(V(0, 0, -0.3));
    c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.ellipse(g0.x, g0.y + 1, 16, 3, 0, 0, 7); c.fill();
    const it = [];
    const seg = (a, b, w, col) => it.push({ d: MOUND_D + (a.z + b.z) / 2, f: () => limb(c, pr, a, b, w, col) });
    // 다리
    seg(J.lh, J.lk, 0.17, UNI); seg(J.lk, p.lf, 0.14, UNI); seg(p.lf, add(p.lf, mul(J.fwd, 0.12)), 0.1, SHOE);
    seg(J.rhp, J.rk, 0.17, UNI); seg(J.rk, p.rf, 0.14, UNI); seg(p.rf, add(p.rf, mul(J.fwd, 0.12)), 0.1, SHOE);
    // 몸통
    it.push({ d: MOUND_D + p.hip.z + 0.01, f: () => {
      limb(c, pr, p.hip, J.sc, 0.34, UNI);
      const a = pr(J.lh), b = pr(J.rhp); c.strokeStyle = NAVY; c.lineWidth = 2; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    } });
    // 팔
    seg(J.ls, J.le, 0.1, UNI); seg(J.le, p.gh, 0.09, UNI);
    it.push({ d: MOUND_D + p.gh.z, f: () => { const q = pr(p.gh); c.fillStyle = "#6b3b1c"; c.beginPath(); c.arc(q.x, q.y, Math.max(2.5, 0.08 * q.k), 0, 7); c.fill(); } });
    seg(J.rs, J.re, 0.1, UNI); seg(J.re, p.rh, 0.09, UNI);
    it.push({ d: MOUND_D + p.rh.z - 0.01, f: () => { const q = pr(p.rh); c.fillStyle = SKIN; c.beginPath(); c.arc(q.x, q.y, Math.max(1.8, 0.05 * q.k), 0, 7); c.fill(); } });
    // 머리·모자
    it.push({ d: MOUND_D + J.head.z, f: () => {
      const q = pr(J.head), r = Math.max(3, 0.11 * q.k);
      c.fillStyle = SKIN; c.beginPath(); c.arc(q.x, q.y, r, 0, 7); c.fill();
      c.fillStyle = NAVY; c.beginPath(); c.arc(q.x, q.y - r * 0.25, r * 1.02, Math.PI, 0); c.fill();
      const v = pr(add(J.head, add(mul(J.fwd, 0.13), V(0, 0.04, 0)))); c.strokeStyle = NAVY; c.lineWidth = r * 0.5; c.beginPath(); c.moveTo(q.x, q.y - r * 0.2); c.lineTo(v.x, v.y - r * 0.2); c.stroke();
    } });
    paint(c, it);
    lastHand = pr(p.rh);
    return { hand: lastHand };
  }
  // 공이 나가는 지점: 던지는 손의 '놓는 순간' 자세
  function releasePoint(side) {
    const r = (side ? PK_SIDE.release : PK.release).rh;
    return { x: r.x, y: r.y, d: MOUND_D + r.z };
  }

  // ---------- 타자 (오른손, 포수 쪽에서 본 모습) ----------
  // 홈플레이트 왼쪽에 서서 홈 쪽(+x)을 본다. th: 몸통 돌림(0 = 옆으로, 90 = 투수를 정면으로)
  const BX = -0.7, BD = 3.0;
  const BK_ = {
    stance:  { th: 0, hip: V(0, 0.9, 0),       hands: V(-0.05, 1.46, -0.16), bat: V(-0.28, 0.82, -0.5),  ff: V(0.02, 0, 0.36), bf: V(0, 0, -0.34) },
    load:    { th: -14, hip: V(-0.02, 0.88, -0.05), hands: V(-0.12, 1.44, -0.24), bat: V(-0.45, 0.72, -0.52), ff: V(0.02, 0.07, 0.3), bf: V(0, 0, -0.34) },
    launch:  { th: 22, hip: V(0.02, 0.86, 0.04), hands: V(0.04, 1.18, -0.12), bat: V(-0.55, 0.12, -0.82),  ff: V(0.04, 0, 0.42), bf: V(0, 0.03, -0.34) },
    contact: { th: 58, hip: V(0.04, 0.86, 0.08), hands: V(0.26, 1.02, 0.12),  bat: V(0.96, -0.08, 0.28),  ff: V(0.04, 0, 0.42), bf: V(0.06, 0.06, -0.3) },
    extend:  { th: 88, hip: V(0.04, 0.87, 0.1),  hands: V(0.22, 1.12, 0.42),  bat: V(0.28, 0.12, 0.96),   ff: V(0.04, 0, 0.42), bf: V(0.1, 0.1, -0.26) },
    finish:  { th: 112, hip: V(0.03, 0.9, 0.1),  hands: V(-0.12, 1.46, 0.3),  bat: V(-0.82, 0.42, -0.24), ff: V(0.04, 0, 0.42), bf: V(0.12, 0.12, -0.22) },
  };
  function batterPose() {
    const t = now;
    const idle = { ...BK_.stance, bat: add(BK_.stance.bat, V(0, 0, Math.sin(t / 260) * 0.12)) };   // 배트를 까딱이며 기다림
    if (!P) return idle;
    if (P.swung) {
      const s = P.swingT;
      return poseAt([[s, BK_.load], [s + 40, BK_.launch], [s + 75, BK_.contact], [s + 125, BK_.extend], [s + 300, BK_.finish]], t, x => 1 - Math.pow(1 - x, 2));
    }
    // 투수가 공을 놓을 때 배트를 당겨 준비하고, 안 치면 천천히 돌아온다
    return poseAt([[P.tRel - 200, idle], [P.tRel + 60, BK_.load], [P.tArr + 160, BK_.load], [P.tArr + 700, idle]], t);
  }
  function drawBatter(c) {
    const p = batterPose(), th = p.th * Math.PI / 180;
    const chest = V(Math.cos(th), 0, Math.sin(th)), axis = V(-Math.sin(th), 0, Math.cos(th));   // axis: 뒤어깨 → 앞어깨
    const sc = add(p.hip, V(0.04, 0.52, 0));
    const fs = add(sc, mul(axis, 0.2)), bs = add(sc, mul(axis, -0.2));
    const hipAxis = V(-Math.sin(th * 0.6), 0, Math.cos(th * 0.6));
    const fh = add(p.hip, mul(hipAxis, 0.12)), bh = add(p.hip, mul(hipAxis, -0.12));
    const head = add(sc, add(V(0, 0.25, 0), mul(chest, 0.03)));
    const bat = norm(p.bat), grip = p.hands, tip = add(grip, mul(bat, 0.86)), knob = add(grip, mul(bat, -0.05));
    const fe = joint(fs, grip, 0.31, add(V(0, -1, 0), mul(chest, -0.3)));
    const be = joint(bs, grip, 0.31, add(V(0, -0.8, 0), mul(axis, -0.8)));
    const fk = joint(fh, p.ff, 0.48, add(chest, V(0, 0, 0.3))), bk = joint(bh, p.bf, 0.48, add(chest, V(0, 0, -0.2)));
    const pr = makeProjector(BX, BD, 0.88);
    const UNI = "#ececf1", NAVY = "#1f2a5c", RED = "#c62f2f", SKIN = "#e8b98f";
    const it = [];
    const seg = (a, b, w, col) => it.push({ d: BD + (a.z + b.z) / 2, f: () => limb(c, pr, a, b, w, col) });
    // 다리
    seg(fh, fk, 0.2, UNI); seg(fk, p.ff, 0.16, UNI); seg(add(p.ff, V(0, 0.1, 0)), p.ff, 0.13, NAVY); seg(p.ff, add(p.ff, V(0.16, 0, 0.02)), 0.1, "#111");
    seg(bh, bk, 0.2, UNI); seg(bk, p.bf, 0.16, UNI); seg(add(p.bf, V(0, 0.1, 0)), p.bf, 0.13, NAVY); seg(p.bf, add(p.bf, V(0.16, 0, 0)), 0.1, "#111");
    // 몸통: 등번호는 등이 카메라 쪽으로 보일 때만
    it.push({ d: BD + p.hip.z + 0.02, f: () => {
      limb(c, pr, p.hip, sc, 0.36, UNI);
      const a = pr(fh), b = pr(bh); c.strokeStyle = NAVY; c.lineWidth = Math.max(3, 0.05 * a.k); c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
      const back = -Math.sin(th);    // 등이 카메라를 향한 정도
      if (back > -0.2 && th < 0.9) {
        const m = pr(add(mul(add(p.hip, sc), 0.5), V(-0.08, 0.05, -0.12)));
        c.fillStyle = RED; c.font = `${Math.round(0.2 * m.k)}px 'Black Han Sans', sans-serif`; c.textAlign = "center"; c.fillText("10", m.x, m.y + 0.06 * m.k);
      }
    } });
    // 팔과 배트
    seg(bs, be, 0.11, UNI); seg(be, grip, 0.1, UNI);
    seg(fs, fe, 0.11, UNI); seg(fe, grip, 0.1, UNI);
    it.push({ d: BD + (grip.z + tip.z) / 2 - 0.05, f: () => {
      limb(c, pr, knob, tip, 0.065, "#c58a4b");
      limb(c, pr, add(grip, mul(bat, 0.45)), tip, 0.075, "#d39a5a");
      limb(c, pr, knob, add(grip, mul(bat, 0.12)), 0.05, "#5a3a1e");
      const q = pr(grip); c.fillStyle = RED; c.beginPath(); c.arc(q.x, q.y, Math.max(4, 0.06 * q.k), 0, 7); c.fill();
    } });
    // 휘두른 자국
    if (P && P.swung && now - P.swingT < 200 && now - P.swingT > 20) {
      it.push({ d: BD - 1, f: () => {
        c.save(); c.globalAlpha = 0.18 * (1 - (now - P.swingT) / 200); c.fillStyle = "#fff";
        const pts = [];
        for (let k = 0; k <= 8; k++) { const q = poseAt([[0, BK_.launch], [1, BK_.extend]], k / 8, x => x); pts.push(pr(add(q.hands, mul(norm(q.bat), 0.8)))); }
        c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (const q of pts) c.lineTo(q.x, q.y); c.lineTo(pr(grip).x, pr(grip).y); c.fill(); c.restore();
      } });
    }
    // 헬멧
    it.push({ d: BD + head.z, f: () => {
      const q = pr(head), r = 0.125 * q.k;
      c.fillStyle = SKIN; c.beginPath(); c.arc(q.x + r * 0.15, q.y + r * 0.1, r * 0.9, 0, 7); c.fill();
      c.fillStyle = NAVY; c.beginPath(); c.arc(q.x, q.y, r, Math.PI * 0.9, Math.PI * 2.15); c.fill();
      c.fillStyle = "#33437f"; c.beginPath(); c.ellipse(q.x - r * 0.45, q.y + r * 0.2, r * 0.42, r * 0.5, 0, 0, 7); c.fill();   // 귀 덮개
      c.fillStyle = "rgba(255,255,255,.25)"; c.beginPath(); c.arc(q.x - r * 0.3, q.y - r * 0.45, r * 0.22, 0, 7); c.fill();
    } });
    paint(c, it);
  }

  function drawZone(c) {
    const a = proj(ZONE.x0, ZONE.y1, PLATE_D), b = proj(ZONE.x1, ZONE.y0, PLATE_D);
    c.strokeStyle = "rgba(255,255,255,.28)"; c.lineWidth = 1.5; c.setLineDash([6, 5]);
    c.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y); c.setLineDash([]);
  }

  function drawBallAt(c, p, r) {
    c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.ellipse(p.sx, p.gy, r * 1.1, r * 0.35, 0, 0, 7); c.fill();
    c.fillStyle = "#fbfbf6"; c.beginPath(); c.arc(p.sx, p.sy, r, 0, 7); c.fill();
    if (r > 4) { c.strokeStyle = "#d33"; c.lineWidth = Math.max(1, r * 0.12); c.beginPath(); c.arc(p.sx - r * 0.9, p.sy, r * 0.75, -0.9, 0.9); c.stroke(); c.beginPath(); c.arc(p.sx + r * 0.9, p.sy, r * 0.75, Math.PI - 0.9, Math.PI + 0.9); c.stroke(); }
  }
  function ballScreen(w) { const p = proj(w.x, w.y, w.d), g = proj(w.x, 0, w.d); return { sx: p.x, sy: p.y, gy: g.y, k: p.k }; }

  function drawPitchBall(c, hand) {
    if (!P || P.hit) return;
    if (now < P.tRel) return;
    if (P.result && P.result !== "strike" && P.result !== "ball" && P.result !== "whiff") return;
    const z = clamp((now - P.tRel) / P.flight, 0, 1.06);
    if (z >= 1.06) return;                        // 미트에 들어간 뒤엔 감춘다
    const w = ballPos(Math.min(z, 1));
    if (z > 1) w.d = PLATE_D - (z - 1) * 6;      // 포수 미트로
    const sc = ballScreen(w);
    const r = Math.max(1.6, 0.06 * sc.k);
    if (z < 0.18 && hand) { const u = ease(z / 0.18); sc.sx = hand.x + (sc.sx - hand.x) * u; sc.sy = hand.y + (sc.sy - hand.y) * u; }
    drawBallAt(c, sc, r);
  }

  function drawHitBall(c) {
    if (!P || !P.hit) return;
    const h = P.hit;
    for (let i = 0; i < h.trail.length; i++) {
      const s = ballScreen(h.trail[i]);
      if (h.trail[i].d < 0.6) continue;
      c.fillStyle = `rgba(255,255,255,${(i / h.trail.length) * 0.35})`;
      c.beginPath(); c.arc(s.sx, s.sy, Math.max(1, 0.05 * s.k), 0, 7); c.fill();
    }
    if (h.d < 0.6) return;        // 카메라 뒤로 넘어간 파울
    const s = ballScreen(h);
    drawBallAt(c, s, Math.max(1.4, 0.06 * s.k));
  }

  function led(c, x, y, on, col) {
    c.fillStyle = on ? col : "#2b2f3d"; c.beginPath(); c.arc(x, y, 6.5, 0, 7); c.fill();
    if (on) { c.fillStyle = "rgba(255,255,255,.35)"; c.beginPath(); c.arc(x - 2, y - 2, 2.2, 0, 7); c.fill(); }
  }
  function drawBoard(c) {
    // 위쪽 전광판: B·S·O, 점수, 주자, 구속
    c.fillStyle = "#05070f"; c.fillRect(0, 0, W, 112);
    c.fillStyle = "#11162a"; c.fillRect(6, 6, W - 12, 100);
    c.font = "bold 15px sans-serif"; c.textAlign = "left"; c.fillStyle = "#c8cbe0";
    const rows = [["B", G.balls, 3, "#5ee07a"], ["S", G.strikes, 2, "#ffcf3a"], ["O", G.outs, 2, "#ff4b3e"]];
    rows.forEach(([l, n, max, col], i) => { const y = 30 + i * 26; c.fillStyle = "#c8cbe0"; c.fillText(l, 18, y + 5); for (let j = 0; j < max; j++) led(c, 44 + j * 18, y, j < n, col); });
    // 점수
    c.textAlign = "center"; c.fillStyle = "#ffcf3a"; c.font = "44px 'Black Han Sans', sans-serif"; c.fillText(String(G.runs), 190, 72);
    c.font = "bold 13px sans-serif"; c.fillStyle = "#c8cbe0"; c.fillText("득점", 190, 94);
    // 주자 다이아몬드
    const cx = 290, cy = 56, sz = 12;
    const base = (x, y, on) => { c.save(); c.translate(x, y); c.rotate(Math.PI / 4); c.fillStyle = on ? "#ffcf3a" : "#2b2f3d"; c.fillRect(-sz / 2, -sz / 2, sz, sz); c.restore(); };
    base(cx + 22, cy, G.bases[0]); base(cx, cy - 22, G.bases[1]); base(cx - 22, cy, G.bases[2]);
    c.fillStyle = "#c8cbe0"; c.beginPath(); c.moveTo(cx, cy + 26); c.lineTo(cx - 6, cy + 20); c.lineTo(cx + 6, cy + 20); c.fill();
    // 구속·구질
    c.textAlign = "right";
    c.font = "bold 13px sans-serif"; c.fillStyle = "#c8cbe0"; c.fillText(`LV ${G.level}`, W - 18, 26);
    if (P && now >= P.tRel) {
      c.font = "30px 'Black Han Sans', sans-serif"; c.fillStyle = "#ff8a3d"; c.fillText(`${P.kmh}`, W - 46, 66);
      c.font = "bold 12px sans-serif"; c.fillStyle = "#ff8a3d"; c.fillText("km/h", W - 16, 66);
      c.font = "bold 15px sans-serif"; c.fillStyle = "#ffffff"; c.fillText(PITCHES[P.type].name, W - 18, 92);
    } else if (P) {
      c.font = "bold 13px sans-serif"; c.fillStyle = "#8a90a8"; c.fillText(MOTION_NAME[P.motion], W - 18, 92);
    }
  }

  function drawMsg(c) {
    if (P && P.swung && P.delta != null && now - P.swingT < 1300) {
      const d = Math.round(P.delta), ad = Math.abs(d);
      const t = ad <= WIN.hr ? "완벽!" : d < 0 ? `빠름 ${ad}ms` : `늦음 ${ad}ms`;
      c.font = "bold 18px sans-serif"; c.textAlign = "center"; c.fillStyle = ad <= WIN.hr ? "#ffcf3a" : "#ffffff";
      c.fillText(t, W / 2, 560);
    }
    if (!msg) return;
    const u = (now - msg.t0) / msg.dur;
    if (u > 1) { msg = null; return; }
    const pop = u < 0.12 ? 0.6 + (u / 0.12) * 0.5 : u < 0.2 ? 1.1 - (u - 0.12) / 0.08 * 0.1 : 1;
    const alpha = u > 0.8 ? (1 - u) / 0.2 : 1;
    c.save(); c.globalAlpha = alpha; c.translate(W / 2, 300); c.scale(pop, pop);
    c.textAlign = "center";
    c.font = `${msg.huge ? 74 : 52}px 'Black Han Sans', sans-serif`;
    c.lineWidth = 8; c.strokeStyle = "rgba(0,0,0,.65)"; c.strokeText(msg.big, 0, 0);
    c.fillStyle = msg.color; c.fillText(msg.big, 0, 0);
    if (msg.small) { c.font = "bold 20px sans-serif"; c.lineWidth = 5; c.strokeText(msg.small, 0, 34); c.fillStyle = "#fff"; c.fillText(msg.small, 0, 34); }
    c.restore();
  }

  function draw() {
    if (!bgCache) {
      bgCache = document.createElement("canvas");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      bgCache.width = Math.floor(W * S * dpr); bgCache.height = Math.floor(H * S * dpr);
      const b = bgCache.getContext("2d"); b.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);
      drawBackground(b);
    }
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bgCache, 0, 0); ctx.restore();
    // 관중석 플래시 (홈런 때)
    if (P && P.result === "hr") for (let i = 0; i < 18; i++) { ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fillRect(Math.random() * W, 152 + Math.random() * 90, 2, 2); }
    const hand = drawPitcher(ctx).hand;
    drawZone(ctx);
    drawPitchBall(ctx, hand);
    drawHitBall(ctx);
    drawBatter(ctx);
    for (const f of fx) { ctx.globalAlpha = 1 - f.t / f.life; ctx.fillStyle = f.col; ctx.fillRect(f.x, f.y, 3, 3); }
    ctx.globalAlpha = 1;
    if (state !== "title" && G) drawBoard(ctx);
    drawMsg(ctx);
  }

  // ================= 루프 =================
  let acc = 0, last = performance.now();
  function frame(t) {
    now = gameNow();
    if (paused) { last = t; draw(); requestAnimationFrame(frame); return; }
    acc += Math.min(0.1, (t - last) / 1000); last = t;
    while (acc >= 1 / 60) { update(); acc -= 1 / 60; }
    draw();
    requestAnimationFrame(frame);
  }

  $("#best-title").textContent = best ? `최고 기록 ${best}점` : "";
  // 타이틀 화면용 기본 상태
  G = { runs: 0, outs: 0, balls: 0, strikes: 0, bases: [0, 0, 0], level: 1, pool: ["fast"], motions: ["windup"] };
  fx = [];
  fit();
  requestAnimationFrame(frame);

  // 테스트용 읽기 훅
  window.__hr = { get state() { return state; }, get G() { return G; }, get P() { return P; }, now: () => gameNow(), get paused() { return paused; } };
})();
</script>
</body>
</html>

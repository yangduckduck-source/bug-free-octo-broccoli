<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈런왕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  /* 한 화면: 포수 뒤에서 본 야간 경기장. 위에 LED 전광판, 나머지는 캔버스 하나. */
  :root {
    color-scheme: dark;
    --bg: #0b0f1e;
    --ink: #f4f1e6;
    --sub: #9aa3b8;
    --led: #ffcf3a;
    --red: #ff4b3e;
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --body: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
  body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; padding: 24px; background: rgba(6, 9, 20, .62); pointer-events: none;
  }
  .hidden { display: none; }
  .overlay h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(56px, 16vw, 96px); color: var(--led); line-height: 1; text-shadow: 0 4px 0 #b3361f, 0 10px 30px rgba(0,0,0,.6); }
  .overlay h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(36px, 10vw, 56px); color: var(--ink); }
  .overlay p { margin: 0; font-size: 18px; color: var(--ink); max-width: 22em; line-height: 1.5; }
  .overlay .small { font-size: 15px; color: var(--sub); }
  .overlay .stat { font-family: var(--display); font-size: 30px; color: var(--led); }
  .blink { margin-top: 14px; font-size: 18px; font-weight: 700; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #snd {
    position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 5;
    min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer;
    background: rgba(255,255,255,.12); color: var(--ink); font: 700 15px var(--body);
  }
  #time {
    position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 5;
    min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--led); color: #1a1406; font: 900 16px var(--body);
  }
  #time.hidden { display: none; }
  /* 작전 버튼: 아래 가운데. 쓸 수 있을 때만 나타난다 */
  #acts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 5; display: flex; gap: 8px; }
  #acts .act { min-height: 44px; min-width: 76px; padding: 0 14px; border-radius: 999px; border: 2px solid rgba(255,255,255,.55); cursor: pointer;
    background: rgba(10,14,30,.72); color: var(--ink); font: 900 16px var(--body); }
  #acts .act.on { background: var(--led); color: #1a1406; border-color: var(--led); }
  #acts .act:disabled { opacity: .6; cursor: default; }
  #acts .act.hidden { display: none; }
  #acts .act:focus-visible { outline: 3px solid var(--led); outline-offset: 2px; }
  .btns { display: flex; gap: 10px; margin-top: 10px; }
  .btns button { min-height: 52px; padding: 0 26px; border-radius: 16px; border: 0; cursor: pointer; font: 900 18px var(--body); background: var(--led); color: #1a1406; }
  .btns button.ghost { background: rgba(255,255,255,.14); color: var(--ink); }
  #time:focus-visible, .btns button:focus-visible, #snd:focus-visible { outline: 3px solid var(--led); outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="야구 타석"></canvas></div>

<div class="overlay" id="title">
  <h1>홈런왕</h1>
  <p>공이 홈플레이트에 닿는 순간에 맞춰 누르세요.<br>정확할수록 멀리 날아갑니다. 아웃 세 개면 끝.</p>
  <div class="blink">스페이스 · 클릭 · 터치로 시작</div>
  <p class="small" id="best-title"></p>
</div>

<div class="overlay hidden" id="over">
  <h2>경기 종료</h2>
  <div class="stat" id="final"></div>
  <p id="final-sub"></p>
  <p class="small" id="best-over"></p>
  <div class="blink">다시 하려면 누르세요</div>
</div>

<button id="snd" type="button">소리·목소리</button>
<button id="time" type="button" class="hidden">타임</button>
<div id="acts"><button id="buntBtn" type="button" class="act hidden">번트</button><button id="stealBtn" type="button" class="act hidden">도루</button></div>

<div class="overlay hidden" id="pause" style="pointer-events:auto">
  <h2>타임</h2>
  <p>경기가 멈췄습니다.</p>
  <div class="btns"><button type="button" id="resume">계속하기</button><button type="button" id="restart" class="ghost">처음부터</button></div>
</div>

<script>
(() => {
  "use strict";
  // ================= 기본 =================
  const W = 480, H = 720;                     // 논리 좌표 (세로 2:3)
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const $ = s => document.querySelector(s);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let S = 1;
  function fit() {
    const vv = window.visualViewport;
    const vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
    S = Math.min(vw / W, vh / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = Math.floor(W * S) + "px"; cv.style.height = Math.floor(H * S) + "px";
    cv.width = Math.floor(W * S * dpr); cv.height = Math.floor(H * S * dpr);
    ctx.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);
    bgCache = null;
  }
  window.addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);

  // ================= 원근 =================
  // 카메라는 홈플레이트 2.5m 뒤, 높이 1.4m. 거리 d(m)의 땅·공을 화면에 투영한다.
  const HORIZON = 250, F = 696, CAMH = 1.4, PLATE_D = 2.5, MOUND_D = PLATE_D + 18.44;
  const proj = (x, y, d) => { const k = F / d; return { x: W / 2 + x * k, y: HORIZON + (CAMH - y) * k, k }; };
  const ZONE = { x0: -0.22, x1: 0.22, y0: 0.5, y1: 1.05 };

  // ================= 소리 =================
  const MODES = ["all", "sfx", "off"], LABEL = { all: "소리·목소리", sfx: "효과음만", off: "소리 끔" };
  let mode = store.get("homerun.snd"); if (!MODES.includes(mode)) mode = "all";
  let actx = null, master = null, noiseBuf = null;
  // 오디오 엔진은 페이지가 뜨자마자 만들어 둔다(멈춘 상태). 녹음은 이 엔진으로 미리 풀고, 소리는 첫 터치 때 깨운다
  function initAudio() {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = actx.createDynamicsCompressor();
        master = actx.createGain(); master.gain.value = 0.9; master.connect(comp).connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      return actx;
    } catch (e) { return null; }
  }
  function audio() {
    if (mode === "off") return null;
    const a = initAudio(); if (!a) return null;
    try { if (a.state !== "running") a.resume(); } catch (e) {}
    return a;
  }

  // ---- 소리 지킴이 ----
  // 휴대폰에서 가끔 소리가 끊기는 세 가지 경우를 되살린다.
  //  1) 전화·알림·잠금·앱 전환 뒤 엔진이 '중단(interrupted)'·'일시정지'로 멈춤 → 손을 댈 때·화면에 돌아올 때 다시 깨운다
  //  2) 아이폰은 '손을 뗄 때' 같은 진짜 사용자 동작 안에서 소리를 한 번 내야 풀린다 → 들리지 않는 한 조각을 튼다
  //  3) 이어폰 연결 등으로 엔진이 '켜짐'인데 시계가 멈춘 채 얼어붙음 → 엔진을 새로 갈아 끼운다
  //  + 무음 스위치가 켜져 있어도 게임 소리는 '재생'으로 취급(iOS 16.4 이상)
  let guardAT = -1, guardWall = 0;
  function wakeAudio() {
    try { if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback"; } catch (e) {}
    if (!actx || !(!paused)) return;
    try {
      const now = performance.now();
      if (actx.state === "running" && guardAT >= 0 && now - guardWall > 1500 && actx.currentTime === guardAT) {
        try { actx.close(); } catch (e) {}
        actx = null; initAudio();
        if (!actx) return;
      }
      if (actx.state !== "running") actx.resume();
      const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
      src.buffer = b; src.connect(actx.destination); src.start(0);
      guardAT = actx.currentTime; guardWall = now;
    } catch (e) {}
  }
  ["pointerdown", "pointerup", "touchend", "click", "keydown"].forEach(ev => window.addEventListener(ev, wakeAudio, { capture: true, passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wakeAudio(); });
  window.addEventListener("pageshow", wakeAudio);
  function tone(f, dur, type = "sine", vol = 0.1, delay = 0, to = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(type, freq, q, dur, vol, delay = 0, to = 0, attack = 0.004) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master); src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  }
  const sfx = {
    pitch() { noise("bandpass", 600, 1, 0.25, 0.08, 0, 1800); },
    swing() { noise("bandpass", 500, 0.8, 0.18, 0.22, 0, 2400, 0.02); },
    mitt() { noise("lowpass", 900, 0.7, 0.09, 0.6); tone(110, 0.1, "sine", 0.35, 0, 60); },     // 미트에 꽂히는 퍽
    // 알루미늄 배트 "깡!": 순간 접촉음 + 퍽 하는 몸통 + 금속관이 길게 우는 비조화 배음(1 : 2.76 : 5.4)
    // 살짝 어긋난 쌍둥이 음을 겹쳐 "까아앙" 하고 떨리며 사라진다
    ping(power = 1, ring = 1) {
      const f = 1500 + power * 300;
      noise("highpass", 4500, 0.7, 0.035, 1.0 * power, 0, 0, 0.001);       // 딱 맞는 찰나
      noise("bandpass", 2600, 2, 0.09, 0.55 * power, 0, 0, 0.001);
      tone(f * 0.5, 0.08, "triangle", 0.35 * power, 0, f * 0.28);           // 손바닥에 오는 퍽
      tone(f, 0.95 * ring, "sine", 0.42 * power, 0, f * 0.965);
      tone(f * 1.007, 0.85 * ring, "sine", 0.22 * power, 0, f * 0.972);
      tone(f * 2.76, 0.5 * ring, "sine", 0.2 * power, 0, f * 2.76 * 0.98);
      tone(f * 5.4, 0.26 * ring, "sine", 0.1 * power);
      tone(f * 1.51, 0.35 * ring, "triangle", 0.1 * power);
      if (power > 1.1) { tone(f, 0.6, "sine", 0.1, 0.14, f * 0.965); tone(f * 2.76, 0.3, "sine", 0.05, 0.14); }   // 관중석에 부딪혀 돌아오는 메아리
    },
    crack(power) { this.ping(power, 0.6 + power * 0.45); },
    tip() { this.ping(0.7, 0.4); },                 // 빗맞은 "팅" (파울·범타)
    dull() { noise("bandpass", 700, 1.5, 0.09, 0.45); tone(300, 0.08, "triangle", 0.2, 0, 180); },
    crowd(vol = 0.2, dur = 1.6) { noise("bandpass", 900, 0.6, dur, vol, 0, 0, dur * 0.25); noise("bandpass", 2200, 0.8, dur * 0.8, vol * 0.5, 0.05, 0, dur * 0.2); },
    groan() { noise("lowpass", 500, 0.7, 0.9, 0.15, 0, 0, 0.2); },
    organ() { [392, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, i === 5 ? 0.45 : 0.14, "square", 0.06, [0, .15, .3, .45, .7, .85][i])); },
    level() { [523, 784, 1047].forEach((f, i) => tone(f, 0.16, "square", 0.06, i * 0.09)); },
    pa() { tone(68, 0.22, "sine", 0.22, 0, 50); noise("lowpass", 260, 0.7, 0.35, 0.08, 0.02); },   // 구장 확성기의 낮은 울림
    over() { [392, 330, 262].forEach((f, i) => tone(f, 0.35, "triangle", 0.1, i * 0.18)); },
  };
  // 직접 녹음한 심판·아나운서 목소리 (앞뒤 침묵 자르고 저음·압축·구장 메아리 입힌 mp3)

    if (voiceFail) return;
    try {
      const vs = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang));
      voice = null; voiceMale = false;
      for (const re of MALE_VOICES) { const v = vs.find(v => re.test(v.name) || re.test(v.voiceURI || "")); if (v) { voice = v; voiceMale = true; break; } }
      if (!voice) voice = vs.find(v => !/female|여성/i.test(v.name)) || vs[0] || null;
    } catch (e) {}
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  // 모바일 브라우저는 '손가락을 뗀 순간' 같은 진짜 사용자 동작 안에서 한 번 말해야 음성이 풀린다
  let speechReady = false, lastLine = null;
  function unlockSpeech() {
    if (speechReady || !("speechSynthesis" in window)) return;
    try {
      speechReady = true; speechSynthesis.resume();
      // 풀리기 직전에 막힌 외침(누르자마자 나온 "플레이볼!")은 지금 다시, 아니면 무음 한 마디로 문만 연다
      if (lastLine && performance.now() - lastLine.at < 1000 && mode === "all") speechSynthesis.speak(utter(lastLine.t, lastLine.lift, !voice));
      else { const u = new SpeechSynthesisUtterance(" "); u.lang = "ko-KR"; u.volume = 0; speechSynthesis.speak(u); }
    } catch (e) {}
  }
  // 아이폰: 손을 뗄 때 오디오 엔진도 깨우고, 무음 스위치가 켜져 있어도 게임 소리가 나도록 재생 세션으로 둔다
  function unlockAudio() {
    if (mode === "off") return;
    try { if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback"; } catch (e) {}
    const a = initAudio(); try { if (a && a.state !== "running") a.resume(); } catch (e) {}
  }
  ["pointerup", "touchend", "click", "keydown"].forEach(ev => {
    window.addEventListener(ev, unlockSpeech, { capture: true, passive: true });
    window.addEventListener(ev, unlockAudio, { capture: true, passive: true });
  });
  function utter(t, lift, plain) {
    const u = new SpeechSynthesisUtterance(t); u.lang = "ko-KR";
    const male = !plain && voiceMale;
    if (voice && !plain) u.voice = voice;
    u.pitch = clamp((male ? 0.72 : 0.32) + lift, 0.1, 2);   // 남성 음성은 살짝만, 여성 음성은 바닥까지 낮춘다
    u.rate = 0.92 + lift * 0.3; u.volume = 1;
    // 고른 음성이 기기에서 안 돌면(네트워크 음성 등) 기본 음성으로 다시 말한다
    if (!plain) u.onerror = e => { if (!/interrupted|canceled/.test(e.error || "")) { if (++voiceFail >= 1) voice = null; try { speechSynthesis.speak(utter(t, lift, true)); } catch (er) {} } };
    return u;
  }
  // lift: 홈런처럼 흥분한 외침은 조금 올린다
  function say(t, lift = 0) {
    if (mode !== "all") return;
    if (LINE_KEY[t] && playClip(LINE_KEY[t])) return;     // 녹음이 있으면 녹음으로
    if (!("speechSynthesis" in window)) return;
    try {
      if (!voice && !voiceFail) pickVoice();
      lastLine = { t, lift, at: performance.now() };
      if (!speechReady) return;     // 아직 잠겨 있으면 손을 떼는 순간 unlockSpeech가 대신 말한다
      const go = () => { try { speechSynthesis.resume(); speechSynthesis.speak(utter(t, lift, !voice)); } catch (e) {} };
      // 말하는 중에 끊고 곧장 말하면 크롬·사파리가 새 말까지 삼킨다 → 끊고 잠깐 쉰 뒤 말한다
      if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 90); } else go();
      sfx.pa();
    } catch (e) {}
  }
  const sndBtn = $("#snd");
  const syncSnd = () => { sndBtn.textContent = LABEL[mode]; };
  syncSnd();
  sndBtn.addEventListener("pointerdown", e => e.stopPropagation());
  sndBtn.addEventListener("click", e => { e.stopPropagation(); mode = MODES[(MODES.indexOf(mode) + 1) % 3]; store.set("homerun.snd", mode); syncSnd(); sndBtn.blur(); });

  // ================= 구질·투구 =================
  // 휘는 정도는 출발과 도착에서 0이 되도록: 처음엔 엉뚱한 곳으로 가다가 끝에서 꺾인다.
  // 구질: kmh = 한국프로야구(KBO) 실제 구속 범위, col = 궤적 색
  const PITCHES = {
    fast:   { name: "직구",     kmh: [139, 148], col: "#bfe6ff", bend: z => ({ x: 0, y: 0.06 * Math.sin(Math.PI * z) }) },
    power:  { name: "강속구",   kmh: [150, 157], col: "#ff6a3d", bend: z => ({ x: 0, y: -0.1 * z * (1 - z ** 2) + 0.08 * Math.sin(Math.PI * z) }) },
    slider: { name: "슬라이더", kmh: [128, 137], col: "#ffd84a", bend: z => ({ x: 0.42 * z * (1 - z ** 4), y: 0.05 * Math.sin(Math.PI * z) }) },
    change: { name: "체인지업", kmh: [124, 132], col: "#c79bff", bend: z => ({ x: 0.12 * z * (1 - z ** 3), y: 0.18 * z * (1 - z ** 4) }) },
    curve:  { name: "커브",     kmh: [112, 122], col: "#7ee08a", bend: z => ({ x: -0.18 * z * (1 - z ** 2), y: 0.55 * Math.sin(Math.PI * z) * (1 - z) + 0.25 * z * (1 - z ** 3) }) },
    fork:   { name: "포크",     kmh: [127, 136], col: "#5ab8ff", bend: z => ({ x: 0, y: 0.42 * z * (1 - z ** 5) }) },
    knuckle:{ name: "너클",     kmh: [104, 114], col: "#ff8ad8", bend: (z, s) => ({ x: 0.07 * Math.sin(z * 17 + s) * z, y: 0.06 * Math.sin(z * 13 + s * 2) * z }) },
  };
  // 레벨별로 열리는 것: 처음엔 직구·강속구만, 레벨이 오를수록 변화구가 하나씩 열린다
  const UNLOCK = [
    null,
    null,
    { motion: "set" },
    { pitch: "slider" },
    { pitch: "change", motion: "quick" },
    { pitch: "curve" },
    { pitch: "fork", motion: "hesitate" },
    { motion: "side" },
    { pitch: "knuckle" },
  ];
  // 변화구 비중: 처음 열릴 땐 가끔(약 12%), 레벨마다 늘어 최대 60%쯤
  const BREAKING = { slider: 1.2, change: 1, curve: 0.9, fork: 0.9, knuckle: 0.35 };
  function pickPitch(L) {
    const brk = G.pool.filter(t => BREAKING[t]);
    if (brk.length && Math.random() < clamp(0.12 + (L - 3) * 0.07, 0.12, 0.6)) {
      let r = Math.random() * brk.reduce((a, t) => a + BREAKING[t], 0);
      for (const t of brk) { r -= BREAKING[t]; if (r <= 0) return t; }
      return brk[brk.length - 1];
    }
    return Math.random() < clamp(0.25 + (L - 1) * 0.03, 0.25, 0.5) ? "power" : "fast";
  }
  const MOTION_NAME = { windup: "와인드업", set: "세트포지션", quick: "퀵모션", hesitate: "멈칫 투구", side: "사이드암" };
  const PITCHES_PER_LEVEL = 12;

  // ================= 판정 창 (ms) =================
  // 버튼을 누른 순간과 공이 홈에 닿는 순간의 차이
  const WIN = { hr: 18, double: 30, single: 44, out: 62, foul: 95 };

  // ================= 상태 =================
  let state = "title";     // title | play | over
  let best = Number(store.get("homerun.best")) || 0;
  let G, P, fx, msg, now = performance.now();
  let paused = false, pauseAcc = 0, pauseStart = 0;
  // 경기 시계 = 실제 시간 × 배속. 배속이 바뀔 때마다 기준점을 옮겨 시계가 끊기지 않게 한다 (슬로 모션)
  let tsS = 1, tsR = 0, tsG = 0;
  const rawNow = () => (paused ? pauseStart : performance.now()) - pauseAcc;
  const toGame = r => tsG + (r - tsR) * tsS;
  const gameNow = () => toGame(rawNow());
  function setTimeScale(sc) { const r = rawNow(); tsG = toGame(r); tsR = r; tsS = sc; }
  // 경기 시계 기준 예약 (타임 중엔 흐르지 않는다)
  let timers = [];
  const later = (fn, ms) => timers.push({ at: now + ms, fn });

  function newGame() {
    G = { runs: 0, outs: 0, balls: 0, strikes: 0, bases: [0, 0, 0], pitches: 0, level: 1, hits: 0, hr: 0, pool: ["fast", "power"], motions: ["windup"], batters: 1, combo: 0, hits0: 0, hitRun: 0, hrRun: 0, standAt: 0 };
    fx = []; msg = null; P = null; timers = [];
    nextPitch(900);
  }

  function levelUp() {
    const L = G.level + 1;
    G.level = L;
    const u = UNLOCK[L];
    const news = [];
    if (u && u.pitch) { G.pool.push(u.pitch); news.push("새 구질 · " + PITCHES[u.pitch].name); }
    if (u && u.motion) { G.motions.push(u.motion); news.push("새 모션 · " + MOTION_NAME[u.motion]); }
    sfx.level();
    banner(`LEVEL ${L}`, news.join("  ") || "공이 더 빨라집니다", "#ffcf3a", 1800);
  }

  // 다음 투구는 delay 뒤에 만든다. 그 사이엔 지금 공(날아가는 타구, 스윙 자세)을 계속 보여 준다.
  let queuedAt = 0;
  function nextPitch(delay = 1300) { queuedAt = now + delay; }
  function makePitch() {
    const L = G.level, delay = 0;
    const type = pickPitch(L);
    const motion = pick(G.motions);
    // 구속은 KBO 실제 범위에서 고르고, 레벨이 오르면 조금씩(최대 +6) 빨라진다
    const [lo, hi] = PITCHES[type].kmh;
    const kmh = Math.min(160, Math.round(rand(lo, hi) + Math.min(6, (L - 1) * 0.6)));
    const inZone = Math.random() < 0.56;
    let tx, ty;
    if (inZone) { tx = rand(ZONE.x0 + 0.03, ZONE.x1 - 0.03); ty = rand(ZONE.y0 + 0.04, ZONE.y1 - 0.04); }
    else {
      const side = pick(["in", "out", "high", "low", "low"]);
      const off = rand(0.06, 0.32);
      tx = side === "in" ? ZONE.x0 - off : side === "out" ? ZONE.x1 + off : rand(ZONE.x0, ZONE.x1);
      ty = side === "high" ? ZONE.y1 + off : side === "low" ? ZONE.y0 - off : rand(ZONE.y0, ZONE.y1);
    }
    const side = motion === "side";
    const rel = releasePoint(side);
    // 날아오는 시간(ms): 실제로는 놓는 곳에서 홈까지 약 17m를 평균 93% 속도로 0.4~0.6초에 온다.
    // 그대로면 눈으로 쫓기 어려워, 중계 느린 화면처럼 늘려 보여 준다(레벨 1은 1.6배 → 점점 실제에 가깝게 1.18배까지)
    const slow = clamp(1.62 - (L - 1) * 0.035, 1.18, 1.62);
    const flight = 17 / (kmh / 3.6 * 0.93) * 1000 * slow;
    // 모션 시간표: 준비 → (다리 들기·멈칫) → 내딛기 → 놓기
    const setT = rand(500, 1100);
    const lift = motion === "quick" ? 120 : motion === "set" ? 320 : 480;
    const hold = motion === "hesitate" ? rand(250, 650) : motion === "windup" && L > 3 ? rand(0, 180) : 0;
    const stride = motion === "quick" ? 130 : 220;
    const t0 = now + delay;
    P = {
      type, motion, kmh, inZone, tx, ty, rel, flight, seed: rand(0, 6),
      tSet: t0, tLift: t0 + setT, tHold: t0 + setT + lift, tStride: t0 + setT + lift + hold, tRel: t0 + setT + lift + hold + stride,
      swung: false, swingT: 0, result: null, done: false, hit: null, brk: tx < 0 ? -1 : 1,
      no: G.batters,          // 지금 타석에 선 타자의 등번호 (판정이 나도 다음 공이 올 때까지 그대로)
      clutch: G.outs === 2 && G.strikes === 2,   // 2아웃 2스트라이크: 이 공은 슬로 모션
    };
    P.tArr = P.tRel + flight;
  }

  // 공의 3D 위치 (z: 0=놓는 순간, 1=홈 도착)
  function ballPos(z) {
    const b = PITCHES[P.type].bend(z, P.seed);
    const x = P.rel.x + (P.tx - P.rel.x) * z + b.x * P.brk;   // brk: 휘는 방향(±1)
    const y = P.rel.y + (P.ty - P.rel.y) * z + b.y;
    const d = P.rel.d + (PLATE_D - P.rel.d) * z;
    return { x, y, d };
  }

  // ================= 입력 =================
  function press(ev) {
    if (state === "title") { start(); return; }
    if (state === "over") { if (now - overAt > 900) start(); return; }
    if (!P || P.swung || P.done || P.result) return;
    if (paused) return;
    if (P.bunt) return;                       // 번트 자세: 공이 오면 저절로 댄다
    const raw = ev && ev.timeStamp && Math.abs(ev.timeStamp - performance.now()) < 1000 ? ev.timeStamp : performance.now();
    const t = toGame(raw - pauseAcc);         // 경기 시계로 바꾼다 (슬로 모션이면 늘어난 시간으로)
    if (t < P.tRel - 120) return;            // 공을 놓기도 전에 누르면 무시
    P.swung = true; P.swingT = t; feel("batter", "effort", 500);
    sfx.swing();
    judge(t - P.tArr);
  }
  window.addEventListener("keydown", e => {
    if (e.code === "Escape" || e.code === "KeyP") { if (state === "play") setPause(!paused); return; }
    if (e.code === "Space" || e.code === "Enter") { if (paused) return; e.preventDefault(); if (!e.repeat) press(e); }
  });
  window.addEventListener("pointerdown", e => { if (e.target.closest && e.target.closest("button")) return; e.preventDefault(); press(e); });

  // ================= 진동 =================
  // 안드로이드는 vibrate, 아이폰(사파리 18 이상)은 스위치를 켤 때 나는 '톡' 햅틱을 빌린다
  const hapticSwitch = (() => {
    try {
      const l = document.createElement("label"), i = document.createElement("input");
      i.type = "checkbox"; i.setAttribute("switch", ""); i.tabIndex = -1; l.appendChild(i);
      l.setAttribute("aria-hidden", "true"); l.style.cssText = "position:fixed;left:-200px;top:0;opacity:0;pointer-events:none";
      document.body.appendChild(l); return l;
    } catch (e) { return null; }
  })();
  const BUZZ = { hr: [45, 35, 70], double: [55], single: [40], out: [18], foul: [18] };
  function buzz(kind, delay) {
    const pat = BUZZ[kind]; if (!pat) return;
    let vib = false;
    try { if (navigator.vibrate) { vib = true; delay > 20 ? setTimeout(() => navigator.vibrate(pat), delay) : navigator.vibrate(pat); } } catch (e) {}
    if (!vib && hapticSwitch) { try { hapticSwitch.click(); } catch (e) {} }   // 아이폰은 누르는 순간 안에서만 울린다
  }

  // ================= 타임 =================
  const timeBtn = $("#time");
  function setPause(on) {
    if (on === paused || state !== "play") return;
    if (on) { pauseStart = performance.now(); paused = true; try { speechSynthesis.cancel(); } catch (e) {} if (actx) actx.suspend(); }
    else { pauseAcc += performance.now() - pauseStart; paused = false; if (actx && mode !== "off") actx.resume(); }
    $("#pause").classList.toggle("hidden", !on);
    timeBtn.classList.toggle("hidden", on);
    if (on) $("#resume").focus();
  }
  timeBtn.addEventListener("click", e => { e.stopPropagation(); setPause(true); });
  $("#resume").addEventListener("click", e => { e.stopPropagation(); setPause(false); });
  $("#restart").addEventListener("click", e => { e.stopPropagation(); setPause(false); start(); });
  // 다른 앱·탭으로 가면 저절로 타임
  document.addEventListener("visibilitychange", () => { if (document.hidden) setPause(true); });

  function start() {
    state = "play";
    $("#title").classList.add("hidden"); $("#over").classList.add("hidden");
    timeBtn.classList.remove("hidden");
    audio();
    newGame();
    say("플레이볼!", 0.1);
  }

  // ================= 판정 =================
  function inZoneFinal() { return P.tx >= ZONE.x0 && P.tx <= ZONE.x1 && P.ty >= ZONE.y0 && P.ty <= ZONE.y1; }
  function judge(delta) {
    const ad = Math.abs(delta);
    const far = Math.max(ZONE.x0 - P.tx, P.tx - ZONE.x1, ZONE.y0 - P.ty, P.ty - ZONE.y1, 0);   // 존에서 벗어난 거리(m)
    P.delta = delta;
    // 존 밖 공은 맞혀도 한 단계씩 나빠지고, 너무 멀면 헛스윙
    let tier = ad <= WIN.hr ? 0 : ad <= WIN.double ? 1 : ad <= WIN.single ? 2 : ad <= WIN.out ? 3 : ad <= WIN.foul ? 4 : 5;
    if (far > 0.2) tier = 5; else if (far > 0) tier = Math.min(5, tier + (far > 0.1 ? 2 : 1));
    // 어려운 구질일수록 정타가 조금 어렵다
    if (tier < 3 && (P.type === "knuckle" || P.type === "fork") && Math.random() < 0.25) tier++;
    // 2루타는 드물게: 2루타 타이밍이라도 열에 일곱은 단타로 끝난다 (안타 중 2루타 10% 이하)
    if (tier === 1 && Math.random() < 0.7) tier = 2;
    // 다섯 타자 연속 홈런은 없다: 네 타자 연속 홈런 뒤엔 완벽하게 맞혀도 담장을 맞고 나오는 2루타
    if (tier === 0 && G.hrRun >= 4) tier = 1;
    const kinds = ["hr", "double", "single", "out", "foul", "whiff"];
    P.pending = kinds[tier];
    buzz(P.pending, Math.max(0, Math.min(P.tArr + 8, now + 30) - now));
    // 결과는 공이 홈에 닿는 순간에 낸다 (일찍 휘둘렀으면 그때까지 기다림)
    if (P.pending === "whiff") P.resolveAt = Math.max(now, P.tArr);
    else P.resolveAt = Math.max(now, Math.min(P.tArr + 8, now + 30));
  }

  function resolve(kind) {
    P.result = kind; P.resAt = now;
    const late = P.delta > 0;
    if (kind === "ball" || kind === "strike" || kind === "whiff") {
      // 볼넷이면 주자는 밀려 가므로 도루는 없던 일, 아니면 포수가 받는 순간 던진다
      if (P.steal && !(kind === "ball" && G.balls >= 3)) later(stealOutcome, 120); else cancelSteal();
    } else cancelSteal();
    switch (kind) {
      // 맞힌 공: 지금은 소리와 함께 날리기만 하고, 판정은 공이 떨어지거나 넘어갈 때 낸다
      case "hr": {
        // 비거리를 먼저 정하고 그만큼 날아갈 속도를 거꾸로 구한다. 낮고 빠른 포물선이라 공이 화면에서 안 사라지고
        // 외야를 가로질러 날아가다 담장 위를 넘어 관중석에 떨어진다 (판정은 담장을 넘는 그 순간)
        sfx.crack(1.4); impact("hr"); sfx.crowd(0.18, 1.2);
        const R = rand(130, 150), ang = rand(18, 21), sp = (late ? 1 : -1) * rand(2, 15);
        launch(Math.sqrt(R * 9.8 / Math.sin(2 * ang * Math.PI / 180)), ang, sp); P.hrDist = Math.round(R);
        break;
      }
      case "double": sfx.crack(1.1); impact("double");  sfx.crowd(0.14, 1.0); launch(rand(33, 38), rand(16, 24), (late ? 1 : -1) * rand(14, 34)); break;
      case "single": sfx.crack(0.95); impact("single"); sfx.crowd(0.1, 0.8);  launch(rand(26, 33), rand(6, 16), (late ? 1 : -1) * rand(4, 38)); break;
      case "out": {
        sfx.tip(); impact("out");
        P.fly = Math.random() < 0.55;
        launch(P.fly ? rand(24, 30) : rand(16, 22), P.fly ? rand(38, 55) : rand(-8, 2), (late ? 1 : -1) * rand(0, 35));
        break;
      }
      case "foul": {
        sfx.tip(); impact("foul");
        P.back = Math.random() < 0.4;
        if (P.back) launch(rand(18, 26), rand(55, 75), 180 + rand(-25, 25));
        else launch(rand(22, 30), rand(10, 30), (late ? 1 : -1) * rand(50, 70));
        break;
      }
      case "whiff": strike(true); break;
      case "strike": strike(false); break;
      case "ball": {
        sfx.mitt();
        G.balls++;
        if (G.balls >= 4) { advanceWalk(); say("볼넷!"); feel("batter", "smirk", 1800); feel("pitcher", "annoyed", 1800); banner("볼넷", "", "#7ee08a", 1300); endPA(); }
        else { say("볼!"); feel("pitcher", "annoyed", 900); banner("볼", "", "#7ee08a", 800); nextPitch(); }
        break;
      }
    }
  }
  // 공이 떨어지거나(안타·파울), 펜스를 넘거나(홈런), 잡히거나(뜬공), 처리될 때(땅볼) 판정을 낸다
  function call(kind) {
    if (P.called) return;
    P.called = kind; P.calledAt = now;
    switch (kind) {
      case "hr": {
        sfx.crowd(0.42, 3); later(sfx.organ, 300);
        const n = 1 + G.bases.reduce((a, b) => a + b, 0);
        G.runs += n; G.bases = [0, 0, 0]; G.hits++; G.hr++;
        say("홈런!", 0.25); feel("batter", "joy", 2800); feel("pitcher", "shock", 2800);
        hrFx = { at: now, fenceAt: ballScreen(P.hit), dist: P.hrDist || 125 };
        banner(n === 4 ? "만루 홈런!" : "홈런!", `${n}점`, "#ffcf3a", 2400, true);
        endPA(); break;
      }
      case "double": sfx.crowd(0.25, 1.6); feel("batter", "joy", 2000); feel("pitcher", "annoyed", 2000); advance(2); G.hits++; say("2루타!", 0.15); banner("2루타!", "", "#ffffff", 1500); endPA(); break;
      case "single": sfx.crowd(0.18, 1.3); feel("batter", "happy", 1800); feel("pitcher", "annoyed", 1800); advance(1); G.hits++; say("안타!", 0.15); banner("안타!", "", "#ffffff", 1300); endPA(); break;
      case "out": {
        // 병살: 주자가 있고 아웃이 1개 이하일 때 땅볼이면 가끔 두 개를 한꺼번에 잡힌다
        const b = G.bases, any = b[0] || b[1] || b[2];
        if (!P.fly && any && G.outs <= 1 && !P.steal && Math.random() < (b[0] ? 0.28 : 0.12)) {
          if (b[0]) b[0] = 0; else b[b[1] ? 1 : 2] = 0;      // 1루 주자(없으면 가장 앞이 아닌 주자)가 2루에서 잡힌다
          sfx.mitt(); later(sfx.mitt, 260);
          if (!retire(2, "병살타!", `${Math.min(3, G.outs + 2)} 아웃`, "병살!")) endPA();
          break;
        }
        out(P.fly ? "뜬공 아웃" : "땅볼 아웃"); break;
      }
      case "foul":
        if (G.strikes < 2) G.strikes++;
        say("파울!"); banner("파울", "", "#d7dbe6", 1000); feel("batter", "annoyed", 1100);
        nextPitch(1300); lastStand(); break;
    }
  }
  function watchFlight() {
    const h = P.hit, kind = P.result, age = now - h.t0;
    if (P.called || !h) return;
    if (age > 4500) return call(kind);                                          // 안전장치
    if (kind === "hr" && h.d >= PLATE_D + 108) return call("hr");                // 펜스를 넘음
    if (kind === "foul" && P.back && age > 550) return call("foul");             // 뒤로 넘어감 (잠깐 뒤 판정)
    if (kind === "out" && P.fly && h.vy < 0 && h.y < 2.2) return call("out");    // 수비수가 잡음
    if (kind === "out" && !P.fly && age > 1100) return call("out");             // 땅볼을 처리
    if (h.landed && (kind === "single" || kind === "double" || kind === "foul")) return call(kind);   // 땅에 떨어짐
  }
  function strike(swinging) {
    sfx.mitt();
    G.strikes++;
    if (G.strikes >= 3) { out(swinging ? "헛스윙 삼진" : "루킹 삼진", true); return; }
    say(swinging ? "헛스윙!" : "스트라이크!"); feel("batter", swinging ? "annoyed" : "shock", 1000); feel("pitcher", "smirk", 1000);
    banner(swinging ? "헛스윙" : "스트라이크", "", "#ffcf3a", 900);
    nextPitch(); lastStand();
  }
  function out(label, k) {
    G.outs++;
    if (k) sfx.groan();

    banner(label, `${G.outs} 아웃`, "#ff6b5e", 1500);
    if (G.outs >= 3) { queuedAt = 0; later(gameOver, 1700); P.done = true; return; }
    endPA();
  }
  // 한 번에 n개 아웃(병살·주루사·희생번트). 세 번째 아웃이면 경기 끝
  function retire(n, label, small, voice) {
    G.outs += n;
    say(voice || "아웃!"); feel("batter", "sad", 1800); feel("pitcher", "smirk", 1800);
    banner(label, small != null ? small : `${Math.min(3, G.outs)} 아웃`, "#ff6b5e", 1600);
    if (G.outs >= 3) { G.outs = 3; queuedAt = 0; later(gameOver, 1800); P.done = true; return true; }
    return false;
  }
  function endPA() {
    // 타석 결과로 연속 기록을 잇는다: 홈런 뒤 홈런 = 백투백, 안타 뒤 안타 = 연속 안타
    const hit = G.hits > G.hits0, hr = hit && P && P.called === "hr";
    G.hits0 = G.hits; G.hitRun = hit ? G.hitRun + 1 : 0; G.hrRun = hr ? G.hrRun + 1 : 0;
    let wait = 2200;
    if (G.hrRun >= 2) {
      const n = Math.min(G.hrRun, 4), name = ["백투백 홈런!", "백투백투백!", "백투백투백투백!"][n - 2];
      hype(["b2b", "b2b3", "b2b4"][n - 2], name, `${n}타자 연속 홈런`, "#ffcf3a", 3200); wait = 5600;
    }
    else if (hit && G.hitRun >= 2) { hype("streak", "연속 안타!", `${G.hitRun}타자 연속 안타`, "#7ee08a", hr ? 3200 : 1400); wait = hr ? 5600 : 3800; }
    G.balls = 0; G.strikes = 0; G.batters++; nextPitch(wait);
  }
  // 흥분한 중계: 녹음이 있으면 그 목소리로 (없으면 자막과 함성만 — 기계 목소리는 섞지 않는다)
  function hype(key, big, small, color, delay) {
    later(() => {
      if (state !== "play") return;
      if (mode === "all" && VOICE_MP3[key]) playClip(key);
      sfx.crowd(0.32, 1.8); banner(big, small, color, 1700);
    }, delay);
  }
  // 2아웃 2스트라이크: 타자마다 한 번, 마지막 응원
  function lastStand() {
    if (state !== "play" || G.outs !== 2 || G.strikes !== 2 || G.standAt === G.batters) return;
    G.standAt = G.batters;
    if (queuedAt) queuedAt = Math.max(queuedAt, now + 3400);
    later(() => {
      if (state !== "play" || G.outs !== 2 || G.strikes !== 2) return;
      if (mode === "all" && VOICE_MP3.last) playClip("last");
      feel("batter", "focus", 1800); banner("야구는 지금부터!", "2아웃 2스트라이크", "#7ee08a", 1700);
    }, 1000);
  }
  function advance(n) {
    let runs = 0;
    const b = G.bases;
    for (let i = 2; i >= 0; i--) if (b[i]) { b[i] = 0; if (i + n >= 3) runs++; else b[i + n] = 1; }
    b[n - 1] = 1;
    G.runs += runs;
    if (runs) later(() => banner(`${runs}점 득점!`, "", "#7ee08a", 1200), 900);
  }
  function advanceWalk() {
    const b = G.bases;
    if (b[0]) { if (b[1]) { if (b[2]) G.runs++; b[2] = 1; } b[1] = 1; }
    b[0] = 1;
  }

  // ================= 작전: 도루·번트 =================
  const buntBtn = $("#buntBtn"), stealBtn = $("#stealBtn");
  // 도루할 수 있는 앞 주자: 2루 주자(3루가 비었을 때) 먼저, 아니면 1루 주자(2루가 비었을 때)
  function leadSteal() { const b = G.bases; if (b[1] && !b[2]) return 1; if (b[0] && !b[1]) return 0; return -1; }
  let actShown = "";
  function updateActs() {
    const live = state === "play" && !paused && P && !P.result && !P.done && !P.swung;
    const canBunt = live && now < P.tArr - 280;
    const canCancel = live && P.bunt && now < P.tArr - 40;      // 공이 홈을 지나기 직전까지 배트를 거둘 수 있다
    const canSteal = live && !P.steal && now < P.tRel + 60 && leadSteal() >= 0;
    const key = [canBunt, canCancel, P && P.bunt, canSteal || (P && P.steal && !P.steal.done && live)].join();
    if (key === actShown) return; actShown = key;
    buntBtn.classList.toggle("hidden", !(canBunt || (P && P.bunt && live)));
    buntBtn.classList.toggle("on", !!(P && P.bunt)); buntBtn.textContent = P && P.bunt ? "번트 취소" : "번트"; buntBtn.disabled = !!(P && P.bunt) && !canCancel;
    stealBtn.classList.toggle("hidden", !(canSteal || (P && P.steal && live)));
    stealBtn.classList.toggle("on", !!(P && P.steal)); stealBtn.textContent = P && P.steal ? "뛴다!" : "도루"; stealBtn.disabled = !!(P && P.steal);
  }
  for (const b of [buntBtn, stealBtn]) { b.addEventListener("pointerdown", e => e.stopPropagation()); }
  buntBtn.addEventListener("click", e => {
    e.stopPropagation(); buntBtn.blur();
    if (!P || P.swung || P.result || paused) return;
    if (P.bunt) {                                            // 번트 취소: 배트를 거두면 보통 공처럼 스트라이크·볼을 가린다
      if (now >= P.tArr - 40) return;

    }

  });
  stealBtn.addEventListener("click", e => {
    e.stopPropagation(); stealBtn.blur();
    const from = leadSteal();
    if (!P || P.steal || P.result || paused || from < 0 || now >= P.tRel + 60) return;
    P.steal = { from, double: from === 1 && G.bases[0] === 1, t0: now, done: false };
    sfx.crowd(0.12, 1.2); say("도루!", 0.1); banner("스타트!", from === 1 ? "2루 주자 3루로" : "1루 주자 2루로", "#7ee08a", 800);
  });

  // 도루 결과: 공이 포수 미트에 들어가면(치지 않았으면) 포수가 던진다. 30% 성공, 강속구면 8%
  let stealFx = null, throwFx = null, hrFx = null;
  const THROW_MS = 560;
  function stealOutcome() {
    const st = P && P.steal; if (!st || st.done) return;

      if (state !== "play") return;
      b[st.from] = 0;
      if (st.double) { b[0] = 0; b[1] = 1; }           // 더블 스틸: 뒤 주자는 살아서 한 칸
      stealFx = { base: to, ok, at: now };

        b[to] = 1; sfx.crowd(0.3, 1.6); say("세이프!", 0.1); feel("batter", "happy", 1200);

      } else {

      }

  }
  // 공에 배트를 댄 뒤 진행 중이던 도루는 없던 일 (파울이면 주자가 돌아간다)
  function cancelSteal() { if (P && P.steal && !P.steal.done) { P.steal.done = true; P.steal.cancel = true; } }

  // 번트: 공이 홈에 닿는 순간 저절로 댄다
  function resolveBunt() {
    // 배트를 내밀고 있으면 존 밖 공이라도 스트라이크다 (거두려면 '번트 취소')

    P.buntDone = now;

  function buntCall() {

      if (r < 0.05) { advance(1); G.hits++; sfx.crowd(0.2, 1.2); say("안타!", 0.15); feel("batter", "joy", 1800); banner("기습 번트 안타!", "", "#ffffff", 1500); endPA(); }

    // 번트 안타 4% · 희생 번트 70% · 선행 주자 아웃 16% · 번트 뜬공 10%
    if (r < 0.04) { advance(1); G.hits++; sfx.crowd(0.2, 1.2); say("안타!", 0.15); feel("batter", "joy", 1800); banner("번트 안타!", "모두 세이프", "#ffffff", 1500); endPA(); return; }

  }

  // 맞은 공: 3D 포물선으로 날린다 (속도 m/s, 발사각, 좌우각)
  // 맞는 순간: 멈칫(히트스톱) → 화면 흔들림·확대 → 흰 번쩍임 → 충격 고리와 불꽃 → "깡!"
  let jolt = null, stopAt = 0, stopLen = 0;
  const JOLT = { hr: [95, 10, 0.07, 0.5], double: [75, 7, 0.05, 0.36], single: [60, 5, 0.035, 0.26], out: [35, 3, 0.015, 0.1], foul: [35, 3, 0.015, 0.1] };
  function impact(kind) {
    const [stop, amp, zoom, flash] = JOLT[kind], s = ballScreen({ x: 0, y: 0.9, d: PLATE_D }), good = kind !== "out" && kind !== "foul";
    jolt = { at: performance.now(), amp, zoom, flash, x: s.sx, y: s.sy, word: good ? "깡!" : "팅", big: kind === "hr" ? 1.35 : good ? 1 : 0.7, good };
    stopAt = performance.now(); stopLen = stop;
    const n = good ? 22 : 8;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(2, good ? 6.5 : 3.5);
      fx.push({ x: s.sx, y: s.sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, t: 0, life: rand(0.22, 0.45), col: pick(["#fff7d1", "#ffd659", "#ffffff"]) });
    }
  }
  function drawImpact(c) {
    if (!jolt) return;
    const e = performance.now() - jolt.at;
    // 충격 고리 + 빛살
    if (e < 260) {
      const u = e / 260, r = (jolt.good ? 10 : 6) + u * (jolt.good ? 70 : 34) * jolt.big;
      c.save(); c.globalAlpha = (1 - u) * 0.9; c.strokeStyle = "#fff4c2"; c.lineWidth = 5 * (1 - u) + 1;
      c.beginPath(); c.arc(jolt.x, jolt.y, r, 0, 7); c.stroke();
      if (jolt.good) {
        c.lineWidth = 3 * (1 - u) + 0.5; c.beginPath();
        for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + 0.3; c.moveTo(jolt.x + Math.cos(a) * r * 0.5, jolt.y + Math.sin(a) * r * 0.5); c.lineTo(jolt.x + Math.cos(a) * r * 1.25, jolt.y + Math.sin(a) * r * 1.25); }
        c.stroke();
      }
      c.restore();
    }
    // "깡!" 글자: 튀어나왔다가 떠오르며 사라진다
    if (e < 650) {
      const u = e / 650, pop = u < 0.15 ? 0.5 + u / 0.15 * 0.7 : 1.2 - Math.min(0.2, (u - 0.15) * 0.6);
      c.save(); c.globalAlpha = u < 0.7 ? 1 : (1 - u) / 0.3;
      c.translate(jolt.x + 34, jolt.y - 36 - u * 26); c.rotate(-0.18); c.scale(pop * jolt.big, pop * jolt.big);
      c.font = "34px 'Black Han Sans', sans-serif"; c.textAlign = "center";
      c.lineWidth = 7; c.strokeStyle = "rgba(20,12,0,.75)"; c.strokeText(jolt.word, 0, 0);
      c.fillStyle = jolt.good ? "#ffd84a" : "#e8ecf5"; c.fillText(jolt.word, 0, 0);
      c.restore();
    }
  }

  function launch(v, ang, spray) {
    const a = ang * Math.PI / 180, s = spray * Math.PI / 180;
    P.hit = { x: 0, y: 0.9, d: PLATE_D, vx: v * Math.cos(a) * Math.sin(s), vy: v * Math.sin(a), vd: v * Math.cos(a) * Math.cos(s), t0: now, trail: [] };
  }

  function gameOver() {
    state = "over";
    timeBtn.classList.add("hidden");
    sfx.over();
    const nb = G.runs > best;
    if (nb) { best = G.runs; store.set("homerun.best", String(best)); }
    $("#final").textContent = `${G.runs}점`;
    $("#final-sub").textContent = `안타 ${G.hits} · 홈런 ${G.hr} · 레벨 ${G.level} · 타자 ${G.batters}명`;
    $("#best-over").textContent = nb ? "신기록!" : `최고 기록 ${best}점`;
    $("#over").classList.remove("hidden");
    overAt = now;
    say("게임 셋!");
  }
  let overAt = 0;

  // ================= 알림 문구 =================
  function banner(big, small, color, dur, huge) { msg = { big, small, color, t0: now, dur, huge }; }

  // ================= 갱신 =================
  function update() {
    if (state !== "play") return;
    if (timers.length) { const due = timers.filter(t => now >= t.at); timers = timers.filter(t => now < t.at); due.forEach(t => t.fn()); }
    if (queuedAt && now >= queuedAt) { queuedAt = 0; makePitch(); }
    if (!P) return;
    // 레벨: 공 12개마다

  const MOOD = {
    focus:   { eye: 0.85, brow: [0, -0.04],    mouth: "line",  curve: 0,     w: 0.24 },
    effort:  { eye: 0.3,  brow: [-0.04, -0.16], mouth: "teeth", curve: -0.02, w: 0.3, open: 0.1 },

    annoyed: { eye: 0.55, brow: [-0.03, -0.17], mouth: "line",  curve: -0.06, w: 0.24 },

    const to = BASE3D[throwFx.to]; if (!to) return;
    const D0 = PLATE_D + 0.6;
    const at = k => { k = Math.min(1, k); return { x: to.x * k, y: 1.6 + Math.sin(k * Math.PI) * 2.4 - 1.2 * k, d: D0 + (to.d - D0) * k }; };
    c.save(); c.lineCap = "round";
    const fade = u > 1 ? 1 - (u - 1) / 0.5 : 1, a0 = Math.max(0, u - 0.45);
    c.beginPath();
    for (let k = a0; k <= Math.min(1, u) + 1e-6; k += 0.02) { const q = ballScreen(at(k)); k === a0 ? c.moveTo(q.sx, q.sy) : c.lineTo(q.sx, q.sy); }
    c.strokeStyle = `rgba(255,214,80,${0.35 * fade})`; c.lineWidth = 7; c.stroke();
    c.strokeStyle = `rgba(255,250,230,${0.9 * fade})`; c.lineWidth = 2.5; c.stroke();
    if (u < 1) { const s = ballScreen(at(u)); drawBallAt(c, s, Math.max(2.4, 0.06 * s.k)); }
    c.restore();
  }
  function led(c, x, y, on, col) {
    c.fillStyle = on ? col : "#2b2f3d"; c.beginPath(); c.arc(x, y, 6.5, 0, 7); c.fill();
    if (on) { c.fillStyle = "rgba(255,255,255,.35)"; c.beginPath(); c.arc(x - 2, y - 2, 2.2, 0, 7); c.fill(); }
  }
  function drawBoard(c) {
    // 위쪽 전광판: B·S·O, 점수, 주자, 구속
    c.fillStyle = "#05070f"; c.fillRect(0, 0, W, 112);
    c.fillStyle = "#11162a"; c.fillRect(6, 6, W - 12, 100);
    c.font = "bold 15px sans-serif"; c.textAlign = "left"; c.fillStyle = "#c8cbe0";
    const rows = [["B", G.balls, 3, "#5ee07a"], ["S", G.strikes, 2, "#ffcf3a"], ["O", G.outs, 2, "#ff4b3e"]];
    rows.forEach(([l, n, max, col], i) => { const y = 30 + i * 26; c.fillStyle = "#c8cbe0"; c.fillText(l, 18, y + 5); for (let j = 0; j < max; j++) led(c, 44 + j * 18, y, j < n, col); });
    // 점수
    c.textAlign = "center"; c.fillStyle = "#ffcf3a"; c.font = "44px 'Black Han Sans', sans-serif"; c.fillText(String(G.runs), 190, 72);
    c.font = "bold 13px sans-serif"; c.fillStyle = "#c8cbe0"; c.fillText("득점", 190, 94);
    // 주자 다이아몬드
    const cx = 290, cy = 56, sz = 12;
    const base = (x, y, on) => { c.save(); c.translate(x, y); c.rotate(Math.PI / 4); c.fillStyle = on ? "#ffcf3a" : "#2b2f3d"; c.fillRect(-sz / 2, -sz / 2, sz, sz); c.restore(); };
    base(cx + 22, cy, G.bases[0]); base(cx, cy - 22, G.bases[1]); base(cx - 22, cy, G.bases[2]);
    c.fillStyle = "#c8cbe0"; c.beginPath(); c.moveTo(cx, cy + 26); c.lineTo(cx - 6, cy + 20); c.lineTo(cx + 6, cy + 20); c.fill();
    const BP = [[cx + 22, cy], [cx, cy - 22], [cx - 22, cy]];
    // 뛰는 주자: 베이스 사이를 달린다 (판정이 나면 사라짐)
    const st = P && P.steal;
    if (st && !st.cancel && !(stealFx && stealFx.at >= st.t0)) {
      const end = throwFx && throwFx.t0 >= st.t0 ? throwFx.t0 + THROW_MS : P.tArr + 700;
      const k = Math.min(1, Math.max(0, (now - st.t0) / (end - st.t0))), a = BP[st.from], b = BP[st.from + 1];
      const x = a[0] + (b[0] - a[0]) * k, y = a[1] + (b[1] - a[1]) * k;
      c.fillStyle = "#7ee08a"; c.beginPath(); c.arc(x, y, 5, 0, 7); c.fill();
      c.strokeStyle = "rgba(126,224,138,.5)"; c.lineWidth = 2; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(x, y); c.stroke();
    }
    if (stealFx) {
      const e = now - stealFx.at;
      if (e > 1100) stealFx = null;
      else {
        const [x, y] = BP[stealFx.base], u = e / 1100, col = stealFx.ok ? "126,224,138" : "255,75,62";
        c.strokeStyle = `rgba(${col},${1 - u})`; c.lineWidth = 3; c.beginPath(); c.arc(x, y, 8 + u * 16, 0, 7); c.stroke();
        c.font = "bold 11px sans-serif"; c.textAlign = "center"; c.fillStyle = `rgba(${col},${1 - u})`;
        c.fillText(stealFx.ok ? "SAFE" : "OUT", x, y - 14 - u * 6);
      }
    }
    // 구속·구질
    c.textAlign = "right";
    c.font = "bold 13px sans-serif"; c.fillStyle = "#c8cbe0"; c.fillText(`LV ${G.level}`, W - 18, 26);
    if (P && now >= P.tRel) {
      c.font = "30px 'Black Han Sans', sans-serif"; c.fillStyle = "#ff8a3d"; c.fillText(`${P.kmh}`, W - 46, 66);
      c.font = "bold 12px sans-serif"; c.fillStyle = "#ff8a3d"; c.fillText("km/h", W - 16, 66);
      c.font = "bold 15px sans-serif"; c.fillStyle = "#ffffff"; c.fillText(PITCHES[P.type].name, W - 18, 92);
    } else if (P) {
      c.font = "bold 13px sans-serif"; c.fillStyle = "#8a90a8"; c.fillText(MOTION_NAME[P.motion], W - 18, 92);
    }
  }

  function drawMsg(c) {
    if (P && P.swung && P.delta != null && now - P.swingT < 1300) {
      const d = Math.round(P.delta), ad = Math.abs(d);
      const ballMiss = P.result === "whiff" && ad <= WIN.foul;     // 타이밍은 맞았는데 존에서 너무 빠진 공
      const t = ballMiss ? "존 밖 공" : ad <= WIN.hr ? "완벽!" : d < 0 ? "빠름" : "늦음";
      c.font = "bold 18px sans-serif"; c.textAlign = "center"; c.fillStyle = ad <= WIN.hr ? "#ffcf3a" : "#ffffff";
      c.fillText(t, W / 2, 560);
    }
    if (!msg) return;
    const u = (now - msg.t0) / msg.dur;
    if (u > 1) { msg = null; return; }
    const pop = u < 0.12 ? 0.6 + (u / 0.12) * 0.5 : u < 0.2 ? 1.1 - (u - 0.12) / 0.08 * 0.1 : 1;
    const alpha = u > 0.8 ? (1 - u) / 0.2 : 1;
    c.save(); c.globalAlpha = alpha; c.translate(W / 2, 300); c.scale(pop, pop);
    c.textAlign = "center";
    c.font = `${msg.huge ? 74 : 52}px 'Black Han Sans', sans-serif`;
    c.lineWidth = 8; c.strokeStyle = "rgba(0,0,0,.65)"; c.strokeText(msg.big, 0, 0);
    c.fillStyle = msg.color; c.fillText(msg.big, 0, 0);
    if (msg.small) { c.font = "bold 20px sans-serif"; c.lineWidth = 5; c.strokeText(msg.small, 0, 34); c.fillStyle = "#fff"; c.fillText(msg.small, 0, 34); }
    c.restore();
  }

  function draw() {
    if (!bgCache) {
      bgCache = document.createElement("canvas");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      bgCache.width = Math.floor(W * S * dpr); bgCache.height = Math.floor(H * S * dpr);
      const b = bgCache.getContext("2d"); b.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);
      drawBackground(b);
    }
    // 맞는 순간의 흔들림·확대 (전광판·글자는 흔들지 않는다)
    let shaking = false;
    if (jolt) {
      const e = performance.now() - jolt.at, d = Math.max(0, 1 - e / 320);
      if (e > 700) jolt = null;
      else if (d > 0) {
        const a = jolt.amp * d * d, z = 1 + jolt.zoom * d + (a * 2.4) / Math.min(W, H);
        shaking = true; ctx.save();
        ctx.translate(jolt.x + (Math.random() * 2 - 1) * a, jolt.y + (Math.random() * 2 - 1) * a * 0.7); ctx.scale(z, z); ctx.translate(-jolt.x, -jolt.y);
      }
    }
    if (shaking) ctx.drawImage(bgCache, 0, 0, W, H);
    else { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bgCache, 0, 0); ctx.restore(); }
    // 관중석 플래시 (홈런 때)
    if (P && P.called === "hr") for (let i = 0; i < 18; i++) { ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fillRect(Math.random() * W, 152 + Math.random() * 90, 2, 2); }
    const hand = drawPitcher(ctx).hand;
    drawZone(ctx);
    drawPitchTrack(ctx);
    drawPitchBall(ctx, hand);
    drawThrow(ctx);
    drawHitBall(ctx);
    drawBatter(ctx);
    for (const f of fx) { ctx.globalAlpha = 1 - f.t / f.life; ctx.fillStyle = f.col; ctx.fillRect(f.x, f.y, 3, 3); }
    ctx.globalAlpha = 1;
    drawImpact(ctx);
    drawHrFx(ctx);
    if (shaking) ctx.restore();
    drawSlow(ctx);
    if (jolt) { const e = performance.now() - jolt.at; if (e < 140) { ctx.fillStyle = `rgba(255,252,235,${jolt.flash * (1 - e / 140)})`; ctx.fillRect(0, 0, W, H); } }
    if (state !== "title" && G) drawBoard(ctx);
    drawMsg(ctx);
  }

  // ================= 슬로 모션 (2아웃 2스트라이크) =================
  // 투수가 내딛는 순간부터 판정이 날 때까지 시간이 0.45배로 늘어진다. 화면 위아래에 검은 띠, 가장자리가 어두워지고 심장 소리
  const SLOW = 0.45;
  let beatAt = 0;
  function slowWanted() {
    if (state !== "play" || !P || !P.clutch || paused) return false;
    if (now < P.tStride - 150) return false;
    if (P.resAt != null && now > P.resAt + (P.hit ? 650 : 300)) return false;
    return true;
  }
  function slowMo(t) {
    const want = slowWanted() ? SLOW : 1;
    if (tsS !== want) {
      let sc = tsS + (want - tsS) * (want < tsS ? 0.22 : 0.07);
      if (Math.abs(sc - want) < 0.01) sc = want;
      setTimeScale(sc); now = gameNow();
    }
    if (slowK() > 0.6 && t - beatAt > 820) { beatAt = t; tone(62, 0.16, "sine", 0.3, 0, 48); tone(56, 0.18, "sine", 0.22, 0.19, 44); }
  }
  const slowK = () => Math.max(0, Math.min(1, (1 - tsS) / (1 - SLOW)));
  function drawSlow(c) {
    const k = slowK(); if (k < 0.01) return;
    // 가장자리 어둡게
    const g = c.createRadialGradient(W / 2, H * 0.55, H * 0.22, W / 2, H * 0.55, H * 0.75);
    g.addColorStop(0, "rgba(0,0,12,0)"); g.addColorStop(1, `rgba(0,0,12,${0.6 * k})`);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // 영화처럼 위아래 검은 띠
    c.fillStyle = "#000"; c.fillRect(0, 112, W, 34 * k); c.fillRect(0, H - 40 * k, W, 40 * k);
    // 중계 화면의 슬로 표시
    c.save(); c.globalAlpha = k; c.font = "bold 13px sans-serif"; c.textAlign = "left";
    c.fillStyle = "#ff4b3e"; c.beginPath(); c.arc(20, 112 + 17 * k, 4.5, 0, 7); c.fill();
    c.fillStyle = "#fff"; c.fillText("SLOW", 30, 112 + 17 * k + 4.5);
    c.restore();
  }

  // ================= 루프 =================
  let acc = 0, last = performance.now();
  function frame(t) {
    now = gameNow();
    updateActs();
    if (paused) { last = t; draw(); requestAnimationFrame(frame); return; }
    if (stopAt) {
      if (performance.now() - stopAt < stopLen) { now = toGame(stopAt - pauseAcc); last = t; draw(); requestAnimationFrame(frame); return; }
      pauseAcc += stopLen; stopAt = 0; now = gameNow();
    }
    slowMo(t);
    acc += Math.min(0.1, (t - last) / 1000) * tsS; last = t;
    while (acc >= 1 / 60) { update(); acc -= 1 / 60; }
    draw();
    requestAnimationFrame(frame);
  }

  $("#best-title").textContent = best ? `최고 기록 ${best}점` : "";
  // 타이틀 화면용 기본 상태
  G = { runs: 0, outs: 0, balls: 0, strikes: 0, bases: [0, 0, 0], level: 1, pool: ["fast", "power"], motions: ["windup"] };
  fx = [];
  fit();
  requestAnimationFrame(frame);

  // 테스트용 읽기 훅
  window.__hr = { get state() { return state; }, get G() { return G; }, get P() { return P; }, now: () => gameNow(), get paused() { return paused; }, get clips() { return Object.keys(clips).length; }, get clipPlays() { return clipPlays; }, feel: (w, m, ms) => feel(w, m, ms), setBases: b => { G.bases = b.slice(); }, setOuts: n => { G.outs = n; }, get queuedAt() { return queuedAt; }, get msg() { return msg; }, get timeScale() { return tsS; }, pickPitch: L => pickPitch(L) };
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>양맞고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
  /* 한 화면에 다 들어가는 판: 머리줄 / 컴퓨터 / 담요(바닥) / 나 / 내 손패.
     카드 크기는 JS가 실제 화면 높이를 재서 정한다. 메신저 안 브라우저에서도 스크롤 없이. */
  :root {
    color-scheme: light;
    --page: #ecebe6;
    --panel: #ffffff;
    --ink: #1d1d1f;
    --sub: #5f5f66;
    --blanket: #5d6744;
    --blanket-dark: #4a5236;
    --red: #c8102e;
    --blue: #1f5bd6;
    --gold: #ffcc33;
    --display: "Black Han Sans", "Noto Sans KR", sans-serif;
    --body: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --app-h: 100vh;
    --hand-w: 64px; --floor-w: 50px; --cap-w: 24px; --gap: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--page); color: var(--ink);
    font-family: var(--body); font-size: 17px; line-height: 1.4;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; }
  .app {
    height: var(--app-h); max-width: 1120px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px calc(env(safe-area-inset-bottom, 0px) + 8px);
    display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto; gap: 8px;
  }

  header { display: flex; align-items: center; gap: 8px; }
  header h1 { margin: 0 auto 0 0; font-family: var(--display); font-weight: 400; color: var(--red); font-size: 30px; line-height: 1; }
  .pill {
    min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--panel);
    box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 700; font-size: 16px; cursor: pointer; white-space: nowrap;
  }
  .pill:active { transform: scale(.96); }
  .pill:focus-visible, .card:focus-visible, .big:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  /* 양쪽 선수 줄: 이름·점수 | 먹은 패 네 칸 */
  .bar { background: var(--panel); border-radius: 18px; padding: 6px 8px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: stretch; }
  .who { display: flex; flex-direction: column; justify-content: center; min-width: 64px; position: relative; }
  .who .name { font-weight: 900; font-size: 15px; white-space: nowrap; }
  .who .pts { font-family: var(--display); font-size: 30px; line-height: 1; }
  .who .pts small { font-family: var(--body); font-size: 15px; font-weight: 700; }
  .who .badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 900; padding: 1px 7px; border-radius: 999px; }
  .badge.go { background: var(--red); color: #fff; }
  .badge.shake { background: var(--gold); }
  .caps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; min-width: 0; }
  .grp { background: #f4f4f5; border-radius: 10px; padding: 3px 5px 4px; min-width: 0; overflow: hidden; }
  .grp h3 { margin: 0; font-size: 12px; font-weight: 900; color: var(--sub); display: flex; justify-content: space-between; line-height: 1.2; }
  .grp h3 b { color: var(--ink); font-size: 15px; }
  .stack { display: flex; flex-wrap: wrap; height: calc(var(--cap-w) * 1.5); overflow: hidden; }
  .stack .card { width: var(--cap-w); margin-right: calc(var(--cap-w) * -0.55); }
  .pile { position: relative; width: var(--cap-w); aspect-ratio: 2 / 3; }
  .pile .card { position: absolute; inset: 0; width: 100%; }
  .cpu-pile { position: absolute; right: 0; bottom: 2px; }
  .who.cpu { padding-right: calc(var(--cap-w) + 8px); }

  /* 담요 */
  .table {
    position: relative; border-radius: 22px; padding: 10px; min-height: 0; overflow: hidden;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 6px),
      radial-gradient(120% 90% at 50% 40%, var(--blanket), var(--blanket-dark));
    box-shadow: inset 0 0 0 5px rgba(0,0,0,.06);
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center;
  }
  .deck { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #f3f1e6; font-weight: 900; font-size: 14px; }
  .deck .pile { width: var(--floor-w); }
  .deck .pile .card:nth-last-child(2) { transform: translate(2px, 2px); }
  .deck .pile .card:nth-last-child(3) { transform: translate(4px, 4px); }
  .floor { display: flex; flex-wrap: wrap; gap: 10px 14px; align-content: center; justify-content: center; min-width: 0; max-height: 100%; padding-bottom: 26px; }
  .fgrp { position: relative; display: flex; }
  .fgrp .card { width: var(--floor-w); }
  .fgrp .card + .card { margin-left: calc(var(--floor-w) * -0.6); }
  .fgrp .tag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--red); color: #fff; font-weight: 900; font-size: 12px; padding: 0 8px; border-radius: 999px; z-index: 3; }
  .status {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    background: rgba(0,0,0,.45); color: #fff; font-weight: 700; font-size: 15px;
    padding: 3px 14px; border-radius: 999px; white-space: nowrap; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; z-index: 4;
  }

  /* 내 손패 */
  .hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px var(--gap); margin: 0 auto; padding-top: 10px; }   /* 줄 간격: 솟은 패가 윗줄 글씨를 가리지 않게 */
  .hand .card { width: var(--hand-w); cursor: pointer; }
  .hand .card.match { transform: translateY(-9px); }
  .hand .card.match .front { box-shadow: 0 0 0 3px var(--gold), 0 8px 16px rgba(0,0,0,.2); }
  .hand.wait .card { cursor: default; }
  .no-aid .aid { display: none; }
  .card.air .face { box-shadow: 0 16px 22px rgba(0,0,0,.35); }

  /* 카드: 앞면·뒷면 두 겹, 뒤집힐 때 실제로 돈다 */
  .card { position: relative; display: block; aspect-ratio: 2 / 3; perspective: 600px; transition: transform .16s ease; }
  .card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .42s cubic-bezier(.3,.7,.2,1); }
  .card.down .inner { transform: rotateY(180deg); }
  .card .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 8%/5.5%; box-shadow: 0 1px 2px rgba(0,0,0,.35); overflow: hidden; }
  .card .back { transform: rotateY(180deg); }
  .card .face > svg { display: block; width: 100%; height: 100%; }   /* 바깥 svg만. 안쪽 그림 svg는 제 크기 그대로 */
  .hand .card:active { transform: scale(.95); }

  .dust { position: fixed; width: 6px; height: 6px; border-radius: 50%; background: rgba(240,236,220,.85); pointer-events: none; z-index: 60; }

  .toast {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
    background: var(--panel); color: var(--red); font-family: var(--display); font-size: clamp(40px, 11vw, 72px);
    padding: 12px 30px; border-radius: 26px; box-shadow: 0 20px 50px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; z-index: 70; text-align: center; line-height: 1.1; white-space: nowrap;
  }
  .toast small { display: block; font-family: var(--body); font-size: 17px; font-weight: 700; color: var(--ink); margin-top: 4px; }

  .modal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; background: rgba(20,20,22,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 16px; }
  .sheet { background: var(--panel); border-radius: 26px; padding: 22px; width: min(520px, 100%); box-shadow: 0 30px 70px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 12px; max-height: calc(var(--app-h) - 32px); overflow: auto; }
  .sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.1; }
  .sheet p { margin: 0; font-size: 18px; }
  .sheet .row { display: flex; gap: 10px; }
  .big { flex: 1; min-height: 60px; border-radius: 16px; border: 0; cursor: pointer; font-size: 22px; font-weight: 900; background: #f1f1f3; }
  .big:active { transform: scale(.97); }
  .big.red { background: var(--red); color: #fff; }
  .big.dark { background: var(--ink); color: #fff; }
  .picks { display: flex; gap: 16px; justify-content: center; }
  .picks .card { width: min(120px, 36vw); cursor: pointer; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 18px; font-variant-numeric: tabular-nums; }
  .tbl td { padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,.08); }
  .tbl td:last-child { text-align: right; font-weight: 900; }
  .tbl tr.sum td { border-bottom: 0; font-size: 22px; padding-top: 8px; }
  .rules { margin: 0; padding-left: 1.1em; font-size: 17px; display: grid; gap: 5px; }
  .rules b { color: var(--red); }
  .sheet .small { font-size: 15px; color: var(--sub); }
  .sheet a { color: var(--sub); }

  @media (min-width: 900px) and (min-height: 700px) {
    header h1 { font-size: 40px; }
    .pill { min-height: 46px; font-size: 17px; }
    .who { min-width: 110px; }
    .who .name { font-size: 17px; }
    .who .pts { font-size: 40px; }
    .grp h3 { font-size: 14px; }
    .grp h3 b { font-size: 18px; }
    .status { font-size: 17px; }
  }
  header { grid-area: head; } .bar.cpu { grid-area: cpu; } .table { grid-area: table; } .bar.me { grid-area: me; } .hand { grid-area: hand; }
  .app { grid-template-areas: "head" "cpu" "table" "me" "hand"; }
  @media (orientation: landscape) and (max-height: 560px) {
    .app { grid-template-columns: minmax(0, 1fr) minmax(200px, 30%); grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) auto;
           grid-template-areas: "head head" "table cpu" "table me" "hand hand"; gap: 6px; padding-top: calc(env(safe-area-inset-top, 0px) + 4px); }
    header h1 { font-size: 24px; } .pill { min-height: 34px; font-size: 14px; padding: 0 12px; }
    .bar { grid-template-columns: 1fr; align-content: start; padding: 6px; }
    .who { flex-direction: row; align-items: baseline; gap: 8px; }
    .who .pts { font-size: 24px; }
    .caps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
    .hand { padding-top: 4px; }
  }
  @media (orientation: portrait) {
    .who { flex-direction: row; flex-wrap: wrap; align-items: baseline; align-content: center; column-gap: 6px; min-width: 0; max-width: 40vw; }
    .who .name { white-space: normal; }
    .who .pts { font-size: 26px; }
  }
  @media (orientation: landscape) and (max-height: 560px) {
    .caps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grp h3 { flex-direction: column; } .grp h3 b { font-size: 14px; }
    .who.cpu { padding-right: calc(var(--cap-w) + 8px); }
  }
  @media (prefers-reduced-motion: reduce) { .card .inner, .card { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>양맞고</h1>
    <button class="pill" id="btn-rules" type="button">규칙</button>
    <button class="pill" id="btn-sound" type="button">소리</button>
    <button class="pill" id="btn-new" type="button">새 판</button>
  </header>

  <section class="bar cpu" aria-label="컴퓨터">
    <div class="who cpu">
      <div class="name">컴퓨터 <span id="cpu-left"></span></div>
      <div class="pts"><span id="cpu-pts">0</span><small>점</small></div>
      <div class="badges" id="cpu-badges"></div>
      <div class="pile cpu-pile" id="cpu-hand" aria-hidden="true"></div>
    </div>
    <div class="caps" id="cpu-caps"></div>
  </section>

  <section class="table" aria-label="바닥">
    <div class="deck"><div class="pile" id="deck"></div><div id="deck-n">20장</div></div>
    <div class="floor" id="floor"></div>
    <div class="status" id="status" role="status">준비</div>
  </section>

  <section class="bar me" aria-label="나">
    <div class="who">
      <div class="name">나</div>
      <div class="pts"><span id="me-pts">0</span><small>점</small></div>
      <div class="badges" id="me-badges"></div>
    </div>
    <div class="caps" id="me-caps"></div>
  </section>

  <section class="hand" id="hand" aria-label="내 손패"></section>
</div>

<div class="toast" id="toast" aria-live="assertive"></div>
<div id="modal-root"></div>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ================= 화투 48장 =================
  const CARDS = [];
  const add = (m, kind, x = {}) => CARDS.push({ id: CARDS.length, m, kind, pi: kind === "pi" ? 1 : 0, ...x });
  add(1, "gwang");                    add(1, "tti", { rib: "hong" });   add(1, "pi");  add(1, "pi", { alt: 1 });
  add(2, "yeol", { godori: 1 });      add(2, "tti", { rib: "hong" });   add(2, "pi");  add(2, "pi", { alt: 1 });
  add(3, "gwang");                    add(3, "tti", { rib: "hong" });   add(3, "pi");  add(3, "pi", { alt: 1 });
  add(4, "yeol", { godori: 1 });      add(4, "tti", { rib: "cho" });    add(4, "pi");  add(4, "pi", { alt: 1 });
  add(5, "yeol");                     add(5, "tti", { rib: "cho" });    add(5, "pi");  add(5, "pi", { alt: 1 });
  add(6, "yeol");                     add(6, "tti", { rib: "cheong" }); add(6, "pi");  add(6, "pi", { alt: 1 });
  add(7, "yeol");                     add(7, "tti", { rib: "cho" });    add(7, "pi");  add(7, "pi", { alt: 1 });
  add(8, "gwang");                    add(8, "yeol", { godori: 1 });    add(8, "pi");  add(8, "pi", { alt: 1 });
  add(9, "yeol", { gukjin: 1 });      add(9, "tti", { rib: "cheong" }); add(9, "pi");  add(9, "pi", { alt: 1 });
  add(10, "yeol");                    add(10, "tti", { rib: "cheong" });add(10, "pi"); add(10, "pi", { alt: 1 });
  add(11, "gwang");                   add(11, "pi", { pi: 2, ssang: 1 });add(11, "pi"); add(11, "pi", { alt: 1 });
  add(12, "gwang", { bi: 1 });        add(12, "yeol");                  add(12, "tti", { rib: "bi" }); add(12, "pi", { pi: 2, ssang: 1 });

  const RIB = { hong: "홍단", cheong: "청단", cho: "초단", bi: "띠" };
  function label(c) {
    if (c.kind === "gwang") return c.bi ? "비광" : "광";
    if (c.kind === "yeol") return c.godori ? "고도리" : c.gukjin ? "국진" : "열끗";
    if (c.kind === "tti") return RIB[c.rib];
    return c.ssang ? "쌍피" : "피";
  }
  const nameOf = c => `${c.m}월 ${label(c)}`;

  // ================= 화투 그림 =================
  // 원조 화투의 화풍: 흰 바탕, 굵은 붉은 테두리, 빨강·검정·노랑·파랑 네 가지 원색.
  // 그림 좌표계는 테두리 안쪽 90 × 140. 월 숫자와 아래 글자는 .aid 묶음이라 규칙 창에서 끌 수 있다.
  const RD = "#e2141d", BK = "#121212", YL = "#f6d000", BL = "#1d3fd6", WH = "#ffffff", PK = "#f7b3bd";
  const R = (x, y, w, h, f, ex = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${ex}/>`;
  const C = (x, y, r, f, ex = "") => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${ex}/>`;
  const E = (x, y, rx, ry, f, rot = 0, ex = "") => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" transform="rotate(${rot} ${x} ${y})" ${ex}/>`;
  const Pt = (d, f, s = "none", w = 0, ex = "") => `<path d="${d}" fill="${f}" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
  const T = (x, y, t, size, f, ex = "") => `<text x="${x}" y="${y}" font-size="${size}" fill="${f}" font-weight="900" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" ${ex}>${t}</text>`;
  const ink = (w = 1.2) => `stroke="${BK}" stroke-width="${w}"`;
  // 카드마다 같은 그림이 나오도록 고정된 난수
  function rng(seed) { let a = seed * 9301 + 49297; return () => { a = (a * 1103515245 + 12345) % 2147483648; return a / 2147483648; }; }

  // ---- 공통 모양 ----
  // 솔잎 덤불: 검은 뾰족 잎이 부채꼴로
  function pineTuft(x, y, w, h, rnd) {
    let d = `M${x} ${y}`;
    const n = 7;
    for (let i = 0; i < n; i++) {
      const x0 = x + (w / n) * i, x1 = x0 + w / n;
      const tip = y - h * (0.6 + rnd() * 0.4);
      d += ` L${(x0 + x1) / 2 + (rnd() - 0.5) * 4} ${tip} L${x1} ${y - h * 0.15 * rnd()}`;
    }
    return Pt(d + ` L${x + w} ${y + 6} L${x} ${y + 6}Z`, BK) + Pt(`M${x + w * 0.3} ${y - h * 0.3} L${x + w * 0.5} ${y - h * 0.8} M${x + w * 0.65} ${y - h * 0.3} L${x + w * 0.75} ${y - h * 0.7}`, "none", WH, 0.8);
  }
  const flower5 = (x, y, r, petal, center = YL, edge = BK) =>
    [0, 1, 2, 3, 4].map(i => C(x + Math.cos(i * 1.2566 - 1.57) * r * 0.58, y + Math.sin(i * 1.2566 - 1.57) * r * 0.58, r * 0.52, petal, ink(0.8))).join("") + C(x, y, r * 0.3, center, `stroke="${edge}" stroke-width=".6"`);
  const branch = (d, w = 4) => Pt(d, "none", BK, w);
  const scallop = (y, col = RD) => {     // 화투 위쪽의 붉은 구름(가스미)
    let d = `M0 0 H90 V${y}`;
    for (let x = 90; x > 0; x -= 15) d += ` Q${x - 7.5} ${y + 9} ${x - 15} ${y}`;
    return Pt(d + "Z", col, BK, 1);
  };
  const hill = (top, col = BK) => Pt(`M0 140 L0 ${top + 34} Q45 ${top - 10} 90 ${top + 34} L90 140Z`, col);
  const leafStrand = (x, y0, len, col, rnd, swirl) => {
    let s = Pt(`M${x} ${y0} Q${x + 6} ${y0 + len / 2} ${x - 3} ${y0 + len}`, "none", col, 1.6);
    for (let y = y0 + 6; y < y0 + len; y += 8) {
      const side = (y / 8) % 2 ? 1 : -1;
      s += E(x + side * 4.5, y, 4.4, 1.9, col, side * 35);
    }
    if (swirl) s += Pt(`M${x + 6} ${y0 + len - 4} a4 4 0 1 1 4 4`, "none", BK, 1);
    return s;
  };
  const iris = (x, y, s = 1) => Pt(`M${x} ${y} q${-9 * s} ${-3 * s} ${-8 * s} ${-12 * s} q${5 * s} ${2 * s} ${8 * s} ${8 * s}Z`, BL, BK, .8) +
    Pt(`M${x} ${y} q${9 * s} ${-3 * s} ${8 * s} ${-12 * s} q${-5 * s} ${2 * s} ${-8 * s} ${8 * s}Z`, BL, BK, .8) +
    Pt(`M${x} ${y} q${-3 * s} ${-10 * s} 0 ${-16 * s} q${3 * s} ${6 * s} 0 ${16 * s}Z`, BL, BK, .8) + E(x, y + 3 * s, 3 * s, 4 * s, BL, 0, ink(.6)) + C(x, y - 3 * s, 1.4 * s, YL);
  const sword = (x, y, h, lean) => Pt(`M${x} ${y} Q${x + lean * 0.5} ${y - h * 0.6} ${x + lean} ${y - h} Q${x + lean * 0.3 + 3} ${y - h * 0.5} ${x + 5} ${y}Z`, BK);
  const peony = (x, y, r, col) => C(x, y, r, col, ink()) +
    Pt(`M${x - r * 0.75} ${y - r * 0.1} Q${x} ${y - r * 0.95} ${x + r * 0.75} ${y - r * 0.1}`, "none", BK, 1) +
    Pt(`M${x - r * 0.5} ${y + r * 0.35} Q${x} ${y - r * 0.35} ${x + r * 0.5} ${y + r * 0.35}`, "none", BK, 1) + C(x, y + r * 0.15, r * 0.22, YL, ink(.6));
  const clover = (x, y, len, rnd) => {
    let s = Pt(`M${x} ${y} q${(rnd() - 0.5) * 10} ${-len / 2} ${(rnd() - 0.5) * 6} ${-len}`, "none", RD, 1.4);
    for (let i = 1; i < 6; i++) { const yy = y - (len / 6) * i, xx = x + (rnd() - 0.5) * 3; s += E(xx - 3.5, yy, 3.2, 1.6, RD, -30) + E(xx + 3.5, yy - 1, 3.2, 1.6, RD, 30); }
    return s;
  };
  const maple = (x, y, r, f) => {
    let d = "";
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r;
      d += (i ? "L" : "M") + (x + Math.cos(a) * rr).toFixed(1) + " " + (y + Math.sin(a) * rr).toFixed(1);
    }
    return Pt(d + "Z", f, BK, 0.9);
  };
  const mum = (x, y, r, outer, inner) => {
    let s = "";
    for (let i = 0; i < 16; i++) s += E(x + Math.cos(i * 0.3927) * r * 0.62, y + Math.sin(i * 0.3927) * r * 0.62, r * 0.4, r * 0.15, outer, i * 22.5, ink(.5));
    for (let i = 0; i < 10; i++) s += E(x + Math.cos(i * 0.628) * r * 0.3, y + Math.sin(i * 0.628) * r * 0.3, r * 0.22, r * 0.1, inner, i * 36);
    return s + C(x, y, r * 0.14, BK);
  };
  const ribbon = rib => {
    const col = rib === "cheong" ? BL : rib === "hong" ? RD : YL;
    let s = `<g transform="rotate(-22 30 50)">` + R(20, 4, 20, 82, col, ink(1.2)) + Pt("M20 86 L26 93 L30 86 L34 93 L40 86", col, BK, 1.2);
    if (rib === "hong") s += T(30, 40, "홍", 15, BK) + T(30, 60, "단", 15, BK);
    if (rib === "cheong") s += T(30, 40, "청", 15, YL) + T(30, 60, "단", 15, YL);
    return s + "</g>";
  };
  const gwangMark = (x, y) => C(x, y, 8.5, RD, `stroke="${WH}" stroke-width="1.6"`) + T(x, y + 4.3, "광", 11, WH);

  function art(c) {
    const g = c.kind === "gwang", y = c.kind === "yeol", t = c.kind === "tti";
    const rnd = rng(c.id + 7);
    let s = "";
    switch (c.m) {
      case 1: { // 송학
        if (g) {
          s += Pt("M90 0 V44 A44 44 0 0 1 46 0Z", RD, BK, 1);                   // 붉은 해
          s += Pt("M30 112 C18 104 16 84 30 74 C40 68 52 74 50 86 C48 96 40 100 30 112Z", WH, BK, 1.4);   // 학 몸
          s += Pt("M22 80 C10 84 6 98 14 108 M26 84 C16 92 16 102 20 110 M30 86 C24 96 26 104 28 112", "none", BK, 1.4);
          s += Pt("M44 76 C48 60 40 44 30 34", "none", BK, 3.2) + Pt("M44 76 C48 60 40 44 30 34", "none", WH, 1.2);
          s += C(29, 32, 4, WH, ink(1)) + C(29, 29.5, 2.4, RD) + Pt("M26 33 L14 38", "none", BK, 1.6) + C(30.5, 31.5, .8, BK);
          s += Pt("M34 112 L32 132 M40 110 L42 132", "none", BK, 1.4);
          s += pineTuft(46, 140, 44, 62, rnd) + pineTuft(56, 104, 34, 36, rnd);
          s += gwangMark(74, 126);
        } else {
          s += branch("M4 140 Q26 100 64 70", 4);
          s += pineTuft(0, 140, 46, 86, rnd) + pineTuft(40, 140, 50, 96, rnd) + pineTuft(14, 92, 44, 48, rnd) + pineTuft(48, 70, 40, 40, rnd);
        }
        break;
      }
      case 2: { // 매조
        s += scallop(22);
        s += branch("M6 140 L22 112 L18 88 L40 70 L36 50 L60 34 L84 26", 5) + branch("M40 70 L64 76 L84 64", 3.5);
        for (const [x, yy] of [[22, 112], [18, 88], [40, 70], [36, 50], [60, 34], [64, 76], [84, 64], [30, 128], [76, 30], [52, 92]]) s += flower5(x, yy, 9, RD);
        if (y) s += `<g transform="translate(46 100)">` + E(0, 0, 16, 9, YL, -15, ink(1.2)) + C(13, -8, 6.5, YL, ink(1.2)) + Pt("M18 -9 L26 -7 L18 -4Z", BK) +
                    Pt("M-6 -4 Q-10 -18 10 -10Z", BK) + Pt("M-14 2 L-26 0 L-22 8Z", BK) + C(14, -9, 1.6, BK) + Pt("M8 -14 Q12 -16 18 -12", "none", BK, 1.5) + `</g>`;
        break;
      }
      case 3: { // 벚꽃
        const cols = [RD, BK, WH, RD, PK];
        for (let i = 0; i < 26; i++) {
          const x = 8 + rnd() * 74, yy = 8 + rnd() * (g ? 58 : 100), col = cols[i % cols.length];
          s += flower5(x, yy, 7 + rnd() * 3, col, col === BK ? RD : YL);
        }
        if (g) {
          s += R(0, 82, 90, 58, BK) + Pt("M0 82 Q45 72 90 82 V92 Q45 82 0 92Z", RD, BK, 1);
          for (let i = 0; i < 8; i++) s += Pt(`M${4 + i * 11} 98 l5 6 l5 -6`, "none", YL, 2);
          s += R(0, 110, 90, 6, RD) + gwangMark(14, 126);
        }
        break;
      }
      case 4: { // 흑싸리
        if (y) {
          s += `<g transform="translate(48 30) rotate(-15)">` + E(0, 0, 20, 7, RD, 0, ink(1)) + Pt("M-4 -2 Q4 -24 24 -18 Q8 -8 4 0Z", YL, BK, 1) + Pt("M-4 2 Q2 18 20 18 Q8 8 2 2Z", RD, BK, 1) +
                    C(19, -2, 5.5, RD, ink(1)) + Pt("M24 -2 L32 0", "none", BK, 2) + Pt("M-18 0 L-30 -6 L-28 5Z", BK) + C(20, -3, 1, BK) + `</g>`;
        }
        const top = y ? 56 : 30;
        for (const x of [10, 26, 42, 58, 74, 86]) s += leafStrand(x, top, 140 - top - 4, BK, rnd, rnd() < 0.5);
        break;
      }
      case 5: { // 난초(창포)
        for (const [x, h, l] of [[4, 70, 8], [18, 84, -6], [30, 64, 10], [48, 78, -8], [62, 70, 6], [76, 86, -4]]) s += sword(x, 140, h, l);
        for (const [x, yy, k] of [[20, 58, 1.2], [46, 44, 1.3], [70, 60, 1.2]]) s += iris(x, yy, k);
        if (y) {
          s += Pt("M0 112 L36 92 L52 104 L90 84 L90 98 L52 118 L36 106 L0 126Z", YL, BK, 1.4);
          s += Pt("M10 106 L10 120 M26 98 L26 112 M64 98 L64 112 M80 90 L80 104", "none", BK, 1.2);
        }
        break;
      }
      case 6: { // 모란
        s += Pt("M6 70 Q20 54 30 62 Q22 76 6 70Z", BK) + Pt("M84 80 Q70 64 60 72 Q68 86 84 80Z", BK) + Pt("M30 120 Q40 104 52 112 Q44 126 30 120Z", BK);
        s += peony(28, 92, 18, RD) + peony(62, 104, 16, t ? RD : WH) + peony(64, 62, 13, RD);
        if (y) for (const [x, yy] of [[22, 26], [64, 20]]) s += E(x - 7, yy, 7, 10, YL, -25, ink(1)) + E(x + 7, yy, 7, 10, YL, 25, ink(1)) +
                    E(x - 5, yy + 11, 4, 6, YL, 20, ink(1)) + E(x + 5, yy + 11, 4, 6, YL, -20, ink(1)) + E(x, yy + 4, 1.8, 10, BK) + C(x - 7, yy - 2, 2, BK) + C(x + 7, yy - 2, 2, BK);
        break;
      }
      case 7: { // 홍싸리
        for (const x of [8, 20, 32, 44, 56, 68, 80]) s += clover(x, 140, y ? 50 + rnd() * 20 : 60 + rnd() * 30, rnd);
        if (y) s += `<g transform="translate(46 54)">` + E(0, 0, 26, 13, YL, -8, ink(1.3)) + E(24, -4, 11, 9, YL, 10, ink(1.3)) +
                    Pt("M-18 -8 L-14 6 M-8 -11 L-4 8 M2 -12 L5 9 M12 -11 L14 7", "none", BK, 2) + C(28, -7, 1.6, BK) + Pt("M34 -2 L40 2", "none", WH, 2.5) +
                    Pt("M-16 10 L-24 24 M-6 12 L-8 26 M10 11 L16 24 M18 9 L26 20", "none", BK, 3) + Pt("M-26 -2 Q-34 -8 -32 4", "none", BK, 2) + `</g>`;
        break;
      }
      case 8: { // 공산
        if (g) s += R(0, 0, 90, 140, RD) + C(45, 44, 25, WH, ink(1.4));
        s += hill(70);
        if (y) for (const [x, yy] of [[22, 30], [46, 18], [68, 34]]) s += `<g transform="translate(${x} ${yy})">` + E(0, 0, 9, 4, RD, -10, ink(1)) + Pt("M-4 -2 L-10 -12 L4 -4Z", RD, BK, 1) + Pt("M-2 2 L-10 10 L4 3Z", YL, BK, 1) + C(8, -2, 3, RD, ink(.8)) + Pt("M11 -2 L15 -1", "none", YL, 1.5) + `</g>`;
        if (g) s += gwangMark(74, 128);
        break;
      }
      case 9: { // 국화
        if (!y) s += Pt("M0 140 V110 Q20 96 45 108 Q70 96 90 110 V140Z", BK);
        s += mum(30, 48, 22, YL, RD) + mum(64, 76, 20, RD, YL);
        s += Pt("M30 70 L34 108 M64 96 L60 116", "none", BK, 2.5) + E(18, 92, 10, 4, BK, -30) + E(76, 104, 10, 4, BK, 30);
        if (y) s += Pt("M0 112 Q45 100 90 112 V140 H0Z", BL, BK, 1) + Pt("M22 102 L68 102 L60 126 L30 126Z", RD, BK, 1.4) + E(45, 102, 23, 6, "#f04a3a", 0, ink(1)) + R(38, 126, 14, 6, RD, ink(1)) + T(45, 120, "壽", 13, YL);
        break;
      }
      case 10: { // 단풍
        const cols = [RD, BK, YL, RD, YL, BK, RD];
        let i = 0;
        for (const [x, yy, r] of [[14, 16, 12], [40, 12, 11], [68, 18, 12], [26, 40, 11], [56, 42, 12], [80, 46, 10], [12, 70, 11], [40, 72, 12], [70, 76, 11], [24, 104, 11], [60, 110, 12], [84, 104, 10], [44, 130, 10]])
          if (!y || yy < 70 || x > 70) s += maple(x, yy, r, cols[i++ % cols.length]);
        if (y) s += `<g transform="translate(38 108)">` + E(0, 0, 22, 11, YL, 0, ink(1.3)) + E(18, -18, 7, 10, YL, -20, ink(1.3)) + C(20, -20, 1.5, BK) +
                    Pt("M16 -28 L10 -42 M12 -36 L4 -38 M22 -28 L28 -42 M26 -36 L34 -38", "none", BK, 2) +
                    Pt("M-14 9 L-16 30 M-6 10 L-6 30 M8 10 L10 30 M16 8 L18 30", "none", BK, 3) +
                    C(-8, -3, 2, BK) + C(2, 2, 2, BK) + C(-14, 3, 1.6, BK) + C(10, -4, 1.6, BK) + `</g>`;
        break;
      }
      case 11: { // 오동
        const bottom = g ? YL : c.ssang ? RD : null;
        if (bottom) s += R(0, 104, 90, 36, bottom);
        s += Pt("M4 104 Q2 84 18 82 Q20 70 34 74 Q44 64 56 74 Q70 70 72 82 Q88 84 86 104 Q66 96 45 104 Q24 96 4 104Z", BK);
        s += Pt("M45 76 L45 30", "none", BK, 2.5);
        for (let yy = 30; yy < 72; yy += 8) s += E(40, yy, 4, 3, BL, -20, ink(.6)) + E(50, yy + 4, 4, 3, BL, 20, ink(.6));
        if (g) s += `<g transform="translate(44 26)">` + C(0, 0, 8, RD, ink(1.2)) + Pt("M6 -2 L14 0 L6 3Z", YL, BK, .8) + C(2, -2, 1.4, BK) +
                    Pt("M-4 6 Q-30 20 -40 60 Q-20 40 -2 14Z", YL, BK, 1) + Pt("M2 8 Q10 36 2 70 Q16 40 10 10Z", RD, BK, 1) + Pt("M-2 8 Q-14 40 -26 74 Q-6 46 4 12Z", BL, BK, 1) + `</g>` + gwangMark(76, 124);
        break;
      }
      case 12: { // 비
        if (c.ssang) {
          s += R(0, 0, 90, 140, RD);
          s += Pt("M10 0 L20 0 Q10 40 34 80 Q50 110 30 140 L18 140 Q34 108 22 80 Q2 40 10 0Z", BK);
          s += Pt("M56 0 L80 0 Q70 30 84 60 Q90 74 90 74 V140 L66 140 Q74 96 58 70 Q44 40 56 0Z", BK);
          for (let i = 0; i < 9; i++) s += Pt(`M${6 + i * 10} 0 L${2 + i * 10} 140`, "none", BK, 0.8, `opacity=".5"`);
          break;
        }
        s += Pt("M0 0 Q14 30 6 70 M20 0 Q32 34 22 78 M70 0 Q56 34 66 80 M86 0 Q74 30 84 64", "none", BK, 2.2);
        for (const [x0, x1] of [[6, 16], [22, 34], [66, 56], [84, 74]]) for (let yy = 8; yy < 70; yy += 10) s += E(x0 + (x1 - x0) * (yy / 70), yy, 2.2, 6, BK, x1 > x0 ? 20 : -20);
        if (g) {
          s += Pt("M0 118 Q20 108 40 118 T90 114 V140 H0Z", BL, BK, 1) + Pt("M0 126 Q22 118 44 128 T90 124", "none", WH, 1.4);
          s += Pt("M20 62 Q45 36 70 62Z", BK) + Pt("M45 62 L45 98", "none", BK, 2.5);
          s += Pt("M34 76 Q45 70 56 76 L58 110 L32 110Z", RD, BK, 1.2) + C(45, 70, 6, "#f6d7b3", ink(1)) + R(36, 108, 18, 6, BK) + Pt("M50 82 L62 92", "none", BK, 2);
          s += E(74, 110, 7, 5, YL, 0, ink(1)) + C(72, 107, 1.2, BK) + gwangMark(12, 12);
        }
        if (y) s += `<g transform="translate(48 96) rotate(-10)">` + E(0, 0, 16, 6, YL, 0, ink(1)) + Pt("M-12 1 L-30 -10 M-12 2 L-30 10", "none", BK, 2.5) +
                    Pt("M-4 -4 Q6 -26 22 -14 Q8 -6 4 -1Z", BK) + C(14, -4, 5.5, RD, ink(1)) + E(4, 3, 8, 3, RD) + C(15, -5, 1, WH) + `</g>`;
        if (t) s += Pt("M0 120 Q30 110 60 122 T90 118 V140 H0Z", BK);
        break;
      }
    }
    if (t) s += ribbon(c.rib);
    return s;
  }

  const svgCache = new Map();
  function faceSVG(c) {
    if (svgCache.has(c.id)) return svgCache.get(c.id);
    const lab = label(c);
    const labCol = c.kind === "gwang" ? RD : c.kind === "tti" ? (c.rib === "cheong" ? BL : RD) : BK;
    const mirror = c.kind === "pi" && c.alt ? `transform="translate(90 0) scale(-1 1)"` : "";
    let s = `<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
    s += `<rect x="0" y="0" width="100" height="150" rx="6" fill="${RD}"/>`;
    s += `<svg x="5" y="5" width="90" height="140" viewBox="0 0 90 140"><rect width="90" height="140" fill="${WH}"/><g ${mirror}>${art(c)}</g></svg>`;
    s += `<rect x="5" y="5" width="90" height="140" fill="none" stroke="${BK}" stroke-width=".8"/>`;
    // 읽기 도움: 월 숫자와 패 종류 (끌 수 있음)
    const nm = String(c.m), wide = nm.length > 1;
    s += `<g class="aid"><rect x="7" y="7" width="${wide ? 24 : 18}" height="18" rx="9" fill="${WH}" stroke="${BK}" stroke-width="1.2"/>` + T(wide ? 19 : 16, 21, nm, 14, BK);
    const lw = lab.length * 15 + 12;
    s += `<rect x="${50 - lw / 2}" y="127" width="${lw}" height="19" rx="9.5" fill="${WH}" stroke="${BK}" stroke-width="1"/>` + T(50, 141.5, lab, 14, labCol) + `</g>`;
    if (c.ssang) s += C(85, 16, 8.5, BK, `stroke="${WH}" stroke-width="1.6"`) + T(85, 20.5, "2", 12, WH);
    s += `</svg>`;
    svgCache.set(c.id, s);
    return s;
  }
  const BACK = `<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${R(0, 0, 100, 150, "#b3121d")}${R(7, 7, 86, 136, "none", `rx="5" stroke="#e2545e" stroke-width="2"`)}${C(50, 75, 17, "#f7f0df")}${T(50, 83, "양", 21, "#b3121d")}</svg>`;

  // 카드 요소는 48장을 처음에 한 번만 만들고, 이후에는 자리만 옮긴다.
  const EL = new Map();
  function buildCards() {
    for (const c of CARDS) {
      const e = document.createElement("div");
      e.className = "card down";
      e.dataset.id = c.id;
      e.innerHTML = `<div class="inner"><div class="face front">${faceSVG(c)}</div><div class="face back">${BACK}</div></div>`;
      e.addEventListener("click", () => onHand(c.id));
      e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); onHand(c.id); } });
      EL.set(c.id, e);
    }
  }
  function staticCard(c) {      // 대화상자용 복제본
    const e = document.createElement("button");
    e.type = "button"; e.className = "card"; e.setAttribute("aria-label", nameOf(c));
    e.style.border = "0"; e.style.padding = "0"; e.style.background = "none";
    e.innerHTML = `<div class="inner"><div class="face front">${faceSVG(c)}</div></div>`;
    return e;
  }

  // ================= 점수 =================
  function score(caps) {
    const parts = [];
    const g = caps.filter(c => c.kind === "gwang");
    let gp = 0;
    if (g.length === 5) gp = 15; else if (g.length === 4) gp = 4; else if (g.length === 3) gp = g.some(c => c.bi) ? 2 : 3;
    if (gp) parts.push([`광 ${g.length}장${g.length === 3 && g.some(c => c.bi) ? " (비광 포함)" : ""}`, gp]);
    const t = caps.filter(c => c.kind === "tti");
    let tp = t.length >= 5 ? t.length - 4 : 0;
    if (tp) parts.push([`띠 ${t.length}장`, tp]);
    for (const k of ["hong", "cheong", "cho"]) if (t.filter(c => c.rib === k).length === 3) { parts.push([RIB[k], 3]); tp += 3; }
    let best = null;   // 국진은 열끗·쌍피 중 유리한 쪽
    for (const asPi of [false, true]) {
      const y = caps.filter(c => c.kind === "yeol" && !(asPi && c.gukjin));
      const piN = caps.filter(c => c.kind === "pi").reduce((a, c) => a + c.pi, 0) + (asPi && caps.some(c => c.gukjin) ? 2 : 0);
      const yp = y.length >= 5 ? y.length - 4 : 0;
      const gd = y.filter(c => c.godori).length === 3 ? 5 : 0;
      const pp = piN >= 10 ? piN - 9 : 0;
      if (!best || yp + gd + pp > best.sum) best = { sum: yp + gd + pp, yp, gd, pp, yN: y.length, piN };
    }
    if (best.yp) parts.push([`열끗 ${best.yN}장`, best.yp]);
    if (best.gd) parts.push(["고도리", 5]);
    if (best.pp) parts.push([`피 ${best.piN}장`, best.pp]);
    return { total: gp + tp + best.sum, parts, gp, pp: best.pp, yN: best.yN, gN: g.length };
  }
  const piCount = caps => caps.filter(c => c.kind === "pi").reduce((a, c) => a + c.pi, 0);
  const piMax = caps => piCount(caps) + (caps.some(c => c.gukjin) ? 2 : 0);
  function val(c) {
    if (c.kind === "gwang") return c.bi ? 12 : 20;
    if (c.kind === "yeol") return c.godori ? 10 : c.gukjin ? 8 : 6;
    if (c.kind === "tti") return c.rib === "bi" ? 4 : 7;
    return c.pi === 2 ? 6 : 3;
  }

  // ================= 소리 =================
  // 모드: all(효과음+목소리) → sfx(효과음만) → off
  const SND_MODES = ["all", "sfx", "off"], SND_LABEL = { all: "소리·목소리", sfx: "효과음만", off: "소리 끔" };
  let sndMode = store.get("yangmatgo.snd");
  if (!SND_MODES.includes(sndMode)) sndMode = "all";
  let actx = null, master = null, noiseBuf = null;
  function audio() {
    if (sndMode === "off") return null;
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = actx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 4;
        master = actx.createGain(); master.gain.value = 0.9;
        master.connect(comp).connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.6, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (actx.state === "suspended") actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function tone(f, dur, type = "sine", vol = 0.12, delay = 0, to = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  // 잡음 한 줌: 필터 종류·주파수·길이·음량
  function burst(type, freq, q, dur, vol, delay = 0, sweepTo = 0) {
    const a = audio(); if (!a) return;

    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();

    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master); src.start(t0, Math.random() * 0.4); src.stop(t0 + dur + 0.02);
  }
  const sfx = {
    // 패를 담요에 내리치는 "착!": 날카로운 딱 + 종이 몸통 + 담요 쿵
    slap(power = 1) {
      const k = rand(0.9, 1.1);
      burst("highpass", 5200 * k, 0.7, 0.012, 0.5 * power);           // 모서리가 먼저 닿는 딱
      burst("highpass", 3000 * k, 0.7, 0.03, 0.6 * power, 0.012);     // 면이 붙는 짝
      burst("bandpass", 1050 * k, 1.1, 0.08, 0.7 * power, 0.01);      // 종이 몸통
      tone(140 * k, 0.13, "sine", 0.38 * power, 0.008, 50);            // 담요 쿵
    },
    whoosh(dur = 0.2) { burst("bandpass", 400, 0.9, dur, 0.2, 0, 2200); },   // 내리꽂기 전 바람 가르는 소리
    flip() { burst("highpass", 2400, 0.8, 0.05, 0.25); tone(900, 0.03, "triangle", 0.05); },
    // 가져오기 "촥": 쓸어 담는 소리 + 맑은 똑
    take() {   // 촥촥: 두 번 쓸어 담고 맑은 똑
      burst("bandpass", 2800, 0.9, 0.12, 0.3, 0, 800); burst("bandpass", 2400, 0.9, 0.12, 0.26, 0.09, 700);
      tone(1320, 0.07, "triangle", 0.07, 0.2); tone(1760, 0.09, "triangle", 0.05, 0.25);
    },
    pluck() { tone(600, 0.12, "sine", 0.16, 0, 1500); burst("highpass", 3000, 0.8, 0.03, 0.2, 0.05); },   // 피 뺏기 쏙
    ding() { tone(1568, 0.25, "sine", 0.12); tone(2093, 0.35, "sine", 0.1, 0.12); },
    shuffle() { for (let i = 0; i < 22; i++) burst("highpass", 2600 + rand(-400, 400), 0.8, 0.018, 0.22, i * 0.028); },
    event() { [784, 988, 1175].forEach((f, i) => tone(f, 0.12, "square", 0.05, i * 0.07)); },
    go() { tone(220, 0.08, "sine", 0.4, 0, 70); tone(392, 0.32, "sawtooth", 0.07, 0.05, 784); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.24, "triangle", 0.12, i * 0.1)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.32, "triangle", 0.11, i * 0.15)); },
  };
  const buzz = p => { try { if (sndMode !== "off" && navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

  // ================= 목소리 =================
  // 기기에 들어 있는 한국어 음성으로, 높고 발랄하게 말한다.
  // 기계 음성은 문장을 말하면 억양이 어색하다. 짧은 감탄사와 낱말로만.
  const LINES = {
    bomb: ["폭탄!", "펑!", "쾅!"], shake: ["흔들어!", "흔들흔들!"], jjok: ["쪽!", "쪽쪽!"], ppuk: ["쌌다!", "뻑!", "앗, 쌌다!"],
    ttadak: ["따닥!"], sweep: ["싹쓸이!", "싹!"], eatppuk: ["냠!", "꿀꺽!"], jappuk: ["자뻑!"],
    gwang1: ["광!", "광이다!"], ssang: ["쌍피!"], steal: ["뺏었다!", "이리 와!"], stolen: ["내 피!", "앗!"],
    seven: ["났다!", "칠 점!"], start: ["시작!", "자, 간다!"], ask: ["고? 스톱?"],
    godori: ["고도리!"], hong: ["홍단!"], cheong: ["청단!"], cho: ["초단!"],
    gwang3: ["삼광!"], gwang4: ["사광!"], gwang5: ["오광!"],
    stop: ["스톱!"], pibak: ["피박!"], gwangbak: ["광박!"], meongtta: ["멍따!"], gobak: ["고박!"],
    nagari: ["나가리!"], win: ["앗싸!", "아싸!", "이겼다!"], lose: ["아이고!", "에구!", "아깝다!"], on: ["짠!"],
  };
  const GO_WORD = ["", "고!", "투고!", "쓰리고!", "포고!", "파이브고!", "식스고!", "세븐고!"];
  let voice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang));
      // 여성 음성으로 알려진 이름을 먼저 고른다
      voice = vs.find(v => /yuna|유나|heami|sunhi|선희|female|여|google/i.test(v.name)) || vs[0] || null;
    } catch (e) { voice = null; }
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text) {
    if (sndMode !== "all" || !("speechSynthesis" in window)) return;
    try {
      if (speechSynthesis.pending) speechSynthesis.cancel();   // 밀린 말이 쌓이면 비우고 지금 것만
      const u = new SpeechSynthesisUtterance(text);

      u.pitch = 1.6; u.rate = 1.0; u.volume = 1;            // 짧은 낱말은 너무 빠르면 뭉개진다

    } catch (e) {}
  }
  const speak = key => { const l = LINES[key]; if (l) say(l[Math.floor(Math.random() * l.length)]); };
  const sayGo = n => say(GO_WORD[n] || `${n}고!`);

  // ================= 화면 맞춤 =================
  // 실제로 보이는 높이(메신저 안 브라우저의 주소창·툴바를 뺀 높이)를 재서 카드 크기를 정한다.
  const app = $("#app");
  function fit() {
    const vv = window.visualViewport;
    const vw = Math.min(vv ? vv.width : innerWidth, document.documentElement.clientWidth || innerWidth);
    const vh = vv ? vv.height : innerHeight;
    document.documentElement.style.setProperty("--app-h", Math.round(vh) + "px");
    const W = Math.min(vw, 1120) - 24;
    const portrait = vw < vh * 1.1;
    const shortLand = !portrait && vh <= 560;
    const gap = portrait ? 6 : 8;
    let hand = portrait ? Math.min((W - 4 * gap) / 5, (vh * 0.34 - 14) / 3.08)
             : Math.min((W - 9 * gap) / 10, (vh * (shortLand ? 0.3 : 0.27)) / 1.55);
    hand = clamp(hand, 34, 108);
    const cap = clamp(shortLand ? vh * 0.05 : Math.min(W / (portrait ? 15 : 28), vh * 0.045), 14, 34);
    const set = (k, v) => document.documentElement.style.setProperty(k, v.toFixed(1) + "px");
    set("--hand-w", hand); set("--cap-w", cap); set("--gap", gap);
    $("#hand").style.maxWidth = ((portrait ? 5 : 10) * hand + ((portrait ? 5 : 10) - 1) * gap + 1).toFixed(0) + "px";
    baseFloor = Math.min(hand * 0.86, 84);
    fitFloor();
  }
  // 바닥 카드: 담요 칸 안에 들어갈 때까지 줄인다 (바닥 패 수가 바뀔 때마다)
  let baseFloor = 50;
  function fitFloor() {
    const fl = $("#floor"), tb = fl.parentElement;
    let fw = baseFloor;
    document.documentElement.style.setProperty("--floor-w", fw.toFixed(1) + "px");
    const used = () => { let h = 0; for (const g of fl.children) h = Math.max(h, g.offsetTop + g.offsetHeight); return h - fl.offsetTop + 30; };
    for (let i = 0; i < 14 && used() > tb.clientHeight - 16; i++) {
      fw *= 0.92;
      document.documentElement.style.setProperty("--floor-w", fw.toFixed(1) + "px");
    }
  }
  window.addEventListener("resize", () => fit());
  if (window.visualViewport) visualViewport.addEventListener("resize", () => fit());
  window.addEventListener("orientationchange", () => setTimeout(fit, 250));

  // ================= 알림·대화상자 =================
  const toastEl = $("#toast");
  let toastQ = Promise.resolve();
  function toast(big, small = "") {
    toastQ = toastQ.then(async () => {
      toastEl.innerHTML = big + (small ? `<small>${small}</small>` : "");
      const a = toastEl.animate([
        { opacity: 0, transform: "translate(-50%, -50%) scale(.55)" },
        { opacity: 1, transform: "translate(-50%, -50%) scale(1.08)", offset: 0.18 },
        { opacity: 1, transform: "translate(-50%, -50%) scale(1)", offset: 0.28 },
        { opacity: 1, transform: "translate(-50%, -50%) scale(1)", offset: 0.85 },
        { opacity: 0, transform: "translate(-50%, -50%) scale(.96)" },
      ], { duration: Math.max(1100, D * 2), easing: "ease-out" });
      await a.finished.catch(() => {});
    });
    return toastQ;
  }
  function modal(build) {
    return new Promise(resolve => {
      const wrap = document.createElement("div");
      wrap.className = "modal";
      const sheet = document.createElement("div");
      sheet.className = "sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true");
      wrap.appendChild(sheet);
      const done = v => { wrap.remove(); resolve(v); };
      build(sheet, done);
      $("#modal-root").appendChild(wrap);
      sheet.animate([{ transform: "scale(.92)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 180, easing: "ease-out" });
      const first = sheet.querySelector("button"); if (first) first.focus();
    });
  }
  function ask(title, text, yes, no, yesClass = "red") {
    return modal((s, done) => {
      s.innerHTML = `<h2>${title}</h2><p>${text}</p><div class="row"><button class="big ${yesClass}" type="button">${yes}</button><button class="big" type="button">${no}</button></div>`;
      const [b1, b2] = s.querySelectorAll("button");
      b1.onclick = () => done(true); b2.onclick = () => done(false);
    });
  }
  function choosePrompt(opts) {
    return modal((s, done) => {
      s.innerHTML = `<h2>어느 패를 가져갈까요?</h2><p>같은 달 패가 두 장 있습니다. 가져올 패를 누르세요.</p><div class="picks"></div>`;
      const box = s.querySelector(".picks");
      for (const c of opts) { const b = staticCard(c); b.onclick = () => done(c); box.appendChild(b); }
    });
  }

  // ================= 판 상태 =================
  const ME = "me", CPU = "cpu";
  const other = w => (w === ME ? CPU : ME);
  let D = 560;          // 한 동작이 끝나고 다음 동작까지의 간격
  let MOVE = 340;       // 패가 날아가는 시간
  let G = null;
  let stats = (() => { try { return JSON.parse(store.get("yangmatgo.stats")) || { w: 0, l: 0, pts: 0 }; } catch (e) { return { w: 0, l: 0, pts: 0 }; } })();

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const four = arr => { const n = {}; for (const c of arr) if (++n[c.m] === 4) return true; return false; };

  async function newRound(starter = ME, carry = 0) {
    for (const c of CARDS) c.rot = null;
    let deck, me, cpu, floor;
    do {
      deck = shuffle(CARDS.slice());
      me = deck.splice(0, 10); cpu = deck.splice(0, 10); floor = deck.splice(0, 8);
    } while (four(me) || four(cpu) || four(floor));
    const byM = (a, b) => a.m - b.m || a.id - b.id;
    // 일단 모두 더미에 모았다가 나눠 준다 (애니메이션)
    G = { deck: CARDS.slice(), floor: [], hands: { me: [], cpu: [] }, caps: { me: [], cpu: [] },
          go: { me: 0, cpu: 0 }, goBase: { me: 0, cpu: 0 }, shakes: { me: 0, cpu: 0 }, shook: { me: new Set(), cpu: new Set() },
          ppuk: {}, turn: starter, carry, over: false, busy: true };
    render(true);
    sfx.shuffle();
    await sleep(380);
    G.deck = deck; G.floor = floor; G.hands = { me: me.sort(byM), cpu: cpu.sort(byM) };
    render();
    fit();
    await sleep(MOVE + 120);
    sfx.slap(0.7);
    speak("start");
    G.busy = false;
    render();
    status(starter === ME ? "내 차례입니다. 낼 패를 누르세요." : "컴퓨터 차례입니다.");
    if (carry) toast("나가리 판", `이번 판 점수 ×${2 ** carry}`);
    if (starter === CPU) cpuTurn();
  }

  const floorOf = m => G.floor.filter(c => c.m === m);
  function capture(who, cards) {
    for (const c of cards) c.rot = null;
    G.floor = G.floor.filter(c => !cards.includes(c));
    G.caps[who].push(...cards);
    for (const c of cards) if (!G.floor.some(f => f.m === c.m)) delete G.ppuk[c.m];
  }
  function steal(who, n) {
    const from = G.caps[other(who)];
    let got = 0;
    for (let i = 0; i < n; i++) {
      let k = from.findIndex(c => c.kind === "pi" && c.pi === 1);
      if (k < 0) k = from.findIndex(c => c.kind === "pi");
      if (k < 0) break;
      G.caps[who].push(from.splice(k, 1)[0]);
      got++;
    }
    return got;
  }
  const removeFromHand = (who, c) => { G.hands[who] = G.hands[who].filter(x => x !== c); };
  async function choose(who, opts) {
    if (who === CPU) return opts.slice().sort((a, b) => val(b) - val(a))[0];
    return choosePrompt(opts);
  }

  // 패 하나를 바닥에 내려놓는 한 박자: 날아가서 → 닿는 순간 착! → 잠깐 쉼
  // 패 내기: 손에서 들어 올려 → 비스듬히 높이 → 내리꽂아 착! → 살짝 튐
  let SLAM = 560;
  const slamIds = new Set();
  async function land(cards, power = 1) {
    cards = [].concat(cards);
    for (const c of cards) { slamIds.add(c.id); if (c.rot == null) c.rot = rand(-7, 7); }
    render();
    setTimeout(() => sfx.whoosh(SLAM * 0.0004), SLAM * 0.3);
    await sleep(SLAM * 0.8);
    sfx.slap(power); buzz(16);
    bump(cards[0]);
    await sleep(Math.max(140, D - SLAM * 0.5));
  }
  async function sweep() {
    render();
    sfx.take(); buzz([8, 30, 8]);
    await sleep(MOVE + 160);
  }

  // 이번 턴에 새로 완성된 족보: 고도리·홍단·청단·초단, 광 3·4·5장
  function newSets(before, after) {
    const had = new Set(before.parts.map(p => p[0])), out = [];
    for (const [nm, key] of [["고도리", "godori"], ["홍단", "hong"], ["청단", "cheong"], ["초단", "cho"]])
      if (!had.has(nm) && after.parts.some(p => p[0] === nm)) out.push([nm + "!", "", key]);
    if (after.gN > before.gN && after.gN >= 3) out.push([["", "", "", "삼광", "사광", "오광"][after.gN] + "!", "", "gwang" + after.gN]);
    return out;
  }

  async function turn(who, A, bomb = false) {
    G.busy = true;
    const events = [];
    const scoreBefore = score(G.caps[who]);
    const capsBefore = G.caps[who].length;
    let stealN = 0, pendA = null, placedA = false, aCount = 0;

    if (A && bomb) {
      const three = G.hands[who].filter(c => c.m === A.m);
      three.forEach(c => removeFromHand(who, c));
      G.floor.push(...three);
      G.shakes[who]++;
      await land(three, 1.5);
      capture(who, floorOf(A.m));
      stealN++; events.push(["폭탄!", "점수 2배 · 피 한 장", "bomb"]);
      await sweep();
      A = null;
    } else if (A) {
      removeFromHand(who, A);
      const fm = floorOf(A.m);
      aCount = fm.length;
      G.floor.push(A);
      await land(A, aCount ? 1.15 : 0.9);
      if (aCount === 0) placedA = true;
      else if (aCount <= 2) pendA = { A, opts: fm };
      else {
        const owner = G.ppuk[A.m];
        capture(who, floorOf(A.m));
        if (owner) { const n = owner === who ? 2 : 1; stealN += n; events.push([owner === who ? "자뻑!" : "뻑 먹기!", `피 ${n}장`, owner === who ? "jappuk" : "eatppuk"]); }
        await sweep();
      }
    }

    if (G.deck.length) {
      const B = G.deck.pop();
      G.floor.push(B);
      sfx.flip();
      await land(B, 1);
      if (A && B.m === A.m && (placedA || pendA)) {
        if (placedA) { capture(who, [A, B]); stealN++; events.push(["쪽!", "피 한 장", "jjok"]); }
        else if (aCount === 1) { pendA = null; G.ppuk[A.m] = who; events.push(["뻑!", "세 장이 바닥에 남습니다", "ppuk"]); }
        else { capture(who, floorOf(A.m)); pendA = null; stealN++; events.push(["따닥!", "피 한 장", "ttadak"]); }
      } else {
        const fm = floorOf(B.m).filter(c => c !== B);
        if (fm.length === 1) capture(who, [B, fm[0]]);
        else if (fm.length === 2) { const pick = await choose(who, fm); capture(who, [B, pick]); }
        else if (fm.length === 3) {
          const owner = G.ppuk[B.m];
          capture(who, floorOf(B.m));

        }
      }

    if (pendA) {
      const pick = pendA.opts.length === 1 ? pendA.opts[0] : await choose(who, pendA.opts);

    }
    if (G.floor.length === 0 && G.deck.length > 0) { stealN++; events.push(["싹쓸이!", "피 한 장", "sweep"]); }
    const got = stealN ? steal(who, stealN) : 0;
    events.push(...newSets(scoreBefore, score(G.caps[who])));
    const taken = G.caps[who].slice(capsBefore);
    await sweep();
    if (got) setTimeout(sfx.pluck, 160);
    // 목소리는 한 턴에 두 마디까지: 큰 사건 → 족보 → 광·쌍피 → 피 뺏기
    const voices = events.map(e => e[2]);
    if (!events.some(e => /^gwang\d/.test(e[2])) && taken.some(c => c.kind === "gwang")) voices.push("gwang1");
    if (taken.some(c => c.ssang)) voices.push("ssang");
    if (got) voices.push(who === ME ? "steal" : "stolen");
    voices.slice(0, 2).forEach((k, i) => setTimeout(() => speak(k), i * 50));
    events.forEach(([big, small]) => {
      sfx.event();
      toast(big, small ? (who === ME ? small : "컴퓨터 · " + small) : (who === ME ? "" : "컴퓨터"));
    });
    if (got && who === CPU) toast("피를 뺏겼습니다", `${got}장`);
    await sleep(D * 0.5);
    await afterTurn(who);
  }

  async function afterTurn(who) {
    const s = score(G.caps[who]).total;
    if (s >= 7 && s > G.goBase[who]) {
      if (!G.goBase[who] && !G.go[who]) { sfx.ding(); speak("seven"); await sleep(500); }
      if (!G.deck.length) return endRound(who);
      const go = who === ME ? await askGo(s) : cpuGo();
      if (!go) { speak("stop"); return endRound(who); }
      G.go[who]++;
      G.goBase[who] = s;
      sfx.go(); sayGo(G.go[who]); buzz([20, 40, 20]);
      render();
      await toast(`${G.go[who]}고!`, who === ME ? "계속 갑니다" : "컴퓨터가 고를 불렀습니다");
    }
    if (!G.deck.length) return nagari();
    G.turn = other(who);
    G.busy = false;
    render();
    if (G.turn === CPU) return cpuTurn();
    if (!G.hands.me.length) {
      status("손패가 없어 더미에서 한 장 뒤집습니다.");
      await sleep(D);
      return turn(ME, null);
    }
    status("내 차례입니다. 낼 패를 누르세요.");
  }

  function askGo(s) {
    return modal((el, done) => {
      el.innerHTML = `<h2>${s}점 났습니다</h2><p>고를 부르면 계속 치고 점수가 더 오릅니다. 대신 컴퓨터가 먼저 나면 두 배로 잃습니다.</p>
        <div class="row"><button class="big red" type="button">고</button><button class="big dark" type="button">스톱</button></div>`;
      const [g, st] = el.querySelectorAll("button");
      g.onclick = () => done(true); st.onclick = () => done(false);
    });
  }
  function cpuGo() {
    const opp = score(G.caps.me).total, left = G.deck.length;
    if (left <= 4 || opp >= 5) return false;
    if (G.go.cpu >= 2) return Math.random() < 0.3;
    return Math.random() < 0.7;
  }

  async function cpuTurn() {
    G.busy = true;
    status("컴퓨터가 생각 중입니다…");
    render();
    await sleep(D + 300);
    const hand = G.hands.cpu;
    if (!hand.length) return turn(CPU, null);
    let best = null;
    for (const c of hand) {
      const fm = floorOf(c.m), same = hand.filter(x => x.m === c.m).length;
      let sc;
      if (fm.length === 3) sc = 60 + fm.reduce((a, x) => a + val(x), 0);
      else if (fm.length) sc = 20 + val(c) + Math.max(...fm.map(val)) + (same === 3 && fm.length === 1 ? 40 : 0);
      else sc = -val(c) - (same >= 2 ? 4 : 0);
      sc += rand(0, 2);
      if (!best || sc > best.sc) best = { c, sc, same, fm: fm.length };
    }
    const c = best.c;
    if (best.same === 3 && best.fm === 1) { status("컴퓨터가 폭탄을 냈습니다."); return turn(CPU, c, true); }
    if (best.same === 3 && best.fm === 0 && !G.shook.cpu.has(c.m)) {
      G.shakes.cpu++; G.shook.cpu.add(c.m); sfx.event(); speak("shake");
      render();
      await toast("흔들기!", `컴퓨터 · ${c.m}월 세 장`);
    }
    status(`컴퓨터가 ${nameOf(c)}을(를) 냈습니다.`);
    return turn(CPU, c);
  }

  async function onHand(id) {
    if (!G || G.busy || G.over || G.turn !== ME) return;
    const c = G.hands.me.find(x => x.id === id);
    if (!c) return;
    G.busy = true;
    render();
    const same = G.hands.me.filter(x => x.m === c.m).length, fm = floorOf(c.m).length;
    let bomb = false;
    if (same === 3 && fm === 1) {
      bomb = await ask("폭탄", `${c.m}월 패 세 장을 한꺼번에 내고 바닥의 ${c.m}월 패까지 가져옵니다. 점수 2배, 피 한 장을 뺏습니다.`, "폭탄!", "한 장만 내기");
    } else if (same === 3 && fm === 0 && !G.shook.me.has(c.m)) {
      if (await ask("흔들기", `${c.m}월 패 세 장을 보여 줍니다. 이번 판에 이기면 점수 2배입니다.`, "흔들기", "그냥 내기")) {
        G.shakes.me++; G.shook.me.add(c.m); sfx.event(); speak("shake"); render();
        await toast("흔들기!", `${c.m}월 세 장`);
      }
    }
    status(`${nameOf(c)}을(를) 냈습니다.`);
    await turn(ME, c, bomb);
  }

  // ================= 판 끝 =================
  function settle(win) {
    const lose = other(win);
    const sw = score(G.caps[win]);
    const rows = sw.parts.map(([k, v]) => [k, `${v}점`]);
    const voices = [];
    let base = sw.total;
    if (G.go[win]) { rows.push([`${G.go[win]}고 보너스`, `+${G.go[win]}점`]); base += G.go[win]; }
    let mult = 1;
    const mul = (name, x, v) => { mult *= x; rows.push([name, `×${x}`]); if (v) voices.push(v); };
    if (G.go[win] >= 3) mul(`${G.go[win]}고`, 2 ** (G.go[win] - 2));
    if (G.shakes[win]) mul(G.shakes[win] > 1 ? `흔들기·폭탄 ${G.shakes[win]}번` : "흔들기·폭탄", 2 ** G.shakes[win]);
    if (sw.pp > 0 && piMax(G.caps[lose]) < 7) mul("피박", 2, "pibak");
    if (sw.gp > 0 && score(G.caps[lose]).gN === 0) mul("광박", 2, "gwangbak");
    if (sw.yN >= 7) mul("멍따", 2, "meongtta");
    if (G.go[lose] > 0) mul("고박", 2, "gobak");
    if (G.carry) mul("나가리 판", 2 ** G.carry);
    return { rows, total: base * mult, voices };
  }

  async function endRound(win) {
    G.over = true; G.busy = true;
    render();
    const r = settle(win);
    if (win === ME) { stats.w++; stats.pts += r.total; sfx.win(); } else { stats.l++; stats.pts -= r.total; sfx.lose(); }
    store.set("yangmatgo.stats", JSON.stringify(stats));
    status(win === ME ? "이겼습니다!" : "졌습니다.");
    await sleep(D);
    speak(r.voices[0] || (win === ME ? "win" : "lose"));
    await modal((el, done) => {
      el.innerHTML = `<h2>${win === ME ? "이겼습니다!" : "컴퓨터가 이겼습니다"}</h2>
        <table class="tbl"><tbody>${r.rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}
        <tr class="sum"><td>${win === ME ? "얻은 점수" : "잃은 점수"}</td><td>${r.total}점</td></tr></tbody></table>
        <p class="small">전적 ${stats.w}승 ${stats.l}패 · 누적 ${stats.pts >= 0 ? "+" : ""}${stats.pts}점</p>
        <div class="row"><button class="big red" type="button">다음 판</button></div>`;
      el.querySelector("button").onclick = () => done();
    });
    newRound(win, 0);
  }

  async function nagari() {
    G.over = true; G.busy = true;
    render();
    status("나가리");
    speak("nagari");
    await modal((el, done) => {
      el.innerHTML = `<h2>나가리</h2><p>패를 다 쳤는데 스톱한 사람이 없습니다. 다음 판 점수는 ${2 ** (G.carry + 1)}배입니다.</p>
        <div class="row"><button class="big red" type="button">다음 판</button></div>`;
      el.querySelector("button").onclick = () => done();
    });
    newRound(G.turn === ME ? CPU : ME, G.carry + 1);
  }

  // ================= 그리기 =================
  function status(t) { $("#status").textContent = t; }

  // 자리만 옮기고, 옮겨진 카드는 이전 자리에서 미끄러져 오게 (FLIP)
  function place(container, cards, faceUp, tilt = false) {
    for (const c of cards) {
      const e = EL.get(c.id);
      e.classList.toggle("down", !faceUp);
      e.style.rotate = tilt && c.rot != null ? c.rot.toFixed(1) + "deg" : "";   // 바닥 패는 실제처럼 조금씩 삐뚤게
      if (e.parentElement !== container || e.nextSibling) container.appendChild(e);
    }
  }
  function grpBox(id, title) {
    let d = document.getElementById(id);
    if (!d) {
      d = document.createElement("div");
      d.className = "grp"; d.id = id;
      d.innerHTML = `<h3><span>${title}</span><b>0</b></h3><div class="stack"></div>`;
    }
    return d;
  }
  function renderCaps(who) {
    const box = $(`#${who}-caps`);
    const groups = { gwang: "광", yeol: "열끗", tti: "띠", pi: "피" };
    for (const k of Object.keys(groups)) {
      const d = grpBox(`${who}-${k}`, groups[k]);
      if (d.parentElement !== box) box.appendChild(d);
      const list = G.caps[who].filter(c => c.kind === k);
      d.querySelector("b").textContent = k === "pi" ? piCount(G.caps[who]) : list.length;
      place(d.querySelector(".stack"), list, true);
    }
  }
  function renderBadges(box, who) {
    const b = [];
    if (G.go[who]) b.push(`<span class="badge go">${G.go[who]}고</span>`);
    if (G.shakes[who]) b.push(`<span class="badge shake">흔들기 ${G.shakes[who]}</span>`);
    box.innerHTML = b.join("");
  }

  function render(noAnim = false) {
    const prev = new Map();
    if (!noAnim) for (const [id, e] of EL) if (e.isConnected) prev.set(id, e.getBoundingClientRect());

    $("#cpu-pts").textContent = score(G.caps.cpu).total;
    $("#cpu-left").textContent = `· ${G.hands.cpu.length}장`;
    renderBadges($("#cpu-badges"), CPU);
    place($("#cpu-hand"), G.hands.cpu, false);
    renderCaps(CPU);

    place($("#deck"), G.deck, false);
    $("#deck-n").textContent = `${G.deck.length}장`;

    // 바닥: 같은 달끼리 겹친다. 묶음 상자는 달별로 재사용
    const fl = $("#floor");
    const order = [];
    for (const c of G.floor) if (!order.includes(c.m)) order.push(c.m);
    const keep = new Set(order.map(m => "fg" + m));
    for (const g of [...fl.children]) if (!keep.has(g.id)) {
      if (g.children.length && [...g.querySelectorAll(".card")].length) continue;   // 아직 카드가 남았으면 아래에서 비워짐
      g.remove();
    }
    for (const m of order) {
      let grp = document.getElementById("fg" + m);
      if (!grp) { grp = document.createElement("div"); grp.className = "fgrp"; grp.id = "fg" + m; }
      if (grp.parentElement !== fl || order.indexOf(m) !== [...fl.children].indexOf(grp)) fl.appendChild(grp);
      let tag = grp.querySelector(".tag");
      if (G.ppuk[m] && !tag) { tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "뻑"; grp.prepend(tag); }
      if (!G.ppuk[m] && tag) tag.remove();
      place(grp, G.floor.filter(x => x.m === m), true, true);
    }

    $("#me-pts").textContent = score(G.caps.me).total;
    renderBadges($("#me-badges"), ME);
    renderCaps(ME);
    const hd = $("#hand");
    const mine = G.turn === ME && !G.busy && !G.over;
    hd.className = "hand " + (mine ? "mine" : "wait");
    place(hd, G.hands.me, true);
    for (const c of G.hands.me) {
      const e = EL.get(c.id);
      e.classList.toggle("match", mine && G.floor.some(f => f.m === c.m));
      e.tabIndex = mine ? 0 : -1;
      e.setAttribute("role", "button");
      e.setAttribute("aria-label", nameOf(c));
    }
    for (const [id, e] of EL) if (!G.hands.me.some(c => c.id === id)) { e.classList.remove("match"); e.removeAttribute("role"); e.removeAttribute("tabindex"); e.removeAttribute("aria-label"); }
    // 비어 버린 바닥 묶음 정리
    for (const g of [...fl.children]) if (!g.querySelector(".card")) g.remove();

    fitFloor();
    if (noAnim || reduceMotion) return;
    for (const [id, e] of EL) {
      const r0 = prev.get(id);
      if (!r0 || !e.isConnected) continue;
      const r1 = e.getBoundingClientRect();
      const dx = r0.left - r1.left, dy = r0.top - r1.top, sc = r0.width / r1.width;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sc - 1) < 0.02) continue;
      e.style.zIndex = 30;
      if (slamIds.has(id)) {
        // 내리꽂기: 높이 들어 올려 비틀고, 가속하며 떨어져 살짝 눌렸다 튄다
        const lift = clamp(Math.hypot(dx, dy) * 0.18, 36, 90), tw = rand(8, 14) * (Math.random() < 0.5 ? -1 : 1);
        e.classList.add("air");
        const a = e.animate([
          { transform: `translate(${dx}px, ${dy}px) scale(${sc})` },
          { transform: `translate(${dx * 0.6}px, ${dy * 0.6 - lift}px) scale(${Math.max(sc, 1) * 1.32}) rotate(${tw}deg)`, offset: 0.42, easing: "cubic-bezier(.55,0,.95,.55)" },
          { transform: `translate(0px, 0px) scale(.93) rotate(${-tw * 0.15}deg)`, offset: 0.8 },
          { transform: "translate(0px, -2px) scale(1.035)", offset: 0.9 },
          { transform: "none" },
        ], { duration: SLAM, easing: "cubic-bezier(.3,.6,.3,1)" });
        setTimeout(() => e.classList.remove("air"), SLAM * 0.8);
        a.onfinish = a.oncancel = () => { e.style.zIndex = ""; e.classList.remove("air"); };
        continue;
      }
      const lift = Math.min(40, Math.hypot(dx, dy) * 0.12);
      const a = e.animate([
        { transform: `translate(${dx}px, ${dy}px) scale(${sc})` },
        { transform: `translate(${dx * 0.45}px, ${dy * 0.45 - lift}px) scale(${(sc + 1) / 2 * 1.12})`, offset: 0.5 },
        { transform: "none" },
      ], { duration: MOVE, easing: "cubic-bezier(.25,.75,.3,1)" });
      a.onfinish = a.oncancel = () => { e.style.zIndex = ""; };
    }
    slamIds.clear();
  }

  // 바닥에 닿는 순간: 묶음이 살짝 눌렸다 튀고, 먼지가 인다
  function bump(card) {
    if (reduceMotion) return;
    const e = EL.get(card.id);
    const grp = e.parentElement;
    if (grp && grp.classList.contains("fgrp")) grp.animate([{ transform: "scale(1)" }, { transform: "scale(.94) translateY(2px)" }, { transform: "scale(1.03)" }, { transform: "scale(1)" }], { duration: 240, easing: "ease-out" });
    const tb = $(".table");
    tb.animate([{ transform: "translate(0,0)" }, { transform: "translate(1px,2px)" }, { transform: "translate(-1px,-1px)" }, { transform: "translate(0,0)" }], { duration: 160 });
    const r = e.getBoundingClientRect();
    for (let i = 0; i < 7; i++) {
      const d = document.createElement("div");
      d.className = "dust";
      d.style.left = (r.left + r.width / 2) + "px"; d.style.top = (r.bottom - 4) + "px";
      document.body.appendChild(d);
      const a = rand(Math.PI * 0.9, Math.PI * 2.1), dist = rand(18, 38);
      d.animate([{ transform: "translate(-50%,-50%) scale(1)", opacity: .9 },
                 { transform: `translate(calc(-50% + ${Math.cos(a) * dist}px), calc(-50% + ${Math.sin(a) * dist * 0.5}px)) scale(.3)`, opacity: 0 }],
                { duration: rand(300, 480), easing: "ease-out" }).onfinish = () => d.remove();
    }
  }

  // ================= 버튼 =================
  const syncSound = () => { $("#btn-sound").textContent = SND_LABEL[sndMode]; };
  syncSound();
  $("#btn-sound").onclick = () => {
    sndMode = SND_MODES[(SND_MODES.indexOf(sndMode) + 1) % SND_MODES.length];
    store.set("yangmatgo.snd", sndMode); syncSound();
    if (sndMode === "all") speak("on");
    else if ("speechSynthesis" in window) speechSynthesis.cancel();
  };
  $("#btn-new").onclick = async () => {
    if (G && !G.over && (G.caps.me.length || G.caps.cpu.length)) {
      if (!(await ask("새 판", "지금 판을 그만두고 새로 시작할까요? 이번 판은 기록되지 않습니다.", "새로 시작", "계속하기"))) return;
    }
    if (G && G.busy && !G.over) return;
    newRound(ME, 0);
  };
  $("#btn-rules").onclick = () => modal((el, done) => {
    el.innerHTML = `<h2>양맞고 규칙</h2>
      <ul class="rules">
        <li>같은 <b>달(숫자)</b> 패끼리 짝을 맞춰 가져옵니다. 한 장 내고, 더미에서 한 장 뒤집습니다.</li>
        <li><b>7점</b>이 나면 <b>고</b>(계속) 또는 <b>스톱</b>(끝내기)을 고릅니다.</li>
        <li>광 3장 3점(비광이 끼면 2점), 4장 4점, 5장 15점.</li>
        <li>열끗·띠는 5장부터 1점, 한 장마다 1점 더. 고도리 5점, 홍단·청단·초단 각 3점.</li>
        <li>피는 10장부터 1점, 한 장마다 1점 더. 쌍피는 두 장으로 칩니다.</li>
        <li><b>쪽·따닥·싹쓸이·뻑 먹기</b>를 하면 상대 피를 한 장 뺏습니다.</li>
        <li><b>흔들기·폭탄</b>은 점수 2배. 피박·광박·멍따·고박도 각각 2배.</li>
        <li>패를 다 쳐도 아무도 스톱하지 못하면 <b>나가리</b>. 다음 판 점수가 2배가 됩니다.</li>
      </ul>
      <p class="small">전적 ${stats.w}승 ${stats.l}패 · 누적 ${stats.pts >= 0 ? "+" : ""}${stats.pts}점 · <a href="../">게임 목록</a></p>
      <div class="row"><button class="big" type="button" id="aid-btn"></button><button class="big dark" type="button">닫기</button></div>`;
    const ab = el.querySelector("#aid-btn");
    const syncAid = () => { ab.textContent = document.body.classList.contains("no-aid") ? "숫자·글자 보이기" : "숫자·글자 숨기기"; };
    syncAid();
    ab.onclick = () => { document.body.classList.toggle("no-aid"); store.set("yangmatgo.aid", document.body.classList.contains("no-aid") ? "off" : "on"); syncAid(); };
    el.querySelectorAll("button")[1].onclick = () => done();
  });
  // 첫 터치 때 소리·목소리를 깨운다 (아이폰은 사용자가 누르기 전엔 소리를 막는다)
  let woke = false;
  window.addEventListener("pointerdown", () => {
    if (woke) return; woke = true;
    audio();
    try { if (sndMode === "all" && "speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {}
  }, { capture: true });

  // 테스트용 훅
  window.__matgo = { faceSVG, get G() { return G; }, setDelay(ms) { D = ms; MOVE = Math.min(MOVE, Math.max(30, ms * 0.6)); SLAM = Math.min(SLAM, Math.max(40, ms * 0.9)); }, score, CARDS, fit };

  if (store.get("yangmatgo.aid") === "off") document.body.classList.add("no-aid");
  buildCards();
  fit();
  newRound(ME, 0);
})();
</script>
</body>
</html>

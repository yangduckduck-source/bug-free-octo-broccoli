<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다이 합치기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&display=swap">
<style>
  /* 한 화면: 어두운 기판 위 웨이퍼 트레이 4×4. 위에 점수, 아래에 칩 계보. 버튼 두 개만 문서 위에 띄운다. */
  :root {
    color-scheme: dark;
    --bg: #040b09;
    --ink: #e6fff4;
    --dim: #6fa58f;
    --mint: #5dffc3;
    --amber: #ffb547;
    --kr: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --num: "Orbitron", ui-monospace, monospace;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .btn {
    position: fixed; font: 15px var(--kr); color: var(--ink); background: rgba(4, 20, 15, .7); border: 1.5px solid rgba(93, 255, 195, .4);
    border-radius: 999px; padding: 8px 16px; cursor: pointer; touch-action: manipulation;
  }
  .btn:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  #snd { right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  #new { right: calc(env(safe-area-inset-right, 0px) + 12px); top: calc(env(safe-area-inset-top, 0px) + 12px); }
  #new[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="다이 합치기 게임 화면. 밀어서 같은 칩을 합쳐 더 좋은 칩을 만든다. 화살표 키나 WASD로도 움직인다."></canvas>
<button id="new" class="btn" type="button" hidden>새 판</button>
<button id="snd" class="btn" type="button">소리 켬</button>
<script>
(() => {
  "use strict";
  // ================= 화면 =================
  const W = 480, H = 760;
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let S = 1, OX = 0, OY = 0, DPR = 1, EX0 = 0, EX1 = W, EY0 = 0, EY1 = H, bgCache = null;
  function fit() {
    const vv = window.visualViewport, w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    S = Math.min(w / W, h / H); OX = (w - W * S) / 2; OY = (h - H * S) / 2;
    EX0 = -OX / S; EX1 = W + OX / S; EY0 = -OY / S; EY1 = H + OY / S;
    bgCache = null;
  }
  addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);
  fit();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeBack = t => 1 + 2.4 * Math.pow(t - 1, 3) + 1.4 * Math.pow(t - 1, 2);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const FONT = { kr: css("--kr"), num: css("--num") };

  // ================= 소리 =================
  let actx = null, master = null, noiseBuf = null, sndOn = true, guardAT = -1, guardWall = 0;
  function audio() {
    if (actx) return actx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      actx = new AC(); master = actx.createGain(); master.gain.value = sndOn ? 0.85 : 0; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
    return actx;
  }
  // 소리 지킴이: 휴대폰이 소리를 재우거나 얼려 두면 손이 닿을 때마다 깨운다
  function wakeAudio() {
    try { if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback"; } catch (e) {}
    if (!actx) return;
    try {
      const t = performance.now();
      if (actx.state === "running" && guardAT >= 0 && t - guardWall > 1500 && actx.currentTime === guardAT) {
        try { actx.close(); } catch (e) {}
        actx = null; audio(); if (!actx) return;
      }
      if (actx.state !== "running") actx.resume();
      const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
      src.buffer = b; src.connect(actx.destination); src.start(0);
      guardAT = actx.currentTime; guardWall = t;
    } catch (e) {}
  }
  ["pointerdown", "pointerup", "touchend", "click", "keydown"].forEach(ev => addEventListener(ev, wakeAudio, { capture: true, passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wakeAudio(); });
  addEventListener("pageshow", wakeAudio);

  function tone(f, dur, type = "sine", vol = 0.1, to = 0, delay = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, type = "highpass", freq = 2000, delay = 0, to = 0) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t0); if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master); src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
  }
  // 칩 단계마다 한 음씩 올라가는 5음 음계
  const PENTA = [0, 2, 4, 7, 9];
  const note = n => 261.63 * Math.pow(2, (Math.floor(n / 5) * 12 + PENTA[n % 5]) / 12);
  const sfx = {
    slide() { noise(0.07, 0.05, "bandpass", 1400, 0, 700); },
    merge(t) { // 찰칵 + 단계 음
      noise(0.03, 0.22, "highpass", 4200); tone(1800, 0.025, "square", 0.05, 900);
      const f = note(Math.min(t + 2, 22)); tone(f, 0.22, "triangle", 0.16, 0, 0.012); tone(f * 2, 0.16, "sine", 0.05, 0, 0.02);
    },
    newChip(t) { const b = Math.min(t + 2, 18); [0, 1, 2, 3, 5].forEach((s, i) => tone(note(b + s), 0.34, "triangle", 0.08, 0, 0.1 + i * 0.07)); },
    spawn() { tone(900, 0.04, "sine", 0.025, 1300); },
    clean() { noise(0.35, 0.09, "highpass", 6000, 0, 9000); [0, 4, 7, 11, 14].forEach((s, i) => tone(1046.5 * Math.pow(2, s / 12), 0.2, "sine", 0.05, 0, i * 0.045)); },
    dust() { noise(0.08, 0.08, "highpass", 3000, 0, 7000); tone(1600, 0.06, "sine", 0.03); },
    over() { tone(330, 0.8, "sawtooth", 0.07, 70); noise(0.6, 0.1, "lowpass", 900, 0, 120); tone(220, 0.6, "triangle", 0.08, 90, 0.15); },
    start() { tone(392, 0.1, "square", 0.04); tone(784, 0.16, "square", 0.04, 0, 0.09); },
  };
  const vib = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
  const sndBtn = document.getElementById("snd"), newBtn = document.getElementById("new");
  [sndBtn, newBtn].forEach(b => b.addEventListener("pointerdown", e => e.stopPropagation()));
  sndBtn.addEventListener("click", e => {
    e.stopPropagation(); sndOn = !sndOn; sndBtn.textContent = sndOn ? "소리 켬" : "소리 끔"; sndBtn.blur();
    if (audio()) master.gain.value = sndOn ? 0.85 : 0;
  });
  newBtn.addEventListener("click", e => { e.stopPropagation(); newBtn.blur(); audio(); start(); });

  // ================= 칩 계보 =================
  // h: 색상, pk: 패키지 크기(칸 대비), lr: 좌우 핀 수, all: 네 변 핀 수
  const TIERS = [null,
    { n: "트랜지스터", h: 168, s: 14, pk: 0.36, kind: "to" },
    { n: "게이트", h: 128, s: 46, pk: 0.36, lr: 2 },
    { n: "플립플롭", h: 178, s: 58, pk: 0.4, lr: 3 },
    { n: "레지스터", h: 208, s: 62, pk: 0.43, lr: 4 },
    { n: "ALU", h: 258, s: 56, pk: 0.44, all: 3 },
    { n: "코어", h: 300, s: 54, pk: 0.47, all: 4 },
    { n: "캐시", h: 22, s: 76, pk: 0.49, all: 5 },
    { n: "CPU", h: 44, s: 88, pk: 0.52, all: 5, lid: true },
    { n: "GPU", h: 352, s: 78, pk: 0.54, all: 6 },
    { n: "SoC", h: 190, s: 92, pk: 0.56, all: 7 },
    { n: "슈퍼칩", h: 0, s: 90, pk: 0.58, all: 7, rainbow: true },
  ];
  const tierName = t => t <= 11 ? TIERS[t].n : `슈퍼칩 ×${Math.pow(2, t - 11)}`;
  const tierInfo = t => TIERS[Math.min(t, 11)];
  const tierVal = t => Math.pow(2, t);

  // ================= 상태 =================
  const N = 4, SLIDE = 0.11, BX = 20, BY = 196, BS = 440, PAD = 14, GAP = 10, CS = (BS - PAD * 2 - GAP * 3) / N;
  const cellX = c => BX + PAD + c * (CS + GAP) + CS / 2, cellY = r => BY + PAD + r * (CS + GAP) + CS / 2;
  let state = "title", now = 0, last = performance.now();
  let G = [], ghosts = [], vanish = [], events = [], sparks = [], mists = [], pops = [], banner = null;
  let score = 0, shown = 0, best = +(store.get("merge.best") || 0), maxTier = 1, overAt = 0, newBest = false, moveAt = -9, uid = 0, noSpawn = false, bumpAt = -9;
  const empty = () => Array.from({ length: N }, () => Array(N).fill(null));
  const mk = (tier, r, c, o = {}) => ({ id: ++uid, tier, defect: false, dust: 0, dustShown: 0, r, c, fr: r, fc: c, born: -9, popAt: -9, prevTier: 0, ...o });
  const all = () => G.flat().filter(Boolean);

  function spawn(at) {
    const free = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!G[r][c]) free.push([r, c]);
    if (!free.length) return;
    const [r, c] = free[Math.floor(Math.random() * free.length)];
    const defects = all().filter(t => t.defect).length;
    if (score >= 200 && defects < 2 && Math.random() < 0.08) G[r][c] = mk(0, r, c, { defect: true, dust: 2, dustShown: 2, born: at });
    else { const t = Math.random() < 0.1 ? 2 : 1; G[r][c] = mk(t, r, c, { born: at }); maxTier = Math.max(maxTier, t); }
  }
  function canMove() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = G[r][c]; if (!t) return true;
      if (t.defect) continue;
      for (const [dr, dc] of [[0, 1], [1, 0]]) { const u = G[r + dr] && G[r + dr][c + dc]; if (u && !u.defect && u.tier === t.tier) return true; }
    }
    return false;
  }
  function start() {
    state = "play"; G = empty(); ghosts = []; vanish = []; events = []; sparks = []; mists = []; pops = []; banner = null;
    score = 0; shown = 0; maxTier = 1; newBest = false; moveAt = -9;
    spawn(now); spawn(now + 0.06); sfx.start(); newBtn.hidden = false;
  }
  function gameOver() {
    state = "over"; overAt = now; vib([60, 40, 80]); setTimeout(sfx.over, 160);
    if (score > best) { best = score; store.set("merge.best", String(best)); }
  }
  const DIRS = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] };
  function move(dir) {
    if (state !== "play" || !DIRS[dir]) return false;
    const [dr, dc] = DIRS[dir];
    // 이전 애니메이션은 바로 끝낸다
    for (const t of all()) { t.fr = t.r; t.fc = t.c; }
    ghosts = []; events.forEach(e => e.fn()); events = [];
    const NG = empty(), merges = []; let moved = false;
    for (let i = 0; i < N; i++) {
      const cells = [];
      for (let k = 0; k < N; k++) {
        const j = (dr + dc) > 0 ? N - 1 - k : k;
        cells.push(dr ? [j, i] : [i, j]);
      }
      const out = [];
      for (const [r, c] of cells) {
        const t = G[r][c]; if (!t) continue;
        const lt = out[out.length - 1];
        if (lt && !lt.m && !lt.t.defect && !t.defect && lt.t.tier === t.tier) { lt.m = true; ghosts.push({ t, to: lt }); }
        else out.push({ t, m: false });
      }
      out.forEach((o, k) => { const [r, c] = cells[k]; if (o.t.r !== r || o.t.c !== c) moved = true; o.t.r = r; o.t.c = c; NG[r][c] = o.t; if (o.m) merges.push(o.t); });
    }
    if (!moved && !merges.length) { bumpAt = now; return false; }
    G = NG; moveAt = now;
    for (const g of ghosts) { g.r = g.to.t.r; g.c = g.to.t.c; g.tier = g.t.tier; g.fr = g.t.fr; g.fc = g.t.fc; }
    const at = now + SLIDE;
    let gain = 0;
    for (const t of merges) {
      t.prevTier = t.tier; t.tier++; t.popAt = at; gain += tierVal(t.tier);
      const fresh = t.tier > maxTier; maxTier = Math.max(maxTier, t.tier);
      events.push({ at, fn: () => { sfx.merge(t.tier); traceSparks(t); if (fresh && t.tier >= 3) { banner = { at: now, tier: t.tier }; sfx.newChip(t.tier); } } });
    }
    if (merges.length) { const big = Math.max(...merges.map(t => t.tier)); events.push({ at, fn: () => vib(big >= 8 ? 22 : 10) }); }
    else sfx.slide();
    // 세정: 합친 자리 상하좌우의 불량 다이 먼지가 하나씩 털린다
    for (const t of merges) for (const [a, b] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
      const d = G[t.r + a] && G[t.r + a][t.c + b]; if (!d || !d.defect) continue;
      d.dust--;
      if (d.dust <= 0) {
        G[d.r][d.c] = null; gain += 20; vanish.push(d);
        events.push({ at: at + 0.04, fn: () => { vanish = vanish.filter(v => v !== d); puff(d); sfx.clean(); pops.push({ text: "세정 완료 +20", x: cellX(d.c), y: cellY(d.r), at: now, c: "#e6fff4" }); } });
      } else events.push({ at: at + 0.04, fn: () => { d.dustShown = d.dust; sfx.dust(); dustPuff(d); } });
    }
    score += gain;
    if (gain) events.push({ at, fn: () => { pops.push({ text: `+${gain}`, x: 163, y: 164 - Math.min(56, Math.max(0, -EY0) * 0.45), at: now, c: "#ffcf3a", hud: true }); } });
    if (!noSpawn) { spawn(at); events.push({ at, fn: sfx.spawn }); }
    if (score > best) { best = score; newBest = true; store.set("merge.best", String(best)); }
    if (!canMove()) gameOver();
    return true;
  }

  // ================= 입자 =================
  function traceSparks(t) {
    const x = cellX(t.c), y = cellY(t.r), n = 10 + Math.min(t.tier, 12) * 1.5;
    for (let i = 0; i < n; i++) {
      // 기판 배선처럼 8방향 직선으로만 뻗는다
      const a = Math.floor(rand(0, 8)) * Math.PI / 4 + rand(-0.06, 0.06), v = rand(150, 320);
      sparks.push({ x: x + Math.cos(a) * CS * 0.42, y: y + Math.sin(a) * CS * 0.42, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: rand(0.25, 0.5), c: t.tier >= 11 ? `hsl(${rand(0, 360)},100%,70%)` : Math.random() < 0.75 ? "#ffcf3a" : "#fff2b8" });
    }
  }
  function puff(d) {
    const x = cellX(d.c), y = cellY(d.r);
    for (let i = 0; i < 16; i++) { const a = rand(0, 7), v = rand(20, 90); mists.push({ x: x + rand(-20, 20), y: y + rand(-20, 20), vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, r: rand(10, 22), t: 0, life: rand(0.6, 1.1) }); }
    for (let i = 0; i < 10; i++) mists.push({ x: x + rand(-CS / 2, CS / 2), y: y + rand(-CS / 2, CS / 2), vx: 0, vy: rand(-40, -10), r: rand(4, 8), t: -rand(0, 0.25), life: rand(0.5, 0.8), star: true });
  }
  function dustPuff(d) {
    const x = cellX(d.c), y = cellY(d.r);
    for (let i = 0; i < 7; i++) { const a = rand(0, 7), v = rand(20, 60); mists.push({ x: x + rand(-25, 25), y: y + rand(-25, 25), vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, r: rand(5, 10), t: 0, life: rand(0.4, 0.7), grey: true }); }
  }

  // ================= 입력 =================
  let ptr = null;
  function press() {
    audio(); wakeAudio();
    if (state === "title") { start(); return true; }
    if (state === "over") { if (now - overAt > 1) start(); return true; }
    return false;
  }
  addEventListener("pointerdown", e => {
    if (e.button > 0) return;
    if (press()) { ptr = null; return; }
    ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, done: false };
  });
  addEventListener("pointermove", e => {
    if (!ptr || ptr.done || e.pointerId !== ptr.id) return;
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    ptr.done = true;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  addEventListener("pointerup", () => { ptr = null; });
  addEventListener("pointercancel", () => { ptr = null; });
  const KEYS = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down" };
  addEventListener("keydown", e => {
    const d = KEYS[e.code];
    if (d || e.code === "Space" || e.code === "Enter") e.preventDefault();
    if (e.repeat && !d) return;
    if (state !== "play") { if (d || e.code === "Space" || e.code === "Enter") press(); return; }
    if (d) move(d);
  });
  addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

  // ================= 갱신 =================
  function update(dt) {
    if (events.length) { const due = events.filter(e => now >= e.at); events = events.filter(e => now < e.at); due.forEach(e => e.fn()); }
    if (now - moveAt > SLIDE) ghosts = [];
    for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= Math.pow(0.04, dt); s.vy *= Math.pow(0.04, dt); }
    sparks = sparks.filter(s => s.t < s.life);
    for (const m of mists) { m.t += dt; if (m.t < 0) continue; m.x += m.vx * dt; m.y += m.vy * dt; m.vx *= Math.pow(0.1, dt); m.vy *= Math.pow(0.3, dt); }
    mists = mists.filter(m => m.t < m.life);
    pops = pops.filter(p => now - p.at < 0.9);
    shown = shown < score ? Math.min(score, shown + Math.max(1, (score - shown) * dt * 12)) : score;
  }

  // ================= 그리기 =================
  function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
  function fitFont(text, maxW, px, fam) {
    ctx.font = `${px}px ${fam}`; const w = ctx.measureText(text).width;
    if (w > maxW) ctx.font = `${Math.floor(px * maxW / w)}px ${fam}`;
  }
  function buildBg() {
    const c = document.createElement("canvas");
    c.width = Math.ceil((EX1 - EX0) * S * DPR); c.height = Math.ceil((EY1 - EY0) * S * DPR);
    const g = c.getContext("2d"); g.setTransform(S * DPR, 0, 0, S * DPR, -EX0 * S * DPR, -EY0 * S * DPR);
    const gr = g.createLinearGradient(0, EY0, 0, EY1);
    gr.addColorStop(0, "#020605"); gr.addColorStop(0.6, "#05120e"); gr.addColorStop(1, "#071a14");
    g.fillStyle = gr; g.fillRect(EX0, EY0, EX1 - EX0, EY1 - EY0);
    // 기판 배선: 직각으로 꺾이는 가는 금빛·초록 선

    if (t.defect) drawDefect(t, 0, 0, CS);
    else drawChip(now < t.popAt ? t.prevTier : t.tier, 0, 0, CS);
    ctx.restore();
    if (pe >= 0 && pe < 0.35) { // 합친 자리 금빛 고리
      const u = easeOut(pe / 0.35); ctx.save(); ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = `rgba(255,207,58,${0.9 * (1 - u)})`; ctx.lineWidth = 4 * (1 - u) + 1;
      const k = CS * (0.55 + u * 0.35); rr(p.x - k, p.y - k, k * 2, k * 2, 14 + u * 10); ctx.stroke(); ctx.restore();
    }
  }
  function drawBoard() {
    for (const g of ghosts) { const p = tilePos(g); ctx.save(); ctx.translate(p.x, p.y); drawChip(g.tier, 0, 0, CS); ctx.restore(); }
    for (const v of vanish) { ctx.save(); ctx.translate(cellX(v.c) + (v.r === v.fr && v.c === v.fc ? 0 : 0), cellY(v.r)); drawDefect(v, 0, 0, CS); ctx.restore(); }
    for (const t of all()) if (now >= t.popAt) drawTile(t);
    for (const t of all()) if (now < t.popAt) drawTile(t);
  }
  function drawFx() {
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
    for (const s of sparks) {
      const a = 1 - s.t / s.life; ctx.strokeStyle = s.c; ctx.globalAlpha = a; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.045, s.y - s.vy * 0.045); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.fillRect(s.x - 1.2, s.y - 1.2, 2.4, 2.4);
    }
    ctx.restore();
    for (const m of mists) {
      if (m.t < 0) continue;
      const u = m.t / m.life, a = (1 - u) * (u < 0.15 ? u / 0.15 : 1);
      if (m.star) {
        ctx.fillStyle = `rgba(255,255,255,${a})`; const r = m.r * (0.6 + Math.sin(u * Math.PI) * 0.6);
        ctx.beginPath(); ctx.moveTo(m.x, m.y - r); ctx.lineTo(m.x + r * 0.22, m.y - r * 0.22); ctx.lineTo(m.x + r, m.y); ctx.lineTo(m.x + r * 0.22, m.y + r * 0.22);
        ctx.lineTo(m.x, m.y + r); ctx.lineTo(m.x - r * 0.22, m.y + r * 0.22); ctx.lineTo(m.x - r, m.y); ctx.lineTo(m.x - r * 0.22, m.y - r * 0.22); ctx.closePath(); ctx.fill();
      } else {
        const r = m.r * (1 + u * 1.4), gr = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, r);
        const col = m.grey ? "200,185,160" : "235,250,255";
        gr.addColorStop(0, `rgba(${col},${0.55 * a})`); gr.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, 7); ctx.fill();
      }
    }
    ctx.textAlign = "center";
    for (const p of pops) {
      const u = (now - p.at) / 0.9; ctx.globalAlpha = 1 - u * u;
      ctx.font = `${p.hud ? 20 : 17}px ${FONT.kr}`; ctx.fillStyle = p.c; ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = 5;
      ctx.fillText(p.text, p.x, p.y - u * (p.hud ? 14 : 34)); ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }
  function scoreBox(x, label, val, hi) {
    rr(x, 78, 150, 58, 12); ctx.fillStyle = "rgba(4,20,15,.78)"; ctx.fill();
    ctx.strokeStyle = hi ? "rgba(255,207,58,.6)" : "rgba(93,255,195,.35)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.textAlign = "center"; ctx.font = `13px ${FONT.kr}`; ctx.fillStyle = hi ? "#ffcf3a" : "#6fa58f"; ctx.fillText(label, x + 75, 97);
    ctx.font = `900 ${val >= 100000 ? 18 : 22}px ${FONT.num}`; ctx.fillStyle = "#e6fff4"; ctx.fillText(String(val), x + 75, 125);
  }
  function drawHUD() {
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    // 세로로 남는 자리가 있으면 위 점수판은 조금 올리고 아래 계보는 조금 내린다
    const up = Math.min(56, Math.max(0, -EY0) * 0.45), dn = Math.min(56, Math.max(0, EY1 - H) * 0.45);
    ctx.save(); ctx.translate(0, -up);
    ctx.font = `700 12px ${FONT.num}`; ctx.fillStyle = "#6fa58f"; ctx.fillText("DIE MERGE FAB", 240, 34);
    if (state !== "title") { ctx.font = `30px ${FONT.kr}`; ctx.fillStyle = "#e6fff4"; ctx.shadowColor = "rgba(93,255,195,.55)"; ctx.shadowBlur = 14; ctx.fillText("다이 합치기", 240, 66); ctx.shadowBlur = 0; }
    scoreBox(88, "점수", Math.floor(shown), false);
    scoreBox(242, "최고", best, newBest && state !== "title");
    ctx.font = `16px ${FONT.kr}`; ctx.fillStyle = "#cfe9dd"; ctx.textAlign = "center";
    const mt = state === "title" ? null : tierName(maxTier);
    if (mt) { ctx.fillText("최고 칩: ", 240 - ctx.measureText(mt).width / 2, 170); ctx.fillStyle = `hsl(${tierInfo(maxTier).rainbow ? now * 80 % 360 : tierInfo(maxTier).h},90%,70%)`; ctx.fillText(mt, 240 + ctx.measureText("최고 칩: ").width / 2, 170); }
    else { ctx.fillStyle = "#6fa58f"; ctx.fillText("트랜지스터에서 슈퍼칩까지", 240, 170); }
    ctx.restore();
    // 아래: 칩 계보 사다리
    const y = 688 + dn, s = 34, step = 40.5, x0 = 240 - step * 5;
    ctx.strokeStyle = "rgba(255,207,58,.25)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + step * 10, y); ctx.stroke();
    for (let t = 1; t <= 11; t++) {
      const on = state !== "title" && t <= maxTier;
      ctx.save(); ctx.globalAlpha = on ? 1 : state === "title" ? 0.7 : 0.22; drawChip(t, x0 + (t - 1) * step, y, s, false); ctx.restore();
    }
    ctx.font = `13px ${FONT.kr}`; ctx.fillStyle = "#6fa58f"; ctx.textAlign = "left"; ctx.fillText("트랜지스터", x0 - 17, y + 36);
    ctx.textAlign = "right"; ctx.fillText("슈퍼칩", x0 + step * 10 + 17, y + 36);
    if (state === "play" && now - bumpAt < 0.5) { ctx.globalAlpha = 1 - (now - bumpAt) / 0.5; ctx.textAlign = "center"; ctx.fillStyle = "#ffb547"; ctx.fillText("그쪽으로는 안 밀려요", 240, BY + BS + 26); ctx.globalAlpha = 1; }
    // 새 칩 개발 배너
    if (banner && now - banner.at < 1.9) {
      const e = now - banner.at, a = e < 0.18 ? e / 0.18 : e > 1.5 ? (1.9 - e) / 0.4 : 1, sc = e < 0.18 ? 0.7 + e / 0.18 * 0.3 : 1;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(240, 124 - up); ctx.scale(sc, sc);
      rr(-190, -64, 380, 128, 16); ctx.fillStyle = "rgba(4,16,12,.9)"; ctx.fill(); ctx.strokeStyle = "#ffcf3a"; ctx.lineWidth = 2.5; ctx.stroke();
      drawChip(banner.tier, -122, 0, 96);
      ctx.textAlign = "left"; ctx.font = `20px ${FONT.kr}`; ctx.fillStyle = "#ffb547"; ctx.fillText("새 칩 개발!", -58, -14);
      fitFont(tierName(banner.tier), 230, 40, FONT.kr); ctx.fillStyle = "#fff6dc"; ctx.shadowColor = "rgba(255,207,58,.8)"; ctx.shadowBlur = 16; ctx.fillText(tierName(banner.tier), -58, 30); ctx.shadowBlur = 0;
      ctx.restore();
    }
    ctx.restore();
  }
  function drawTitle() {
    ctx.save();
    rr(BX, BY, BS, BS, 18); ctx.fillStyle = "rgba(2,8,6,.6)"; ctx.fill();
    rr(BX + 30, BY + 50, BS - 60, BS - 100, 16); ctx.fillStyle = "rgba(4,16,12,.9)"; ctx.fill(); ctx.strokeStyle = "rgba(93,255,195,.45)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.textAlign = "center";
    ctx.font = `700 14px ${FONT.num}`; ctx.fillStyle = "#6fa58f"; ctx.fillText("4 × 4 WAFER TRAY", 240, BY + 92);
    ctx.font = `64px ${FONT.kr}`; ctx.fillStyle = "#e6fff4"; ctx.shadowColor = "rgba(93,255,195,.7)"; ctx.shadowBlur = 22; ctx.fillText("다이 합치기", 240, BY + 160); ctx.shadowBlur = 0;
    ctx.font = `19px ${FONT.kr}`; ctx.fillStyle = "#cfe9dd";
    ctx.fillText("밀어서 같은 칩을 합치세요", 240, BY + 214);
    ctx.fillStyle = "#ffb0a8"; ctx.fillText("불량 다이 옆에서 두 번 합치면 세정", 240, BY + 244);
    ctx.font = `14px ${FONT.kr}`; ctx.fillStyle = "#6fa58f"; ctx.fillText("밀기 · 화살표 · WASD", 240, BY + 274);
    // 합치기 그림: 트랜지스터 + 트랜지스터 → 게이트
    drawChip(1, 150, BY + 318, 50, false); drawChip(1, 214, BY + 318, 50, false); drawChip(2, 318, BY + 318, 50, false);
    ctx.font = `24px ${FONT.kr}`; ctx.fillStyle = "#ffcf3a"; ctx.textAlign = "center"; ctx.fillText("+", 182, BY + 326); ctx.fillText("→", 266, BY + 326);
    ctx.globalAlpha = 0.55 + Math.sin(now * 4) * 0.35; ctx.font = `26px ${FONT.kr}`; ctx.fillStyle = "#5dffc3"; ctx.fillText("눌러서 시작", 240, BY + 376); ctx.globalAlpha = 1;
    ctx.restore();
  }
  function drawOver() {
    const e = now - overAt, a = clamp(e / 0.5, 0, 1);
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = "center";
    rr(BX, BY, BS, BS, 18); ctx.fillStyle = "rgba(2,8,6,.62)"; ctx.fill();
    const sc = 0.9 + easeOut(a) * 0.1; ctx.translate(240, BY + BS / 2); ctx.scale(sc, sc);
    rr(-190, -170, 380, 380, 16); ctx.fillStyle = "rgba(4,14,11,.92)"; ctx.fill(); ctx.strokeStyle = "rgba(255,181,71,.55)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = "rgba(255,90,60,.8)"; ctx.fillRect(-190, -150, 380, 3);
    ctx.font = `700 13px ${FONT.num}`; ctx.fillStyle = "#ff8a6a"; ctx.fillText("LINE STOP", 0, -124);
    ctx.font = `56px ${FONT.kr}`; ctx.fillStyle = "#ffb547"; ctx.shadowColor = "rgba(255,120,60,.6)"; ctx.shadowBlur = 18; ctx.fillText("라인 정지", 0, -74); ctx.shadowBlur = 0;
    ctx.font = `17px ${FONT.kr}`; ctx.fillStyle = "#cfe9dd"; ctx.fillText("더 밀 곳이 없어요", 0, -42);
    ctx.font = `900 40px ${FONT.num}`; ctx.fillStyle = "#e6fff4"; ctx.fillText(String(score), 0, 10);
    ctx.font = `16px ${FONT.kr}`; ctx.fillStyle = newBest ? "#ffcf3a" : "#6fa58f"; ctx.fillText(newBest ? "최고 기록!" : `최고 ${best}`, 0, 38);
    drawChip(maxTier, -60, 92, 64); ctx.textAlign = "left"; ctx.font = `14px ${FONT.kr}`; ctx.fillStyle = "#6fa58f"; ctx.fillText("최고 칩", -16, 84);
    fitFont(tierName(maxTier), 110, 24, FONT.kr); ctx.fillStyle = "#fff6dc"; ctx.fillText(tierName(maxTier), -16, 112);
    if (e > 1) {
      ctx.globalAlpha = a * (0.65 + Math.sin(now * 4) * 0.3); ctx.textAlign = "center";
      rr(-80, 146, 160, 42, 21); ctx.fillStyle = "rgba(93,255,195,.14)"; ctx.fill(); ctx.strokeStyle = "#5dffc3"; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.font = `20px ${FONT.kr}`; ctx.fillStyle = "#5dffc3"; ctx.fillText("다시 시작", 0, 174);
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!bgCache) bgCache = buildBg();
    ctx.drawImage(bgCache, (OX + EX0 * S) * DPR, (OY + EY0 * S) * DPR);
    ctx.setTransform(S * DPR, 0, 0, S * DPR, OX * DPR, OY * DPR);
    drawBoard();
    drawFx();
    if (state === "title") drawTitle();
    if (state === "over") drawOver();
    drawHUD();
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (!document.hidden) { now += dt; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  // 제목 화면 뒤 장식: 칩 계보 몇 장
  G = empty(); [[0, 0, 1], [0, 1, 2], [0, 2, 3], [0, 3, 4], [1, 3, 5], [2, 3, 6], [3, 3, 7], [3, 2, 8], [3, 1, 9], [3, 0, 10], [2, 0, 11]].forEach(([r, c, t]) => { G[r][c] = mk(t, r, c); });
  G[1][1] = mk(0, 1, 1, { defect: true, dust: 2, dustShown: 2 });
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { FONT.kr = css("--kr"); FONT.num = css("--num"); });

  // 테스트용 훅
  const snap = () => G.map(row => row.map(t => t ? { tier: t.tier, defect: t.defect, dust: t.dust } : null));
  window.__merge = {
    get state() { return state; }, get score() { return score; }, get grid() { return snap(); }, get maxTier() { return maxTier; },
    get noSpawn() { return noSpawn; }, set noSpawn(v) { noSpawn = !!v; },
    move, start,
    set(g) {
      if (state !== "play") start();
      G = g.map((row, r) => row.map((t, c) => t ? mk(t.defect ? 0 : t.tier, r, c, { defect: !!t.defect, dust: t.defect ? (t.dust == null ? 2 : t.dust) : 0, dustShown: t.defect ? (t.dust == null ? 2 : t.dust) : 0 }) : null));
      maxTier = Math.max(1, ...all().map(t => t.tier)); ghosts = []; events = []; vanish = [];
      if (!canMove()) gameOver();
    },
  };
})();
</script>
